  const [shPb2, setShPb2] = useState(false);
  const [shSelf, setShSelf] = useState(false);

  const [ilPb1, setIlPb1] = useState(false);
  const [ilPb2, setIlPb2] = useState(false);

  const [mc2State, setMc2State] = useState(false);
  const [ilWarning, setIlWarning] = useState('');

  const [ydStart, setYdStart] = useState(false);
  const [ydTimerSec, setYdTimerSec] = useState(3);
  const [ydCurrentSec, setYdCurrentSec] = useState(0);
  const [ydMcMain, setYdMcMain] = useState(false);
  const [ydMcY, setYdMcY] = useState(false);
  const [ydMcDelta, setYdMcDelta] = useState(false);

  // EOCR 상태
  const [eocrOvercurrent, setEocrOvercurrent] = useState(false);
  const [eocrTrip, setEocrTrip] = useState(false);

  // 퀴즈 상태
  const [quizAnswers, setQuizAnswers] = useState({});
  const [quizSubmitted, setQuizSubmitted] = useState(false);

  // 이미지 모달 팝업 상태
  const [modalImage, setModalImage] = useState(null);

  // 자기유지 처리
  useEffect(() => {
    if (shPb1) {
      setShSelf(true);
    }
    if (shPb2) {
      setShSelf(false);
    }
  }, [shPb1, shPb2]);

  // 인터록 처리
  useEffect(() => {
    if (ilPb1 && !mc2State) {
      setMc1State(true);
      setIlWarning('');
    } else if (ilPb1 && mc2State) {
      setIlWarning('인터록 차단! MC2가 동작 중이므로 MC1 전원이 차단되었습니다.');
    } else if (!ilPb1) {
      setMc1State(false);
    }

    if (ilPb2 && !mc1State) {
      setMc2State(true);
      setIlWarning('');
    } else if (ilPb2 && mc1State) {
      setIlWarning('인터록 차단! MC1이 동작 중이므로 MC2 전원이 차단되었습니다.');
    } else if (!ilPb2) {
      setMc2State(false);
    }
  }, [ilPb1, ilPb2, mc1State, mc2State]);

  // Y-Delta 타이머
  useEffect(() => {
    let timerId;
    if (ydStart) {
      setYdMcMain(true);
      setYdMcY(true);
      setYdMcDelta(false);
      setYdCurrentSec(0);

      timerId = setInterval(() => {
        setYdCurrentSec((prev) => {
          if (prev + 1 >= ydTimerSec) {
            setYdMcY(false);
            setYdMcDelta(true);
            clearInterval(timerId);
            return ydTimerSec;
          }
          return prev + 1;
        });
      }, 1000);
    } else {
      setYdMcMain(false);
      setYdMcY(false);
      setYdMcDelta(false);
      setYdCurrentSec(0);
    }
    return () => clearInterval(timerId);
  }, [ydStart, ydTimerSec]);

    if (eocrOvercurrent) {
      setEocrTrip(true);
    }

                    <span className="text-xs text-slate-400 font-semibold">실물 원형 소켓 핀배치도</span>
                    <div className="relative w-52 h-52 bg-slate-900 rounded-full border-4 border-slate-700 flex items-center justify-center shadow-inner">
                      <div className="w-10 h-10 rounded-full bg-slate-950 border-2 border-slate-800 flex items-center justify-center text-[9px] text-slate-500 font-mono">
                        Notch
                      </div>
                      {deviceData[selectedDevice].pins.map((pin, idx, arr) => {
                        const total = arr.length;
                        const angle = (idx * (360 / total) + 90) * (Math.PI / 180);
                        const radius = 72;
                        const x = Math.cos(angle) * radius;
                        const y = Math.sin(angle) * radius;

                        const isSelected = selectedPin === pin.num;
                        const isPower = deviceData[selectedDevice].powerPins?.includes(pin.num);

                        return (
                          <button
                            key={pin.num}
                            onClick={() => setSelectedPin(pin.num)}
                            style={{ transform: `translate(${x}px, ${y}px)` }}
                            className={`absolute w-9 h-9 rounded-full font-extrabold text-xs flex items-center justify-center border-2 transition-all shadow ${
                              isSelected
                                ? 'bg-amber-400 text-slate-950 border-white scale-125 z-10'
                                : isPower
                                ? 'bg-sky-950 text-sky-400 border-sky-500'
                                : 'bg-slate-800 text-slate-200 border-slate-600 hover:border-amber-400'
                            }`}
                          >
                            {pin.num}
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  {/* Part C: 실제 전기기구 내부결선도 (실물 도면 사진 및 SVG 추가) */}
                  <div className="border-t border-slate-800 pt-4 space-y-4">
                    <div className="flex items-center justify-between">
                      <span className="text-xs font-bold text-amber-400 flex items-center space-x-1.5">
                        <ImageIcon className="w-4 h-4" />
                        <span>실제 전기기구 내부결선도 (실물 사진/도면)</span>
                      </span>
                      <button
                        onClick={() => setModalImage(deviceData[selectedDevice].schematicImg)}
                        className="text-[11px] text-amber-400 hover:text-amber-300 flex items-center space-x-1 bg-amber-500/10 px-2.5 py-1 rounded-lg border border-amber-500/30"
                      >
                        <Maximize2 className="w-3 h-3" />
                        <span>사진 크게 보기</span>
                      </button>
                    </div>

                    {/* 실제 첨부된 기구 도면 사진 연동 */}
                    <div className="bg-slate-900 rounded-xl border border-slate-800 p-3 flex flex-col items-center justify-center overflow-hidden">
                      <img
                        src={deviceData[selectedDevice].schematicImg}
                        alt={`${deviceData[selectedDevice].name} 내부결선도`}
                        className="max-h-64 object-contain rounded-lg border border-slate-700/60 shadow cursor-pointer hover:opacity-95 transition-all"
                        onClick={() => setModalImage(deviceData[selectedDevice].schematicImg)}
                        onError={(e) => {
                          e.target.onerror = null;
                          e.target.style.display = 'none';
                          document.getElementById(`fallback-${selectedDevice}`).style.display = 'flex';
                        }}
                      />
                      {/* 이미지 로드 실패 시 대체 대체 안내 카드 */}
                      <div
                        id={`fallback-${selectedDevice}`}
                        className="hidden flex-col items-center justify-center p-6 text-center space-y-2 bg-slate-950 rounded-xl border border-dashed border-slate-700 text-slate-400 w-full"
                      >
                        <ImageIcon className="w-8 h-8 text-slate-500 mb-1" />
                        <p className="text-xs font-bold text-slate-300">
                          {deviceData[selectedDevice].name} 실제 결선도 이미지 준비 중
                        </p>
                        <p className="text-[11px] text-slate-500">
                          경로: <code className="text-amber-400">{deviceData[selectedDevice].schematicImg}</code>
                        </p>
                      </div>
                    </div>

                    {/* 정밀 벡터 SVG 회로도 */}
                    <div className="bg-slate-900 p-4 rounded-xl border border-slate-800 flex flex-col items-center justify-center space-y-2">
                      <span className="text-[11px] font-bold text-slate-400">기구 표준 접점 구조도 (SVG)</span>
                      <svg viewBox="0 0 450 180" className="w-full max-w-md h-auto text-slate-300 select-none">
                        <rect x="40" y="60" width="70" height="40" rx="6" fill="#1e293b" stroke="#38bdf8" strokeWidth="2" />
                        <text x="75" y="80" textAnchor="middle" fill="#38bdf8" fontSize="10" fontWeight="bold">전원 코일</text>
                        <text x="75" y="93" textAnchor="middle" fill="#94a3b8" fontSize="9">
                          핀({deviceData[selectedDevice].powerPins?.join(', ')}번)
                        </text>
                        <line x1="110" y1="80" x2="160" y2="80" stroke="#38bdf8" strokeWidth="2" strokeDasharray="3,3" />

                        <rect x="160" y="30" width="250" height="120" fill="#0f172a" stroke="#475569" strokeWidth="1.5" rx="8" />
                        <text x="285" y="22" textAnchor="middle" fill="#f59e0b" fontSize="10" fontWeight="bold">
                          {selectedDevice === 'mc12' ? '12핀 MC 주회로 및 보조접점' : selectedDevice === 'eocr12' ? '12핀 EOCR 95-96-98 접점부' : '기구 내부 접점부'}
                        </text>

                        <circle cx="180" cy="90" r="5" fill="#f59e0b" />
                        <text x="180" y="110" textAnchor="middle" fill="#f59e0b" fontSize="9" fontWeight="bold">
                          접점부 C
                        </text>
                        <line x1="180" y1="90" x2="280" y2="55" stroke="#cbd5e1" strokeWidth="3" />

                        <circle cx="280" cy="55" r="5" fill="#22c55e" />
                        <line x1="285" y1="55" x2="380" y2="55" stroke="#22c55e" strokeWidth="2" />
                        <text x="330" y="48" fill="#86efac" fontSize="9" fontWeight="bold">b접점 (NC)</text>

                        <circle cx="280" cy="125" r="5" fill="#ef4444" />
                        <line x1="285" y1="125" x2="380" y2="125" stroke="#ef4444" strokeWidth="2" />
                        <text x="330" y="140" fill="#fca5a5" fontSize="9" fontWeight="bold">a접점 (NO)</text>
                      </svg>
                    </div>
                  </div>
                </div>

                {/* 우측 핀 상세 정보 */}
                <div className="lg:col-span-5 bg-slate-800 rounded-2xl border border-slate-700 p-5 space-y-4 flex flex-col justify-between">
                  <div className="space-y-4">
                    <div className="border-b border-slate-700 pb-3">
                      <h4 className="text-xs font-bold text-slate-400 uppercase tracking-wider">기구 기능 및 용도</h4>
                      <p className="text-sm text-slate-200 mt-1 leading-relaxed">{deviceData[selectedDevice].usage}</p>
                    </div>
                    {selectedPin ? (
                      <div className="bg-amber-500/10 border border-amber-500/30 p-4 rounded-xl space-y-1.5 animate-fadeIn">
                        <div className="flex items-center justify-between">
                          <span className="text-xs font-bold text-amber-400">핀 번호 #{selectedPin} 상세</span>
                          <span className="text-xs font-bold px-2 py-0.5 bg-amber-500 text-slate-950 rounded">
                            {deviceData[selectedDevice].pins.find((p) => p.num === selectedPin)?.label}
                          </span>
                        </div>
                        <p className="text-xs text-slate-200">
                          {deviceData[selectedDevice].pins.find((p) => p.num === selectedPin)?.desc}
                        </p>
                      </div>
                    ) : (
                      <div className="bg-slate-900/60 p-4 rounded-xl border border-slate-700/60 text-xs text-slate-400 text-center">
                        좌측 소켓의 핀 번호를 클릭하면 해당 단자의 결선 및 상세 기능 설명이 나타납니다.
                      </div>
                    )}

                    <div className="bg-slate-900 p-4 rounded-xl border border-slate-700/60 space-y-2">
                      <div className="text-xs font-bold text-amber-400 flex items-center space-x-1">
                        <Award className="w-4 h-4" />
                        <span>시험 핵심 합격 팁 (TIP)</span>
                      </div>
                      <p className="text-xs text-slate-300 leading-relaxed">{deviceData[selectedDevice].tip}</p>
                    </div>
                  </div>
                </div>
              </div>
            )}
          </div>
        )}

        {/* TAB 3: 퀴즈 */}
        {activeTab === 'quiz' && (
          <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 space-y-6 animate-fadeIn">
            <div className="flex items-center justify-between border-b border-slate-700 pb-4">
              <div>
                <h2 className="text-base font-bold text-amber-400 flex items-center space-x-2">
                  <HelpCircle className="w-5 h-5" />
                  <span>전기기능사 실기 핀배치 및 단자 번호 핵심 퀴즈</span>
                </h2>
                <p className="text-xs text-slate-400 mt-1">자주 출제되는 실기 단자 번호와 접점 구조 점검</p>
              </div>
            </div>

            <div className="space-y-6">
              {quizQuestions.map((q, idx) => {
                const userAns = quizAnswers[q.id];
                const isCorrect = userAns === q.correct;

                return (
                  <div key={q.id} className="bg-slate-900 p-5 rounded-xl border border-slate-700 space-y-3">
                    <div className="text-sm font-bold text-slate-200 flex items-start space-x-2">
                      <span className="text-amber-400 font-black">Q{idx + 1}.</span>
                      <span>{q.question}</span>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-1">
                      {q.options.map((opt, oIdx) => {
                        const isSelected = userAns === oIdx;
                        let btnStyle = 'bg-slate-800 border-slate-700 text-slate-300 hover:bg-slate-750';

                        if (quizSubmitted) {
                          if (oIdx === q.correct) {
                            btnStyle = 'bg-emerald-500/20 border-emerald-500 text-emerald-300 font-bold';
                          } else if (isSelected && !isCorrect) {
                            btnStyle = 'bg-rose-500/20 border-rose-500 text-rose-300';
                          }
                        } else if (isSelected) {
                          btnStyle = 'bg-amber-500 text-slate-950 font-bold border-amber-400';
                        }

                        return (
                          <button
                            key={oIdx}
                            disabled={quizSubmitted}
                            onClick={() => setQuizAnswers((prev) => ({ ...prev, [q.id]: oIdx }))}
                            className={`p-3 rounded-xl border text-left text-xs transition-all ${btnStyle}`}
                          >
                            {opt}
                          </button>
                        );
                      })}
                    </div>

                    {quizSubmitted && (
                      <div className="p-3 bg-slate-950 rounded-xl border border-slate-800 text-xs text-slate-300 space-y-1">
                        <span className="text-amber-400 font-bold block mb-0.5">해설:</span>
                        {q.explanation}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>

            <div className="flex justify-between items-center pt-2">
              <div className="text-xs text-slate-400">응답: {Object.keys(quizAnswers).length} / {quizQuestions.length}</div>
              {!quizSubmitted ? (
                <button
                  onClick={() => setQuizSubmitted(true)}
                  className="px-6 py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl shadow-lg"
                >
                  채점하기
                </button>
              ) : (
                <button
                  onClick={() => { setQuizAnswers({}); setQuizSubmitted(false); }}
                  className="px-6 py-3 bg-slate-700 hover:bg-slate-600 text-slate-200 font-bold rounded-xl"
                >
                  다시 풀기
                </button>
              )}
            </div>
          </div>
        )}
      </main>

      {/* 이미지 크게 보기 모달 */}
      {modalImage && (
        <div
          onClick={() => setModalImage(null)}
          className="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4 cursor-pointer animate-fadeIn"
        >
          <div className="relative max-w-4xl w-full bg-slate-900 border border-slate-700 rounded-2xl p-4 overflow-hidden shadow-2xl">
            <button
              onClick={() => setModalImage(null)}
              className="absolute top-3 right-3 p-2 rounded-full bg-slate-800 text-slate-300 hover:text-white hover:bg-slate-700"
            >
              <X className="w-5 h-5" />
            </button>
            <div className="text-xs font-bold text-amber-400 mb-2">실제 전기기구 내부결선도 고화질 원본</div>
            <img
              src={modalImage}
              alt="실제 전기기구 내부결선도"
              className="w-full h-auto max-h-[80vh] object-contain rounded-xl bg-slate-950 border border-slate-800"
            />
          </div>
        </div>
      )}

      <footer className="border-t border-slate-800 bg-slate-950 py-4 text-center text-xs text-slate-500">
        전기기능사 실기 마스터 PRO · 업로드하신 내부 결선도 및 Q-Net 시험 규격 완벽 반영
      </footer>
    </div>
  );
}

import { createRoot } from 'react-dom/client';
const bootEl = document.getElementById('boot');
if (bootEl) bootEl.remove();
const root = createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
