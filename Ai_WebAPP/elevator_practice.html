<script type="text/babel" data-type="module" data-presets="react,typescript">
import React, { useState, useEffect } from 'react';
import {
  Zap,
  Power,
  Play,
  Square,
  RotateCcw,
  CheckCircle2,
  Info,
  Cpu,
  Activity,
  Award,
  BookOpen,
  Sliders,
  Flame,
  ShieldAlert,
  AlertTriangle,
  RefreshCw,
  X,
  Bell,
  Layers,
  ArrowRight,
  Compass,
  Check,
  ChevronLeft,
  ChevronRight,
  Maximize2,
  Image as ImageIcon,
  Clock,
  Droplets,
  CircuitBoard,
  FileSearch,
  ListOrdered,
  ZoomIn,
  ZoomOut,
  Youtube
} from 'lucide-react';

export default function App() {
  const [activeTab, setActiveTab] = useState('theory');
  const [simMode, setSimMode] = useState('self');
  const canEmbedYouTube = ['http:', 'https:'].includes(window.location.protocol);
  const wireRopeVideoUrl = 'https://www.youtube.com/watch?v=5vCQwGsdn-s';
  const wireRopeEmbedUrl = 'https://www.youtube.com/embed/5vCQwGsdn-s?rel=0&playsinline=1';

  // --- 1. 자기유지 회로 State ---
  const [selfPb1, setSelfPb1] = useState(false);
  const [selfPb0, setSelfPb0] = useState(false);
  const [selfRelay, setSelfRelay] = useState(false);

  useEffect(() => {
    if (selfPb0) {
      setSelfRelay(false);
    } else if (selfPb1) {
      setSelfRelay(true);
    }
  }, [selfPb1, selfPb0]);

  const resetSelfHold = () => {
    setSelfPb1(false);
    setSelfPb0(false);
    setSelfRelay(false);
  };

  // --- 2. 인터록 회로 State ---
  const [ilPb0, setIlPb0] = useState(false);
  const [mc1State, setMc1State] = useState(false);
  const [mc2State, setMc2State] = useState(false);
  const [ilWarning, setIlWarning] = useState('');

  const handleIlPb1 = () => {
    if (ilPb0) return;
    if (mc2State) {
      setIlWarning('인터록 차단! MC2가 동작 중이므로 MC1 전원이 차단되었습니다.');
      return;
    }
    setIlWarning('');
    setMc1State(true);
  };

  const handleIlPb2 = () => {
    if (ilPb0) return;
    if (mc1State) {
      setIlWarning('인터록 차단! MC1이 동작 중이므로 MC2 전원이 차단되었습니다.');
      return;
    }
    setIlWarning('');
    setMc2State(true);
  };

  const stopInterlock = () => {
    setMc1State(false);
    setMc2State(false);
    setIlWarning('');
  };

  // --- 3. Y-Δ 회로 State ---
  const [ydStart, setYdStart] = useState(false);
  const [ydTimerSetting, setYdTimerSetting] = useState(3);
  const [ydTimerLeft, setYdTimerLeft] = useState(3);
  const [ydMcMain, setYdMcMain] = useState(false);
  const [ydMcY, setYdMcY] = useState(false);
  const [ydMcDelta, setYdMcDelta] = useState(false);
  const [ydTimerDone, setYdTimerDone] = useState(false);

  useEffect(() => {
    let timerInterval = null;
    if (ydStart && !ydTimerDone) {
      timerInterval = setInterval(() => {
        setYdTimerLeft((prev) => {
          if (prev <= 1) {
            clearInterval(timerInterval);
            setYdTimerDone(true);
            setYdMcY(false);
            setYdMcDelta(true);
            return 0;
          }
          return prev - 1;
        });
      }, 1000);
    }
    return () => clearInterval(timerInterval);
  }, [ydStart, ydTimerDone]);

  const startYDelta = () => {
    setYdStart(true);
    setYdMcMain(true);
    setYdMcY(true);
    setYdMcDelta(false);
    setYdTimerDone(false);
    setYdTimerLeft(ydTimerSetting);
  };

  const stopYDelta = () => {
    setYdStart(false);
    setYdMcMain(false);
    setYdMcY(false);
    setYdMcDelta(false);
    setYdTimerDone(false);
    setYdTimerLeft(ydTimerSetting);
  };

  // --- 4. EOCR 트립 회로 State ---
  const [eocrRunning, setEocrRunning] = useState(false);
  const [eocrTripped, setEocrTripped] = useState(false);

  const resetEocr = () => {
    setEocrTripped(false);
  };

  const tripEocr = () => {
    setEocrTripped(true);
  };

  // --- 핀배치 도감 선택 State ---
  const [selectedDevice, setSelectedDevice] = useState('timer8');
  const [selectedPin, setSelectedPin] = useState(null);
  const [modalImage, setModalImage] = useState(null);

  // ===== 공개 도면 탭: 회로 이미지 확대/축소 =====
  const [circuitZoom, setCircuitZoom] = useState({});
  const getCircuitZoom = (num) => circuitZoom[num] || 1;
  const changeCircuitZoom = (num, delta) => {
    setCircuitZoom((prev) => {
      const cur = prev[num] || 1;
      const next = Math.min(3, Math.max(0.5, +(cur + delta).toFixed(1)));
      return { ...prev, [num]: next };
    });
  };
  const resetCircuitZoom = (num) => setCircuitZoom((prev) => ({ ...prev, [num]: 1 }));
  const circuitImgPath = (num) => `./public/images/elevator_practice_circuit/Elevator${String(num).padStart(3, '0')}_jpg_20250323.png`;
  const circuitHtmlPath = (num) => `./public/elevatorcircuit/circuit_${String(num).padStart(2, '0')}.html`;

  // --- 이론 탭: 릴레이 동작 실시간 인터랙션 State ---
  const [demoRelayEnergized, setDemoRelayEnergized] = useState(false);

  // --- 이론 탭: 셀렉터 스위치 State ---
  const [selectorPos, setSelectorPos] = useState('OFF');
  const [selectorAutoTriggered, setSelectorAutoTriggered] = useState(false);
  const [selectorManTriggered, setSelectorManTriggered] = useState(false);

  // --- 이론 탭: 타이머 한시접점 vs 순시접점 시뮬레이터 ---
  const [timerDemoPowered, setTimerDemoPowered] = useState(false);
  const [timerDemoDelaySetting, setTimerDemoDelaySetting] = useState(3);
  const [timerDemoLeft, setTimerDemoLeft] = useState(3);
  const [timerDemoDelayContact, setTimerDemoDelayContact] = useState(false);

  useEffect(() => {
    let interval = null;
    if (timerDemoPowered && !timerDemoDelayContact) {
      interval = setInterval(() => {
        setTimerDemoLeft((prev) => {
          if (prev <= 1) {
            clearInterval(interval);
            setTimerDemoDelayContact(true);
            return 0;
          }
          return prev - 1;
        });
      }, 1000);
    }
    return () => clearInterval(interval);
  }, [timerDemoPowered, timerDemoDelayContact]);

  const toggleTimerDemo = () => {
    if (timerDemoPowered) {
      setTimerDemoPowered(false);
      setTimerDemoDelayContact(false);
      setTimerDemoLeft(timerDemoDelaySetting);
    } else {
      setTimerDemoPowered(true);
      setTimerDemoDelayContact(false);
      setTimerDemoLeft(timerDemoDelaySetting);
    }
  };

  const changeTimerDemoDelay = (sec) => {
    setTimerDemoDelaySetting(sec);
    setTimerDemoLeft(sec);
    setTimerDemoPowered(false);
    setTimerDemoDelayContact(false);
  };

  // --- 이론 탭: FLS 수위 센서 시뮬레이터 (0:건조 1:E3저 2:E2중 3:E1고) ---
  const [flsWaterLevel, setFlsWaterLevel] = useState(0);
  const [flsPumpOn, setFlsPumpOn] = useState(true);

  useEffect(() => {
    if (flsWaterLevel === 3) setFlsPumpOn(false);
    else if (flsWaterLevel === 0) setFlsPumpOn(true);
  }, [flsWaterLevel]);

  // --- 퀴즈 State ---
  const [quizAnswers, setQuizAnswers] = useState({});
  const [quizSubmitted, setQuizSubmitted] = useState(false);
  const [quizPage, setQuizPage] = useState(0);

  // ===== 도면 해석 탭: T1 정·역전 자동 전환 및 EOCR/T2 경보 회로 =====
  const [pdMccbOn, setPdMccbOn] = useState(true);
  const [pdEocrTripped, setPdEocrTripped] = useState(false);
  const [pdT1SelfHold, setPdT1SelfHold] = useState(false);
  const [pdT1DelaySetting, setPdT1DelaySetting] = useState(3);
  const [pdT1Left, setPdT1Left] = useState(3);
  const [pdT1Elapsed, setPdT1Elapsed] = useState(false);
  const [pdT2DelaySetting, setPdT2DelaySetting] = useState(2);
  const [pdT2Left, setPdT2Left] = useState(2);
  const [pdT2Elapsed, setPdT2Elapsed] = useState(false);

  const pdControlPowerOn = pdMccbOn && !pdEocrTripped;
  const pdT1Energized = pdControlPowerOn && pdT1SelfHold;
  const pdMc1Energized = pdT1Energized && !pdT1Elapsed;
  const pdMc2Energized = pdT1Energized && pdT1Elapsed && !pdMc1Energized;
  const pdT2Energized = pdMccbOn && pdEocrTripped;
  // 첨부도면의 T2 한시 b접점: 트립 직후 닫힘, 설정시간 후 열림
  const pdYlOn = pdT2Energized && !pdT2Elapsed;

  useEffect(() => {
    if (!pdControlPowerOn) {
      setPdT1SelfHold(false);
      setPdT1Elapsed(false);
      setPdT1Left(pdT1DelaySetting);
    }
  }, [pdControlPowerOn, pdT1DelaySetting]);

  useEffect(() => {
    if (!pdT1Energized) {
      setPdT1Left(pdT1DelaySetting);
      setPdT1Elapsed(false);
      return;
    }
    if (pdT1Elapsed) return;
    const interval = setInterval(() => {
      setPdT1Left((prev) => {
        if (prev <= 1) {
          clearInterval(interval);
          setPdT1Elapsed(true);
          return 0;
        }
        return prev - 1;
      });
    }, 1000);
    return () => clearInterval(interval);
  }, [pdT1Energized, pdT1DelaySetting, pdT1Elapsed]);

  useEffect(() => {
    if (!pdT2Energized) {
      setPdT2Left(pdT2DelaySetting);
      setPdT2Elapsed(false);
      return;
    }
    if (pdT2Elapsed) return;
    const interval = setInterval(() => {
      setPdT2Left((prev) => {
        if (prev <= 1) {
          clearInterval(interval);
          setPdT2Elapsed(true);
          return 0;
        }
        return prev - 1;
      });
    }, 1000);
    return () => clearInterval(interval);
  }, [pdT2Energized, pdT2DelaySetting, pdT2Elapsed]);

  const pdPressPB1 = () => {
    if (pdControlPowerOn) setPdT1SelfHold(true);
  };

  const pdPressPB0 = () => {
    setPdT1SelfHold(false);
    setPdT1Elapsed(false);
    setPdT1Left(pdT1DelaySetting);
  };

  const pdChangeT1Delay = (sec) => {
    setPdT1DelaySetting(sec);
    setPdT1Left(sec);
    setPdT1SelfHold(false);
    setPdT1Elapsed(false);
  };

  const pdChangeT2Delay = (sec) => {
    setPdT2DelaySetting(sec);
    setPdT2Left(sec);
    setPdT2Elapsed(false);
  };

  const pdToggleMccb = () => {
    setPdMccbOn((on) => !on);
    setPdEocrTripped(false);
    setPdT1SelfHold(false);
    setPdT1Elapsed(false);
    setPdT1Left(pdT1DelaySetting);
    setPdT2Elapsed(false);
    setPdT2Left(pdT2DelaySetting);
  };

  const pdTripEocr = () => {
    if (!pdMccbOn) return;
    setPdEocrTripped(true);
    setPdT1SelfHold(false);
  };

  const pdResetEocr = () => {
    setPdEocrTripped(false);
    setPdT2Elapsed(false);
    setPdT2Left(pdT2DelaySetting);
  };

  const resetPublicDiagram = () => {
    setPdMccbOn(true);
    setPdEocrTripped(false);
    setPdT1SelfHold(false);
    setPdT1Left(pdT1DelaySetting);
    setPdT1Elapsed(false);
    setPdT2Left(pdT2DelaySetting);
    setPdT2Elapsed(false);
  };

  // 전기기구 소켓 및 내부 구조 데이터 (모든 사용자 업로드 사진 반영 완료)
  const deviceData = {
    timer8: {
      name: '8핀 타이머 (Timer / T)',
      socketType: '8핀 소켓 (image_425524.png 반영)',
      schematicImg: './public/images/schematics/timer8_schematic.png',
      layoutGrid: {
        top: [
          { pin: 6, name: '한시A', type: 'Delay NO' },
          { pin: 5, name: '한시B', type: 'Delay NC' },
          { pin: 4, name: 'X', type: '공핀' },
          { pin: 3, name: '순시A', type: 'Instant NO' }
        ],
        bottom: [
          { pin: 7, name: '전원', type: 'Power' },
          { pin: 8, name: '한시C', type: 'Delay Common' },
          { pin: 1, name: '순시C', type: 'Instant Common' },
          { pin: 2, name: '전원', type: 'Power' }
        ],
        connections: [
          { from: 8, to: 5, label: '한시 B접점 (NC)', color: 'text-rose-400', isB: true },
          { from: 8, to: 6, label: '한시 A접점 (NO)', color: 'text-amber-400', isA: true },
          { from: 1, to: 3, label: '순시 A접점 (NO)', color: 'text-emerald-400', isA: true },
          { from: 7, to: 2, label: '전원 AC 220V', color: 'text-sky-400', isPower: true }
        ]
      },
      pins: [
        { num: 1, label: '순시 공통 (C1)', desc: '순시 a접점(3번)용 공통 단자' },
        { num: 2, label: '전원 (Power)', desc: '제어 전원 220V (7번과 쌍)' },
        { num: 3, label: '순시 A접점 (NO)', desc: '전원 인가 즉시 동작하는 a접점' },
        { num: 4, label: '미사용', desc: '공핀' },
        { num: 5, label: '한시 B접점 (NC)', desc: '설정 시간 후 열리는 한시 b접점 (8번 공통)' },
        { num: 6, label: '한시 A접점 (NO)', desc: '설정 시간 후 닫히는 한시 a접점 (8번 공통)' },
        { num: 7, label: '전원 (Power)', desc: '제어 전원 220V (2번과 쌍)' },
        { num: 8, label: '한시 공통 (Delay C)', desc: '한시 접점 공통 단자' }
      ],
      powerPins: [2, 7],
      commonPins: [1, 8],
      usage: '전원 공급 후 설정된 시간이 지나면 한시 접점이 전환되는 타임 스위치기구.',
      tip: '업로드하신 타이머 소켓 번호도와 같이 상단 6,5,4,3 / 하단 7,8,1,2 배열 구조를 가집니다.'
    },
    relay8: {
      name: '8핀 릴레이 (Relay / X / R)',
      socketType: '8핀 소켓',
      schematicImg: './public/images/schematics/relay8_schematic.png',
      layoutGrid: {
        top: [
          { pin: 6, name: 'A접점2', type: 'NO2' },
          { pin: 5, name: 'B접점2', type: 'NC2' },

          { pin: 3, name: 'A접점1', type: 'NO1' }
        ],
        bottom: [
          { pin: 7, name: '전원', type: 'Power' },
          { pin: 8, name: '공통2', type: 'Common 2' },
          { pin: 1, name: '공통1', type: 'Common 1' },
          { pin: 2, name: '전원', type: 'Power' }
        ],
        connections: [
          { from: 1, to: 4, label: '1세트 B접점', color: 'text-rose-400', isB: true },
          { from: 1, to: 3, label: '1세트 A접점', color: 'text-amber-400', isA: true },

    flicker8: {
      name: '8핀 플리커 릴레이 (Flicker / FR)',
      socketType: '8핀 소켓',

      layoutGrid: {

        ],
        bottom: [
          { pin: 7, name: '전원', type: 'Power' },
          { pin: 8, name: '플리커C', type: 'Common' },
          { pin: 1, name: 'X', type: '공핀' },

        ],
        connections: [

          { from: 2, to: 7, label: '전원 AC 220V', color: 'text-sky-400', isPower: true }
        ]
      },
      pins: [

    { id: 24, question: '과전류 계전기(EOCR)가 트립되었을 때 점등되어야 하는 경보등 색상은?', options: ['① 적색등(RL)', '② 녹색등(GL)', '③ 황색등(YL)', '④ 백색등(WL)'], correct: 2, explanation: 'EOCR 트립 경보 시에는 황색등(YL) 및 부저(BZ)가 작동합니다.' },
    { id: 25, question: 'Y-Δ 회로에서 Y접촉기와 Δ접촉기가 동시에 켜지는 것을 막기 위한 필수 회로는?', options: ['① 자기유지 회로', '② 인터록 회로', '③ 플리커 회로', '④ 지연 회로'], correct: 1, explanation: 'Y와 Δ가 동시 켜지면 3상 전원이 상간 단락(합선)되므로 상호 인터록을 필수 설치합니다.' },
    { id: 26, question: '전기기능사 실기 배관 작업 시 CD관 커넥터 결합 방향은?', options: ['① 제어반 박스 안쪽으로 나사산을 넣어 피복 링으로 고정', '② 임의 고정', '③ 테이프로만 고정', '④ 접착제 사용'], correct: 0, explanation: '제어반 및 스위치 박스 노크아웃 구멍에 커넥터를 끼우고 안쪽에서 링을 돌려 고정합니다.' },
    { id: 27, question: '8핀 타이머에서 순시 a접점(1-3)의 기호 형태는?', options: ['① 삼각형 화살표가 있는 접점', '② 일반 릴레이 a접점과 동일한 직선 형태', '③ 깃발 모양 접점', '④ 반원 모양 접점'], correct: 1, explanation: '순시 접점은 일반 릴레이 접점과 동일하게 그리며, 한시 접점은 깃발/화살표 기호가 붙습니다.' },
    { id: 28, question: 'EOCR의 10번(95) 핀에서 5번(98) 핀으로 연결되는 접점은 언제 닫히나요?', options: ['① 평상시 운전 중일 때', '② 모터에 과전류가 흘러 EOCR이 트립(Trip)되었을 때', '③ 전원이 꺼졌을 때', '④ 항상 닫혀 있음'], correct: 1, explanation: '95-98번은 EOCR 트립 A접점으로 과전류 발생 시 닫혀 경보를 울립니다.' },
    { id: 29, question: 'KEC 규정에서 L3 상의 전선 색상은?', options: ['① 갈색', '② 흑색', '③ 회색', '④ 청색'], correct: 2, explanation: 'L3 상의 색상은 회색(Gray)입니다.' },
    { id: 30, question: '8핀 릴레이 소켓에서 8번 공통 핀의 B접점 핀 번호는?', options: ['① 3번', '② 4번', '③ 5번', '④ 6번'], correct: 2, explanation: '8번 공통 핀의 b접점은 5번, a접점은 6번입니다.' },
    { id: 31, question: '전기기능사 제어반 작업 시 제어회로용 노란색 전선의 굵기는?', options: ['① 1.5 mm²', '② 2.5 mm²', '③ 4.0 mm²', '④ 6.0 mm²'], correct: 0, explanation: '주회로는 2.5mm²(갈/흑/회/청/녹황), 제어회로는 1.5mm² 노란색 전선을 사용합니다.' },
    { id: 32, question: '8핀 타이머의 8번 핀에 연결할 수 없는 접점 종류는?', options: ['① 한시 A접점 (6번)', '② 한시 B접점 (5번)', '③ 순시 A접점 (3번)', '④ 한시 C공통'], correct: 2, explanation: '순시 a접점의 공통은 1번 핀이며, 8번 핀은 한시 접점 전용 공통입니다.' },
    { id: 33, question: '푸시버튼 PB0(정지용 b접점)을 회로도 상에서 번호 매길 때 보통 사용하는 표기는?', options: ['① 1 - 2 번 또는 3 - 4 번', '② 5 - 6 번', '③ 7 - 8 번', '④ 9 - 10 번'], correct: 0, explanation: '단자대 및 스위치 핀 번호는 관례적으로 b접점에 1-2번(또는 NC), a접점에 3-4번(또는 NO)을 할당합니다.' },
    { id: 34, question: 'FLS(플로트레스 스위치)에서 물이 가득 차서 E1과 E3가 수중 연결되면 일어나는 현상은?', options: ['① 릴레이 내부 소자 코일이 여자되어 4-3번 a접점이 붙는다.', '② 전원이 차단된다.', '③ EOCR이 트립된다.', '④ 타이머가 작동한다.'], correct: 0, explanation: '물의 전도성으로 E1-E3간 미세 전류가 흘러 내부 릴레이가 여자되며 접점이 전환됩니다.' },
    { id: 35, question: '12핀 MC 소켓에서 주회로 L1-L2-L3 입력 핀의 위치는?', options: ['① 상단 좌측 1, 2, 3번 (R, S, T)', '② 하단 7, 8, 9번', '③ 우측 6, 12번', '④ 중앙 4, 5번'], correct: 0, explanation: '상단 1, 2, 3번이 주회로 R, S, T 입력 단자입니다.' },
    { id: 36, question: '주회로 전선 굵기(2.5mm²)와 제어회로 전선 굵기(1.5mm²) 중 더 두꺼운 전선은?', options: ['① 1.5 mm²', '② 2.5 mm²', '③ 둘 다 동일하다', '④ 규정에 따라 다름'], correct: 1, explanation: '단면적이 큰 2.5mm² 주회로 전선이 더 두껍습니다.' },
    { id: 37, question: '모터 정·역회로에서 3상 중 2상의 결선을 서로 바꾸면 모터의 회전은 어떻게 되나요?', options: ['① 회전 속도가 2배가 된다.', '② 회전 방향이 반대로 바뀐다.', '③ 모터가 정지한다.', '④ 모터가 타버린다.'], correct: 1, explanation: '3상 유도전동기는 임의의 두 상의 순서를 바꾸면 회전 자기장 방향이 반대가 되어 역회전합니다.' },
    { id: 38, question: '8핀 릴레이에서 A접점만 2개 필요한 경우 사용할 수 있는 핀 번호 조합은?', options: ['① (1-3) 및 (8-6)', '② (1-4) 및 (8-5)', '③ (2-7) 및 (1-3)', '④ (4-5) 및 (3-6)'], correct: 0, explanation: '1세트 A접점 (1-3)과 2세트 A접점 (8-6)을 각각 사용합니다.' },
    { id: 39, question: '버저(BZ)와 황색등(YL)이 병렬로 연결되어 있을 때의 동작은?', options: ['① YL이 켜지면 BZ도 동시에 소리를 낸다.', '② YL이 꺼져야 BZ가 울린다.', '③ BZ만 울린다.', '④ 동작하지 않는다.'], correct: 0, explanation: '병렬 연결이므로 동일한 전압이 인가되어 YL 점등과 BZ 경보가 동시에 발생합니다.' },
    { id: 40, question: '전기기능사 실기 시험 시 제어반 벨테스터(Continuity Tester)의 사용 목적은?', options: ['① 전압 측정', '② 결선 오류 및 전선 단선/통전 여부 확인', '③ 저항값 정밀 측정', '④ 전류 측정'], correct: 1, explanation: '벨테스터는 전원이 꺼진 상태에서 회로의 연결(통전) 상태를 신속히 확인하기 위해 사용합니다.' },
    { id: 41, question: '8핀 타이머의 1번-3번 접점의 정식 명칭은?', options: ['① 한시 a접점', '② 한시 b접점', '③ 순시 a접점', '④ 순시 b접점'], correct: 2, explanation: '1번-3번은 타이머에 전원이 공급되는 즉시 붙는 순시 a접점입니다.' },
    { id: 42, question: '12핀 EOCR 소켓에서 제어접점 C(공통) 10번(95)과 연결된 A접점 핀 번호는?', options: ['① 4번', '② 5번 (98번)', '③ 6번', '④ 12번'], correct: 1, explanation: '10번 공통의 A접점은 5번(98번)입니다.' },
    { id: 43, question: '제어반 배선 시 전선 연결 단자대 나사를 죌 때 적정한 주의사항은?', options: ['① 헐겁게 조인다.', '② 전선 피복이 씹히지 않게 심선만 들여보내 단단히 죈다.', '③ 피복 채로 죈다.', '④ 나사를 뺀다.'], correct: 1, explanation: '접촉 불량이나 피복 씹힘으로 인한 오작동을 방지하기 위해 심선만 단단히 체결합니다.' },
    { id: 44, question: '플리커 릴레이(FR)의 8번-5번 접점은 플리커 동작 시 어떻게 되나요?', options: ['① 계속 닫혀 있다.', '② 계속 열려 있다.', '③ 설정 주기로 열림과 닫힘을 반복한다.', '④ 전원이 꺼진다.'], correct: 2, explanation: '플리커 릴레이는 전원 인가 시 설정 주기로 8-5(B접점)와 8-6(A접점)이 교대로 점멸합니다.' },
    { id: 45, question: '셀렉터 스위치 11시 방향이 Auto(자동)일 때, 1시 방향은 보통 무엇인가요?', options: ['① OFF', '② Manual (수동)', '③ Stop', '④ Trip'], correct: 1, explanation: '셀렉터 스위치는 관례적으로 11시 방향 Auto(자동), 1시 방향 Manual(수동)으로 배선합니다.' },
    { id: 46, question: 'KEC 규정에서 교류 3상 회로의 L1 상 전선 색상은?', options: ['① 갈색', '② 흑색', '③ 회색', '④ 청색'], correct: 0, explanation: 'L1 상의 색상은 갈색(Brown)입니다.' },
    { id: 47, question: '8핀 릴레이 소켓 하단의 2번 핀과 7번 핀 사이의 저항을 멀티미터로 측정했을 때 정상 코일값은?', options: ['① 0 Ω (단락)', '② 무한대 Ω (단선)', '③ 수 kΩ 정도의 코일 저항값', '④ -10 Ω'], correct: 2, explanation: '정상 릴레이 코일 내부에는 일정 수치(약 수 kΩ)의 전자기 코일 저항이 측정됩니다.' },
    { id: 48, question: '12핀 MC 소켓에서 주회로 출력 U, V, W 핀 번호는?', options: ['① 1, 2, 3번', '② 4, 5, 6번', '③ 7, 8, 9번 (T1, T2, T3)', '④ 10, 11, 12번'], correct: 2, explanation: '하단 7, 8, 9번 핀이 주회로 출력 U, V, W 핀입니다.' },
    { id: 49, question: '전기기능사 실기 시험 작업 시간 제한은 대략 얼마인가요?', options: ['① 1시간', '② 2시간 30분', '③ 4시간 30분', '④ 8시간'], correct: 2, explanation: '전기기능사 실기 시험은 보통 4시간 30분 동안 진행됩니다.' },
    { id: 50, question: 'EOCR의 TEST 버튼을 눌렀을 때 일어나는 동작으로 옳은 것은?', options: ['① 모터가 고속 회전한다.', '② 강제로 과전류 트립 상태를 만들어 경보 회로 동작을 테스트한다.', '③ 제어반 전원이 꺼진다.', '④ 퓨즈가 끊어진다.'], correct: 1, explanation: 'TEST 버튼은 EOCR 내부 기계를 강제 트립시켜 A/B접점 전환 동작을 검사하는 버튼입니다.' },
    { id: 51, question: '8핀 릴레이에서 8번 C단자를 공통으로 쓸 때 6번 핀은 무슨 접점인가요?', options: ['① A접점 (NO)', '② B접점 (NC)', '③ 전원 핀', '④ 공핀'], correct: 0, explanation: '8번 C단자의 A접점은 6번 핀입니다.' },
    { id: 52, question: '접지선(PE)을 연결하는 배관 및 단자대의 명칭은?', options: ['① TB1, TB2 등의 접지 단자(E)', '② PB0', '③ RL', '④ BZ'], correct: 0, explanation: '주단자대(TB)의 PE 단자에 녹황색 접지선을 확실히 체결해야 합니다.' },
    { id: 53, question: '8핀 타이머의 한시 b접점 핀 번호 조합은?', options: ['① 1 - 3번', '② 8 - 5번', '③ 8 - 6번', '④ 2 - 7번'], correct: 1, explanation: '타이머 한시 b접점(NC)은 8번(공통)과 5번입니다.' },
    { id: 54, question: '12핀 EOCR에서 11번(97) 핀의 용도는?', options: ['① A접점', '② B접점', '③ 97번 보조 접점 단자', '④ 전원'], correct: 2, explanation: '12핀 EOCR에서 11번은 97번 보조 접점 단자입니다.' },
    { id: 55, question: '시퀀스 제어에서 [R1-a]라고 표시된 기호의 의미는?', options: ['① 릴레이 R1의 코일', '② 릴레이 R1의 보조 a접점', '③ 릴레이 R1의 보조 b접점', '④ 저항 R1'], correct: 1, explanation: 'R1-a는 릴레이 R1에 연동되는 보조 a접점(NO)입니다.' },
    { id: 56, question: '녹색 표시등(GL: Green Lamp)은 주로 어떤 상태를 나타내는데 쓰이나요?', options: ['① 모터 정지(Stop) 상태', '② 과전류 트립 상태', '③ 모터 운전(Run) 상태', '④ 비상 상태'], correct: 0, explanation: '관례적으로 적색등(RL)은 운전 중, 녹색등(GL)은 정지 중 상태 표시등으로 쓰입니다.' },
    { id: 57, question: '8핀 소켓의 2번 핀과 7번 핀에 AC 220V 전원이 공급되면 릴레이 내부에서 일어나는 현상은?', options: ['① 코일에 전류가 흘러 전자석이 되고 가동 접철편을 끌어당긴다.', '② 퓨즈가 녹아 내린다.', '③ 접점이 모두 열린다.', '④ 아무 변화 없다.'], correct: 0, explanation: '코일 여자로 전자석이 생성되어 가동접점을 이끌어 b접점을 열고 a접점을 닫습니다.' },
    { id: 58, question: 'KEC 규정 전선 색상 중 갈색 전선이 상징하는 상은?', options: ['① L1 상', '② L2 상', '③ L3 상', '④ N 상'], correct: 0, explanation: '갈색 전선은 L1 상입니다.' },
    { id: 59, question: '8핀 FLS(플로트레스) 스위치의 제어전원 핀 번호는?', options: ['① 1, 8번', '② 2, 7번', '③ 3, 6번', '④ 4, 5번'], correct: 1, explanation: 'FLS 역시 8핀 소켓 기구이므로 전원 핀은 2번과 7번입니다.' },
    { id: 60, question: '전기기능사 실기 시험 시 작품 제출 전 최종 확인해야 할 가장 중요한 사항은?', options: ['① 벨테스터를 이용한 회로 합선(단락) 유무 및 핀번호 결선 정확도 확인', '② 전선 색상 무시 여부', '③ 나사 무풀림', '④ 아무거나 제출'], correct: 0, explanation: '전원 단락(합선)이나 핀번호 오류는 즉시 미작(오작) 처리되므로 벨테스터 점검이 필수입니다.' }
  ];

                { step:'4', title:'국화꽃 성형', desc:'각 스트랜드를 안쪽으로 고르게 굽혀 대칭적인 국화꽃 모양을 만듭니다.' },
                { step:'5', title:'소켓 삽입·고정', desc:'구부린 부분을 소켓에 넣고 고무·나무망치로 머리 부분을 두드려 더 들어가지 않게 합니다.' },
                { step:'6', title:'표찰·끝단 마감', desc:'비번호를 적은 견출지를 부착하고 나머지 끝부분이 풀리지 않게 테이프로 감습니다.' }
              ].map((s) => (
                <div key={s.step} className="bg-slate-800 border border-slate-700 rounded-2xl p-4 hover:border-amber-500/50 transition-all">
                  <div className="flex items-center gap-3 mb-2"><span className="w-9 h-9 rounded-full bg-amber-500 text-slate-950 font-black flex items-center justify-center">{s.step}</span><h3 className="font-bold text-slate-100">{s.title}</h3></div>
                  <p className="text-xs text-slate-400 leading-relaxed">{s.desc}</p>
                </div>
              ))}
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <div className="bg-slate-800 p-5 rounded-2xl border border-emerald-500/30 space-y-3">
                <h3 className="font-bold text-emerald-400 flex items-center gap-2"><CheckCircle2 className="w-5 h-5" />합격 형태 체크</h3>
                {['국화꽃이 한쪽으로 치우치지 않고 균형이 맞는가?', '로프 굽힘부가 소켓 입구보다 약간 돌출했는가?', '끝부분 높이가 개방부보다 5~10 mm인가?', '바인드가 단단하고 로프에 킹크가 없는가?', '소켓에 끝까지 안정적으로 들어가 흔들리지 않는가?'].map((item) => <p key={item} className="text-xs text-slate-300 flex gap-2"><Check className="w-4 h-4 text-emerald-400 shrink-0" />{item}</p>)}
              </div>
              <div className="bg-slate-800 p-5 rounded-2xl border border-rose-500/30 space-y-3">
                <h3 className="font-bold text-rose-400 flex items-center gap-2"><AlertTriangle className="w-5 h-5" />치명적 실수</h3>
                {['국화꽃 모양이 1/3 이상 기준과 다름', '와이어로프 절단 또는 양쪽 꼬임 등 임의 변형', '소켓 작업 또는 바인드 작업을 누락', '금속 망치 사용 또는 과도한 타격으로 소켓 손상', '스트랜드가 접히거나 꼬여 킹크 발생'].map((item) => <p key={item} className="text-xs text-slate-300 flex gap-2"><X className="w-4 h-4 text-rose-400 shrink-0" />{item}</p>)}
              </div>
            </div>

            <div className="bg-sky-500/10 border border-sky-500/40 rounded-2xl p-4 text-xs text-sky-100 leading-relaxed">
              <b className="text-sky-300">바벳트 처리 이해:</b> 실제 현장에서는 소켓 내부 각 꼬임 사이로 용액이 고르게 스며들도록 처리하지만, 공개문제에서는 바벳트 용액을 실제로 붓는 작업은 생략될 수 있습니다. 시험 문제지의 지시를 따르세요.
            </div>
          </div>
        )}

        {activeTab === 'quiz' && (
          <div className="space-y-6 animate-fadeIn">
            <div className="bg-slate-800 p-5 rounded-2xl border border-slate-700 flex flex-wrap items-center justify-between gap-3">
              <div>
                <h2 className="text-lg font-bold text-amber-400">승강기기능사 실기 실전퀴즈 (총 60문항)</h2>
                <p className="text-xs text-slate-300">유의사항·채점 제외대상·와이어로프·제어회로·핀 번호를 페이지당 10문항씩 점검하세요.</p>
              </div>
              {quizSubmitted && (
                <div className="bg-amber-500 text-slate-950 font-extrabold px-4 py-2 rounded-xl text-sm shadow-md">
                  전체 점수: {calculateQuizScore()} / {quizQuestions.length} 점
                </div>
              )}
            </div>
            <div className="flex flex-wrap items-center justify-between bg-slate-800/60 p-3 rounded-xl border border-slate-700/80 gap-2">
              <span className="text-xs text-slate-300 font-semibold">
                페이지 {quizPage + 1} / {totalPages}
              </span>
              <div className="flex items-center space-x-1">
                <button
                  disabled={quizPage === 0}
                  onClick={() => setQuizPage(quizPage - 1)}
                  className="p-1.5 rounded-lg bg-slate-700 hover:bg-slate-600 disabled:opacity-40 text-slate-200"
                >
                  <ChevronLeft className="w-4 h-4" />
                </button>
                {[...Array(totalPages)].map((_, pIdx) => (
                  <button
                    key={pIdx}
                    onClick={() => setQuizPage(pIdx)}
                    className={`px-3 py-1 rounded-lg text-xs font-bold ${quizPage === pIdx ? 'bg-amber-500 text-slate-950' : 'bg-slate-700 text-slate-300'}`}
                  >
                    {pIdx + 1}
                  </button>
                ))}
                <button
                  disabled={quizPage === totalPages - 1}
                  onClick={() => setQuizPage(quizPage + 1)}
                  className="p-1.5 rounded-lg bg-slate-700 hover:bg-slate-600 disabled:opacity-40 text-slate-200"
                >
                  <ChevronRight className="w-4 h-4" />
                </button>
              </div>
            </div>
            <div className="space-y-4">
              {currentQuestions.map((q) => {
                const isCorrect = quizAnswers[q.id] === q.correct;
                return (
                  <div key={q.id} className="bg-slate-800/90 p-5 rounded-2xl border border-slate-700 space-y-3">
                    <div className="flex items-start justify-between gap-2">
                      <h3 className="text-sm font-bold text-slate-100">
                        Q{q.id}. {q.question}
                      </h3>
                      {quizSubmitted && (
                        <span className={`text-xs font-bold px-2.5 py-1 rounded-full shrink-0 ${isCorrect ? 'bg-emerald-500/20 text-emerald-400' : 'bg-rose-500/20 text-rose-400'}`}>
                          {isCorrect ? '정답!' : '오답'}
                        </span>
                      )}
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                      {q.options.map((opt, oIdx) => (
                        <button
                          key={oIdx}
                          onClick={() => handleQuizSelect(q.id, oIdx)}
                          className={`p-3 rounded-xl text-xs text-left font-medium transition-all ${
                            quizAnswers[q.id] === oIdx ? 'bg-amber-500 text-slate-950 font-bold shadow-md' : 'bg-slate-900/80 hover:bg-slate-700 text-slate-300'
                          }`}
                        >
                          {opt}
                        </button>
                      ))}
                    </div>
                    {quizSubmitted && (
                      <div className="bg-slate-900/90 p-3 rounded-xl text-xs text-slate-300 border border-slate-700/60 mt-2">
                        <span className="text-amber-400 font-bold block mb-0.5">해설:</span>
                        {q.explanation}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
            <div className="flex justify-between items-center pt-2">
              <div className="text-xs text-slate-400">응답: {Object.keys(quizAnswers).length} / {quizQuestions.length}</div>
              {!quizSubmitted ? (
                <button
                  onClick={() => setQuizSubmitted(true)}
                  className="px-6 py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl shadow-lg"
                >
                  채점하기
                </button>
              ) : (
                <button
                  onClick={() => { setQuizAnswers({}); setQuizSubmitted(false); setQuizPage(0); }}
                  className="px-6 py-3 bg-slate-700 hover:bg-slate-600 text-slate-200 font-bold rounded-xl"
                >
                  다시 풀기
                </button>
              )}
            </div>
          </div>
        )}
      </main>

      {/* 이미지 크게 보기 모달 */}
      {modalImage && (
        <div
          onClick={() => setModalImage(null)}
          className="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4 cursor-pointer animate-fadeIn"
        >
          <div className="relative max-w-4xl w-full bg-slate-900 border border-slate-700 rounded-2xl p-4 overflow-hidden shadow-2xl">
            <button
              onClick={() => setModalImage(null)}
              className="absolute top-3 right-3 p-2 rounded-full bg-slate-800 text-slate-300 hover:text-white hover:bg-slate-700"
            >
              <X className="w-5 h-5" />
            </button>
            <div className="text-xs font-bold text-amber-400 mb-2">실기 도면·기구 이미지 크게 보기</div>
            <img
              src={modalImage}
              alt="실제 전기기구 내부결선도"
              className="w-full h-auto max-h-[80vh] object-contain rounded-xl bg-slate-950 border border-slate-800"
            />
          </div>
        </div>
      )}

      <footer className="border-t border-slate-800 bg-slate-950 py-4 text-center text-xs text-slate-500">
        승강기기능사 실기 마스터 PRO · Q-Net 공개문제 및 수험자 유의사항 기반 학습자료
      </footer>
    </div>
  );
}

import { createRoot } from 'react-dom/client';
const bootEl = document.getElementById('boot');
if (bootEl) bootEl.remove();
createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
