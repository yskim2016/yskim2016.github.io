        interval = setInterval(() => {
          const pwmVal = Math.floor((simPotValue / 1023) * 255);

        interval = setInterval(() => {

                      <button
                        onClick={() => setReviewFilter('correct')}
                        className={`px-3 py-1 rounded-lg font-semibold transition ${reviewFilter === 'correct' ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30' : 'text-slate-400 hover:text-slate-200'}`}
                      >
                        맞힌 문제만
                      </button>
                    </div>
                  </div>

                  {/* 해설 목록 */}
                  <div className="space-y-4 max-h-[800px] overflow-y-auto pr-1">
                    {QUIZ_QUESTIONS.filter(q => {
                      const userAns = quizAnswers[q.id];
                      const isCorrect = userAns === q.answer;
                      if (reviewFilter === 'wrong') return !isCorrect;
                      if (reviewFilter === 'correct') return isCorrect;
                      return true;
                    }).map(q => {
                      const userAns = quizAnswers[q.id];
                      const isCorrect = userAns === q.answer;
                      return (
                        <div 
                          key={q.id}
                          className={`p-5 rounded-xl border space-y-3 ${
                            isCorrect 
                              ? 'bg-slate-900/60 border-slate-700/80' 
                              : 'bg-rose-950/10 border-rose-900/40'
                          }`}
                        >
                          <div className="flex items-start justify-between gap-2">
                            <span className="text-sm font-bold text-white">
                              Q{q.id}. {q.question}
                            </span>
                            {isCorrect ? (
                              <span className="flex items-center text-xs text-emerald-400 font-bold gap-1 shrink-0 bg-emerald-500/10 px-2.5 py-1 rounded-full border border-emerald-500/20">
                                <CheckCircle2 className="w-3.5 h-3.5" /> 정답
                              </span>
                            ) : (
                              <span className="flex items-center text-xs text-rose-400 font-bold gap-1 shrink-0 bg-rose-500/10 px-2.5 py-1 rounded-full border border-rose-500/20">
                                <XCircle className="w-3.5 h-3.5" /> 오답
                              </span>
                            )}
                          </div>

                          <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
                            <div className="p-2.5 rounded-lg bg-slate-950 border border-slate-800 text-slate-300">
                              <span className="text-slate-500 block mb-0.5">내가 선택한 답:</span>
                              <span className={isCorrect ? 'text-emerald-400 font-bold' : 'text-rose-400 font-bold'}>
                                {userAns !== undefined ? `${userAns + 1}. ${q.options[userAns]}` : '미작성'}
                              </span>
                            </div>
                            <div className="p-2.5 rounded-lg bg-slate-950 border border-slate-800 text-slate-300">
                              <span className="text-slate-500 block mb-0.5">정답:</span>
                              <span className="text-teal-300 font-bold">
                                {q.answer + 1}. {q.options[q.answer]}
                              </span>
                            </div>
                          </div>

                          <div className="text-xs text-slate-300 bg-slate-950/80 p-3 rounded-lg border border-slate-800/80 leading-relaxed">
                            💡 <strong className="text-teal-400">해설:</strong> {q.explanation}
                          </div>
                        </div>
                      );
                    })}
                  </div>

                </div>

              </div>
            )}

          </div>
        )}

      </main>

      {/* --- 푸터 --- */}
      <footer className="bg-slate-950 border-t border-slate-800 py-6 mt-12">
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between text-xs text-slate-500 gap-2">
          <div>
            © Arduino Master Class - 아두이노 학습 가이드 & 60문항 종합 테스트
          </div>
          <div className="flex space-x-4">
            <span>아두이노 C/C++ 기준</span>
            <span>Target: Arduino Uno Rev3</span>
          </div>
        </div>
      </footer>
    </div>
  );
}

import { createRoot } from 'react-dom/client';
const bootEl = document.getElementById('boot');
if (bootEl) bootEl.remove();
createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
