<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>승강기기능사 실전 문제</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Share+Tech+Mono&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --steel-dark: #17191c;
    --steel: #23262b;
    --steel-light: #2e3238;
    --panel: #34383f;
    --amber: #f2a900;
    --amber-dim: #a87400;
    --led-green: #3ecf6e;
    --led-red: #e2483d;
    --text: #e9e7e0;
    --text-dim: #9a9da2;
    --text-dim2: #8b8e93;
    --brushed: repeating-linear-gradient(180deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 3px);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: var(--steel-dark);
    background-image: var(--brushed);
    color: var(--text);
    font-family:'Noto Sans KR', sans-serif;
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding: 28px 14px;
  }
  .rig{
    width:100%;
    max-width:640px;
  }
  /* --- Floor indicator header --- */
  .indicator{
    background: linear-gradient(180deg, #0d0f11, #1a1c1f);
    border: 3px solid #3a3d42;
    border-radius: 10px;
    padding: 18px 22px;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.6), 0 6px 18px rgba(0,0,0,0.4);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 14px;
    margin-bottom: 18px;
  }
  .indicator .title{
    font-family:'Oswald', sans-serif;
    font-weight:600;
    font-size: 14px;
    letter-spacing: 3px;
    color: var(--text-dim2);
    text-transform: uppercase;
  }
  .indicator .title span{
    display:block;
    font-size: 19px;
    color: var(--amber);
    letter-spacing: 1px;
    margin-top: 3px;
  }
  .led-display{
    font-family:'Share Tech Mono', monospace;
    font-size: 34px;
    color: var(--led-green);
    text-shadow: 0 0 8px rgba(62,207,110,0.7);
    background: #0a0b0c;
    padding: 4px 14px;
    border-radius: 4px;
    min-width: 64px;
    text-align:center;
    border: 1px solid #000;
  }
  .led-display.idle{ color:#3a3d3a; text-shadow:none; }

  /* --- Panel (main card) --- */
  .panel{
    background: var(--steel);
    border: 1px solid #3a3d42;
    border-radius: 10px;
    padding: 26px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.45);
    position: relative;
    overflow:hidden;
  }
  .panel::before{
    content:"";
    position:absolute; top:0; left:0; right:0; height:6px;
    background: repeating-linear-gradient(90deg, var(--amber) 0 14px, #1a1c1f 14px 28px);
    opacity:0.85;
  }

  /* --- Subject select screen --- */
  .screen-title{
    font-family:'Oswald', sans-serif;
    font-size: 22px;
    font-weight:600;
    letter-spacing:1px;
    margin: 4px 0 4px;
    color: var(--text);
  }
  .screen-sub{
    color: var(--text-dim2);
    font-size: 13.5px;
    margin-bottom: 22px;
    line-height:1.6;
  }
  .call-buttons{
    display:flex;
    flex-direction:column;
    gap: 12px;
  }
  .call-btn{
    display:flex;
    align-items:center;
    gap: 16px;
    background: var(--panel);
    border: 1px solid #45494f;
    border-radius: 8px;
    padding: 16px 18px;
    cursor:pointer;
    text-align:left;
    color: var(--text);
    font-family:'Noto Sans KR', sans-serif;
    transition: all 0.15s ease;
  }
  .call-btn:hover{
    background: #3a3f46;
    border-color: var(--amber-dim);
    transform: translateX(3px);
  }
  .call-btn .num{
    font-family:'Share Tech Mono', monospace;
    font-size: 20px;
    color: var(--steel-dark);
    background: var(--amber);
    width: 40px; height:40px;
    border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    box-shadow: 0 0 0 3px rgba(242,169,0,0.15);
  }
  .call-btn .label{
    flex:1;
  }
  .call-btn .label .name{
    font-weight:700;
    font-size:15.5px;
  }
  .call-btn .label .desc{
    font-size:12px;
    color: var(--text-dim2);
    margin-top:2px;
  }
  .call-btn .arrow{
    color: var(--text-dim2);
    font-size:18px;
  }

  /* --- Quiz screen --- */
  .progress-track{
    display:flex;
    gap:5px;
    margin-bottom: 20px;
  }
  .progress-seg{
    flex:1;
    height:6px;
    background:#000;
    border-radius:3px;
    overflow:hidden;
    border:1px solid #45494f;
  }
  .progress-seg .fill{
    height:100%;
    width:0%;
    background: var(--amber);
    transition: width 0.3s ease;
  }
  .progress-seg.done .fill{ width:100%; background: var(--led-green); }
  .progress-seg.wrong .fill{ width:100%; background: var(--led-red); }
  .progress-seg.current .fill{ width:100%; background: var(--amber); }

  .q-meta{
    font-family:'Share Tech Mono', monospace;
    font-size:12px;
    color: var(--amber);
    letter-spacing:1.5px;
    margin-bottom:8px;
    text-transform:uppercase;
  }
  .q-text{
    font-size: 17px;
    font-weight:500;
    line-height:1.55;
    margin-bottom: 20px;
    color:var(--text);
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom: 20px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:12px;
    background: var(--panel);
    border:1px solid #45494f;
    border-radius:8px;
    padding: 13px 16px;
    cursor:pointer;
    font-size:14.5px;
    color:var(--text);
    transition: all 0.15s ease;
  }
  .opt:hover:not(.locked){
    border-color: var(--amber-dim);
    background:#3a3f46;
  }
  .opt .tag{
    font-family:'Share Tech Mono', monospace;
    width:26px; height:26px;
    border-radius:50%;
    border:1px solid #5a5e64;
    display:flex; align-items:center; justify-content:center;
    font-size:12.5px;
    flex-shrink:0;
    color: var(--text-dim2);
  }
  .opt.correct{
    border-color: var(--led-green);
    background: rgba(62,207,110,0.12);
  }
  .opt.correct .tag{ background:var(--led-green); color:#0a0b0c; border-color:var(--led-green); }
  .opt.incorrect{
    border-color: var(--led-red);
    background: rgba(226,72,61,0.12);
  }
  .opt.incorrect .tag{ background:var(--led-red); color:#0a0b0c; border-color:var(--led-red); }

  .explain{
    background:#1a1c1f;
    border-left:3px solid var(--amber);
    border-radius:4px;
    padding:12px 14px;
    font-size:13px;
    line-height:1.6;
    color:var(--text-dim2);
    margin-bottom:18px;
    display:none;
  }
  .explain.show{ display:block; }
  .explain b{ color: var(--amber); }

  .nav-row{
    display:flex;
    justify-content:flex-end;
    gap:10px;
  }
  .btn{
    font-family:'Oswald', sans-serif;
    font-weight:600;
    letter-spacing:1px;
    font-size:14px;
    padding: 11px 22px;
    border-radius:6px;
    border:none;
    cursor:pointer;
    background: var(--amber);
    color:#17191c;
    transition: all 0.15s ease;
  }
  .btn:hover{ background:#ffbe2e; }
  .btn:disabled{
    background:#45494f;
    color:#7a7d82;
    cursor:not-allowed;
  }
  .btn.ghost{
    background:transparent;
    border:1px solid #45494f;
    color:var(--text-dim2);
  }
  .btn.ghost:hover{ border-color:var(--amber-dim); color:var(--text); background:transparent; }

  /* --- Result screen --- */
  .result-display{
    text-align:center;
    padding: 10px 0 6px;
  }
  .result-score{
    font-family:'Share Tech Mono', monospace;
    font-size: 56px;
    color: var(--led-green);
    text-shadow: 0 0 14px rgba(62,207,110,0.6);
    margin: 6px 0;
  }
  .result-score.fail{
    color: var(--led-red);
    text-shadow: 0 0 14px rgba(226,72,61,0.6);
  }
  .result-status{
    font-family:'Oswald', sans-serif;
    letter-spacing:3px;
    font-size:13px;
    color: var(--text-dim2);
    text-transform:uppercase;
    margin-bottom: 22px;
  }
  .result-breakdown{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:22px;
  }
  .rb-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:var(--panel);
    border:1px solid #45494f;
    border-radius:6px;
    padding:10px 14px;
    font-size:13.5px;
  }
  .rb-row .rb-score{
    font-family:'Share Tech Mono', monospace;
    color: var(--amber);
  }
  .hidden{ display:none; }
  .foot-note{
    text-align:center;
    color:#5c5f64;
    font-size:11.5px;
    margin-top:16px;
    letter-spacing:0.5px;
  }
</style>
</head>

<div class="rig">

  <div class="indicator">
    <div class="title">ELEVATOR TECHNICIAN CERT.<span id="headerSub">과목 선택</span></div>

  <div class="foot-note">B1 &nbsp;·&nbsp; 1F &nbsp;·&nbsp; 2F &nbsp;·&nbsp; 3F &nbsp;&mdash;&nbsp; 정기검사 필 &nbsp;·&nbsp; 정원 5문제</div>
</div>

<script>
const QUIZ_DATA = {
  intro: {
    name: "승강기개론",

      {

        options: ["메인 로프", "조속기 로프", "완충기", "리미트 스위치"],
        answer: 0,
        explain: "<b>메인 로프(주로프)</b>는 카와 균형추를 연결해 권상기의 회전력을 카의 승강 운동으로 전달합니다."
      },
      {
        q: "다음 중 유압식 엘리베이터의 특징으로 옳은 것은?",

      },
      {
        q: "에스컬레이터의 경사각은 일반적으로 몇 도 이하로 설치하는가?",

        answer: 1,
        explain: "에스컬레이터의 경사각은 안전상의 이유로 일반적으로 <b>30° 이하</b>로 설치하는 것이 원칙입니다."
      }
    ]
  },
  design: {

    desc: "권상기, 로프, 완충기 등 기계요소",
    questions: [
      {
        q: "권상기에서 로프와 도르래(시브) 사이의 마찰력을 이용하여 구동하는 방식은?",
        options: ["트랙션식", "드럼식", "체인식", "랙 피니언식"],
        answer: 0,
        explain: "<b>트랙션식(견인식)</b>은 로프와 시브 홈 사이의 마찰력으로 카를 움직이는 가장 일반적인 로프식 엘리베이터 구동 방식입니다."
      },
      {

        answer: 3,

        answer: 2,
        explain: "승강기 정기검사는 원칙적으로 <b>1년에 1회</b> 실시하며, 승강기 종류에 따라 예외가 있을 수 있습니다."
      },
      {
        q: "승강기 안전관리자의 주요 업무로 옳지 않은 것은?",
        options: ["승강기 운행 상태 점검", "고장 및 사고 발생 시 초동 조치", "승강기 설계 변경 승인", "안전수칙 준수 여부 확인"],
        answer: 2,
        explain: "승강기 설계 변경 승인은 <b>제조·설치업체 및 관련 인증기관의 소관</b>이며 안전관리자의 업무 범위가 아닙니다."
      }
    ]
  }
};

let currentSubject = null;
let currentIndex = 0;
let userAnswers = [];
let selectedOption = null;

const el = id => document.getElementById(id);

function renderSubjectButtons(){
  const wrap = el('subjectButtons');
  wrap.innerHTML = '';
  Object.keys(QUIZ_DATA).forEach((key, i) => {
    const s = QUIZ_DATA[key];
    const btn = document.createElement('div');
    btn.className = 'call-btn';
    btn.innerHTML = `
      <div class="num">${i+1}</div>
      <div class="label">
        <div class="name">${s.name}</div>
        <div class="desc">${s.desc} · 5문제</div>
      </div>
      <div class="arrow">▶</div>
    `;
    btn.onclick = () => startQuiz(key);
    wrap.appendChild(btn);
  });
}

function startQuiz(key){
  currentSubject = key;
  currentIndex = 0;
  userAnswers = new Array(QUIZ_DATA[key].questions.length).fill(null);
  el('screen-select').classList.add('hidden');
  el('screen-result').classList.add('hidden');
  el('screen-quiz').classList.remove('hidden');
  el('headerSub').textContent = QUIZ_DATA[key].name;
  renderProgress();
  renderQuestion();
}

function renderProgress(){
  const track = el('progressTrack');
  track.innerHTML = '';
  const total = QUIZ_DATA[currentSubject].questions.length;
  for(let i=0;i<total;i++){
    const seg = document.createElement('div');
    seg.className = 'progress-seg';
    if(userAnswers[i] !== null){
      seg.classList.add(userAnswers[i] === QUIZ_DATA[currentSubject].questions[i].answer ? 'done' : 'wrong');
    } else if(i === currentIndex){
      seg.classList.add('current');
    }
    seg.innerHTML = '<div class="fill"></div>';
    track.appendChild(seg);
  }
}

function renderQuestion(){
  selectedOption = null;
  const subj = QUIZ_DATA[currentSubject];
  const q = subj.questions[currentIndex];
  const total = subj.questions.length;

  el('floorDisplay').classList.remove('idle');
  el('floorDisplay').textContent = (currentIndex+1) + 'F';
  el('qMeta').textContent = `${subj.name.toUpperCase()} · Q${currentIndex+1}/${total}`;
  el('qText').textContent = q.q;

  const optWrap = el('qOptions');
  optWrap.innerHTML = '';
  const letters = ['①','②','③','④'];
  q.options.forEach((optText, idx) => {
    const opt = document.createElement('div');
    opt.className = 'opt';
    opt.innerHTML = `<div class="tag">${letters[idx]}</div><div>${optText}</div>`;
    opt.onclick = () => selectOption(idx);
    optWrap.appendChild(opt);
  });

  el('qExplain').classList.remove('show');
  el('qExplain').innerHTML = '';
  el('btnNext').disabled = true;
  el('btnNext').textContent = currentIndex === total - 1 ? '결과 확인 ▲' : '다음 층 ▲';
  renderProgress();
}

function selectOption(idx){
  if(userAnswers[currentIndex] !== null) return; // already answered
  selectedOption = idx;
  const q = QUIZ_DATA[currentSubject].questions[currentIndex];
  userAnswers[currentIndex] = idx;

  const opts = document.querySelectorAll('#qOptions .opt');
  opts.forEach((o, i) => {
    o.classList.add('locked');
    if(i === q.answer) o.classList.add('correct');
    else if(i === idx && idx !== q.answer) o.classList.add('incorrect');
  });

  const explainBox = el('qExplain');
  explainBox.innerHTML = (idx === q.answer ? '✅ 정답입니다. ' : '❌ 오답입니다. ') + q.explain;
  explainBox.classList.add('show');

  el('btnNext').disabled = false;
  renderProgress();
}

el('btnNext').onclick = () => {
  const total = QUIZ_DATA[currentSubject].questions.length;
  if(currentIndex < total - 1){
    currentIndex++;
    renderQuestion();
  } else {
    showResult();
  }
};

el('btnQuit').onclick = () => {
  el('screen-quiz').classList.add('hidden');
  el('screen-select').classList.remove('hidden');
  el('headerSub').textContent = '과목 선택';
  el('floorDisplay').classList.add('idle');
  el('floorDisplay').textContent = '--';
};

function showResult(){
  const subj = QUIZ_DATA[currentSubject];
  const total = subj.questions.length;
  let correct = 0;
  userAnswers.forEach((a, i) => { if(a === subj.questions[i].answer) correct++; });

  el('screen-quiz').classList.add('hidden');
  el('screen-result').classList.remove('hidden');
  el('headerSub').textContent = subj.name + ' 결과';
  el('floorDisplay').textContent = 'END';

  el('resultSubject').textContent = subj.name + ' — 운행 결과';
  const scoreEl = el('resultScore');
  scoreEl.textContent = `${correct} / ${total}`;
  const pass = correct >= Math.ceil(total * 0.6);
  scoreEl.classList.toggle('fail', !pass);
  el('resultStatus').textContent = pass ? 'PASS · 안전 운행 완료' : 'RETRY · 재점검 필요';

  const bd = el('resultBreakdown');
  bd.innerHTML = '';
  subj.questions.forEach((q, i) => {
    const row = document.createElement('div');
    row.className = 'rb-row';
    const ok = userAnswers[i] === q.answer;
    row.innerHTML = `<div>${i+1}F · ${q.q.length > 26 ? q.q.slice(0,26)+'…' : q.q}</div><div class="rb-score">${ok ? 'OK' : 'X'}</div>`;
    bd.appendChild(row);
  });
}

el('btnRetry').onclick = () => startQuiz(currentSubject);
el('btnBackToSelect').onclick = () => {
  el('screen-result').classList.add('hidden');
  el('screen-select').classList.remove('hidden');
  el('headerSub').textContent = '과목 선택';
  el('floorDisplay').classList.add('idle');
  el('floorDisplay').textContent = '--';
};

renderSubjectButtons();
</script>
</body>
</html>
