<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>6번 회로 해석: 2단 속도(저속→고속) 전동기 자동 전환 + FR 경보 · 도면 해석</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background: #0F172A; }
  #root { min-height:100vh; }
  #boot {
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:#0F172A; color:#8FA79B; font-family:monospace; font-size:0.85rem;
    letter-spacing:0.05em; z-index:1;
  }
  .animate-fadeIn { animation: fadeIn 0.3s ease-in; }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
</style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.383.0?external=react"
  }
}
</script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
</head>
<body>
<div id="boot">불러오는 중...</div>
<div id="root"></div>

<script type="text/babel" data-type="module" data-presets="react,typescript">
import React, { useState, useEffect } from 'react';
import {
  Activity, RotateCcw, Maximize2, Image as ImageIcon, ArrowRight, X, FileSearch, AlertTriangle
} from 'lucide-react';

const IMG_PATH = '../images/elevator_practice_circuit/Elevator006_jpg_20250323.PNG';
const COIL_POSITIONS = [40.89, 48.28, 55.91, 63.55, 71.43, 79.06, 86.45, 94.09];

function App() {
  const [modalImage, setModalImage] = useState(null);

  const [pdMccbOn, setPdMccbOn] = useState(true);
  const [pdEocrTripped, setPdEocrTripped] = useState(false);
  const [pdSelfHold, setPdSelfHold] = useState(false);
  const [pdDelaySetting, setPdDelaySetting] = useState(3);
  const [pdLeft, setPdLeft] = useState(3);
  const [pdPhaseB, setPdPhaseB] = useState(false);
  const [pdFrBlink, setPdFrBlink] = useState(false);

  const pdControlPowerOn = pdMccbOn && !pdEocrTripped;

  useEffect(() => {
    if (!pdControlPowerOn) setPdSelfHold(false);
  }, [pdControlPowerOn]);

  useEffect(() => {
    if (!pdSelfHold) {
      setPdLeft(pdDelaySetting);
      setPdPhaseB(false);
      return;
    }
    if (pdPhaseB) return;
    const id = setInterval(() => {
      setPdLeft((prev) => {
        if (prev <= 1) {
          clearInterval(id);
          setPdPhaseB(true);
          return 0;
        }
        return prev - 1;
      });
    }, 1000);
    return () => clearInterval(id);
  }, [pdSelfHold, pdDelaySetting, pdPhaseB]);

  const pdMc1Energized = pdControlPowerOn && pdSelfHold && !pdPhaseB;
  const pdMc2Energized = pdControlPowerOn && pdSelfHold && pdPhaseB;

  const pdPressPB1 = () => { if (pdControlPowerOn && !pdSelfHold) setPdSelfHold(true); };
  const pdPressPB0 = () => setPdSelfHold(false);

  const pdChangeDelay = (sec) => {
    setPdDelaySetting(sec);
    setPdLeft(sec);
    setPdSelfHold(false);
    setPdPhaseB(false);
  };

  const pdToggleMccb = () => setPdMccbOn((v) => !v);
  const pdTripEocr = () => setPdEocrTripped(true);
  const pdResetEocr = () => setPdEocrTripped(false);

  useEffect(() => {
    if (!pdEocrTripped || !pdMccbOn) { setPdFrBlink(false); return; }
    const id = setInterval(() => setPdFrBlink((v) => !v), 700);
    return () => clearInterval(id);
  }, [pdEocrTripped, pdMccbOn]);

  const pdYlOn = pdMccbOn && pdEocrTripped && pdFrBlink;

  const resetAll = () => {
    setPdMccbOn(true);
    setPdEocrTripped(false);
    setPdSelfHold(false);
    setPdLeft(pdDelaySetting);
    setPdPhaseB(false);
    setPdFrBlink(false);
  };

  const coilRow = [
      { name: 'EOCR', on: (pdEocrTripped), cls: 'bg-rose-500 text-white border-rose-300', stroke: '#f43f5e' },
      { name: 'FR', on: (pdEocrTripped), cls: 'bg-rose-500 text-white border-rose-300', stroke: '#f43f5e' },
      { name: 'YL', on: (pdYlOn), cls: 'bg-yellow-400 text-slate-900 border-yellow-200', stroke: '#eab308' },
      { name: 'T', on: (pdSelfHold), cls: 'bg-sky-500 text-white border-sky-300', stroke: '#38bdf8' },
      { name: 'MC1', on: (pdMc1Energized), cls: 'bg-red-500 text-white border-red-300', stroke: '#ef4444' },
      { name: 'MC2', on: (pdMc2Energized), cls: 'bg-emerald-500 text-white border-emerald-300', stroke: '#10b981' },
      { name: 'RL', on: (pdMc1Energized), cls: 'bg-red-500 text-white border-red-300', stroke: '#ef4444' },
      { name: 'GL', on: (pdMc2Energized), cls: 'bg-emerald-500 text-white border-emerald-300', stroke: '#10b981' }
    ];

  return (
    <div className="min-h-screen bg-slate-950 p-4 md:p-8 max-w-5xl mx-auto space-y-6">
      <div className="space-y-6 animate-fadeIn">

        <div className="bg-slate-800 p-5 rounded-2xl border border-slate-700 space-y-4">
          <div className="flex items-center space-x-2 text-amber-400 font-bold text-base border-b border-slate-700 pb-3">
            <FileSearch className="w-5 h-5" />
            <h2>6번 회로 해석: 2단 속도(저속→고속) 전동기 자동 전환 + FR 경보</h2>
          </div>
          <p className="text-xs text-slate-300 leading-relaxed">전동기 단자가 U·V·W(저속 권선)와 X·Y·Z(고속 권선) 2조로 구성된 2단 속도(극수 변환) 전동기입니다. PB1을 누르면 MC1이 여자되어 저속 운전이 시작되고 RL이 점등되며 T가 기동됩니다. T 설정시간이 지나면 MC1이 소자되고 MC2가 여자되어 고속(X·Y·Z) 운전으로 자동 전환되며 GL이 점등됩니다. PB0 또는 EOCR 트립 시 정지하며, EOCR 트립 시에는 FR(플리커 릴레이)이 여자되어 YL이 점멸 경보합니다.</p>

          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-[11px]">
            <div className="bg-slate-900 rounded-xl border border-slate-800 p-3">
              <span className="text-amber-400 font-bold">전동기 구성</span>
              <p className="text-slate-300 mt-1">2단 속도 전동기 1대(저속 U·V·W / 고속 X·Y·Z)</p>
            </div>
            <div className="bg-slate-900 rounded-xl border border-slate-800 p-3">
              <span className="text-amber-400 font-bold">타이머/경보 구성</span>
              <p className="text-slate-300 mt-1">T(저속→고속 전환), FR(경보 점멸)</p>
            </div>
          </div>

          <div className="bg-amber-500/10 border border-amber-500/40 rounded-xl p-3 flex gap-2">
            <AlertTriangle className="w-4 h-4 text-amber-400 shrink-0 mt-0.5" />
            <p className="text-[11px] text-amber-100 leading-relaxed">저속/고속 2조 권선을 갖는 전동기이므로 MC1·MC2는 정·역회전이 아니라 속도 전환용 접촉기입니다. 아래 배선 하이라이트의 정확한 경로는 참고용이며, 실제 접점 순서는 원본 도면을 기준으로 확인하세요.</p>
          </div>

          <div className="flex items-center justify-between flex-wrap gap-2">
            <span className="text-xs font-bold text-amber-400 flex items-center space-x-1.5">
              <ImageIcon className="w-4 h-4" />
              <span>원본 공개도면 (6번)</span>
            </span>
            <button
              onClick={() => setModalImage(IMG_PATH)}
              className="text-[11px] text-amber-400 hover:text-amber-300 flex items-center space-x-1 bg-amber-500/10 px-2.5 py-1 rounded-lg border border-amber-500/30"
            >
              <Maximize2 className="w-3 h-3" />
              <span>사진 크게 보기</span>
            </button>
          </div>
          <div className="bg-slate-900 rounded-xl border border-slate-800 p-3 flex flex-col items-center justify-center overflow-hidden">
            <img
              src={IMG_PATH}
              alt="6번 회로 공개도면"
              className="max-h-[420px] w-auto object-contain rounded-lg border border-slate-700/60 shadow cursor-pointer hover:opacity-95 transition-all bg-white"
              onClick={() => setModalImage(IMG_PATH)}
              onError={(e) => {
                e.target.onerror = null;
                e.target.style.display = 'none';
                document.getElementById('fallback-public-diagram').style.display = 'flex';
              }}
            />
            <div
              id="fallback-public-diagram"
              className="hidden flex-col items-center justify-center p-6 text-center space-y-2 bg-slate-950 rounded-xl border border-dashed border-slate-700 text-slate-400 w-full"
            >
              <ImageIcon className="w-8 h-8 text-slate-500 mb-1" />
              <p className="text-xs font-bold text-slate-300">공개도면 이미지 준비 중</p>
              <p className="text-[11px] text-slate-500">경로: <code className="text-amber-400">{IMG_PATH}</code></p>
            </div>
          </div>
        </div>

        <div className="bg-slate-950 rounded-2xl border border-slate-800 p-5 space-y-3">
          <div className="flex items-center justify-between flex-wrap gap-3 border-b border-slate-800 pb-3">
            <span className="text-xs font-bold text-slate-300 uppercase tracking-widest flex items-center space-x-1.5">
              <Activity className="w-4 h-4 text-amber-400" />
              <span>실시간 회로 통전 상태</span>
            </span>
            <div className="flex flex-wrap gap-x-3 gap-y-1 text-[10px] text-slate-400">
              <span className="flex items-center gap-1"><i className="inline-block w-3 h-1 rounded bg-yellow-400"></i>전원/공통모선</span>
              <span className="flex items-center gap-1"><i className="inline-block w-3 h-1 rounded bg-sky-400"></i>타이머</span>
              <span className="flex items-center gap-1"><i className="inline-block w-3 h-1 rounded bg-red-500"></i>MC1 (저속 · U·V·W)</span>
              <span className="flex items-center gap-1"><i className="inline-block w-3 h-1 rounded bg-emerald-400"></i>MC2 (고속 · X·Y·Z)</span>
              <span className="flex items-center gap-1"><i className="inline-block w-3 h-1 rounded bg-rose-400"></i>EOCR/경보</span>
            </div>
          </div>

          <div className="mx-auto w-full max-w-[780px] overflow-hidden rounded-xl border border-slate-700 bg-white shadow-inner">
            <svg viewBox="0 0 812 463" className="block h-auto w-full" role="img" aria-label="6번 회로 실시간 통전 상태 (실측 좌표 기반)">
                    <defs><filter id="glow6" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
                    <image href={IMG_PATH} x="0" y="0" width="812" height="463" preserveAspectRatio="xMidYMid meet" />
                    {pdMccbOn && (
                    <g fill="none" stroke="#eab308" strokeWidth="3.6" strokeLinecap="round" strokeLinejoin="round" opacity="0.75" filter="url(#glow6)">
                    <path d="M61 32V232" />
                    </g>)}
                    {(pdMc1Energized || pdMc2Energized) && (
                    <g fill="none" stroke={pdMc1Energized ? "#ef4444" : "#10b981"} strokeWidth="4" strokeLinecap="round" strokeLinejoin="round" opacity="0.8" filter="url(#glow6)">
                    <circle cx="77" cy="218" r="35" />
                    </g>)}
                    {pdControlPowerOn && (
                    <g fill="none" stroke="#eab308" strokeWidth="3.6" strokeLinecap="round" strokeLinejoin="round" opacity="0.78" filter="url(#glow6)">
                    <path d="M332 110H764" />
                    </g>)}
                    {pdSelfHold && (
                    <g fill="none" stroke="#38bdf8" strokeWidth="3.8" strokeLinecap="round" strokeLinejoin="round" opacity="0.8" filter="url(#glow6)">
                    <path d="M516 110V203" />
                    </g>)}
                    {pdEocrTripped && pdMccbOn && (
                    <g fill="none" stroke="#f97316" strokeWidth="3.8" strokeLinecap="round" strokeLinejoin="round" opacity="0.8" filter="url(#glow6)">
                    <path d="M332 110V203" />
                    </g>)}
                    {(pdEocrTripped) && (
                    <g fill="none" stroke="#f43f5e" strokeWidth="3.6" strokeLinecap="round" strokeLinejoin="round" opacity="0.82" filter="url(#glow6)">
                    <path d="M332 110V452" />
                    </g>)}
                    {(pdEocrTripped) && (
                    <g fill="none" stroke="#f43f5e" strokeWidth="3.6" strokeLinecap="round" strokeLinejoin="round" opacity="0.82" filter="url(#glow6)">
                    <path d="M332 203H392V452" />
                    </g>)}
                    {(pdYlOn) && (
                    <g fill="none" stroke="#eab308" strokeWidth="3.6" strokeLinecap="round" strokeLinejoin="round" opacity="0.82" filter="url(#glow6)">
                    <path d="M332 203H454V452" />
                    </g>)}
                    {(pdSelfHold) && (
                    <g fill="none" stroke="#38bdf8" strokeWidth="3.6" strokeLinecap="round" strokeLinejoin="round" opacity="0.82" filter="url(#glow6)">
                    <path d="M516 110V452" />
                    </g>)}
                    {(pdMc1Energized) && (
                    <g fill="none" stroke="#ef4444" strokeWidth="3.6" strokeLinecap="round" strokeLinejoin="round" opacity="0.82" filter="url(#glow6)">
                    <path d="M516 203H580V452" />
                    </g>)}
                    {(pdMc2Energized) && (
                    <g fill="none" stroke="#10b981" strokeWidth="3.6" strokeLinecap="round" strokeLinejoin="round" opacity="0.82" filter="url(#glow6)">
                    <path d="M516 203H642V452" />
                    </g>)}
                    {(pdMc1Energized) && (
                    <g fill="none" stroke="#ef4444" strokeWidth="3.6" strokeLinecap="round" strokeLinejoin="round" opacity="0.82" filter="url(#glow6)">
                    <path d="M516 203H702V452" />
                    </g>)}
                    {(pdMc2Energized) && (
                    <g fill="none" stroke="#10b981" strokeWidth="3.6" strokeLinecap="round" strokeLinejoin="round" opacity="0.82" filter="url(#glow6)">
                    <path d="M516 203H764V452" />
                    </g>)}
                    </svg>
          </div>
          <p className="text-[10px] text-slate-500 text-center">배선 색상은 원본 도면의 실제 컬럼 위치를 근사한 것입니다. 통전 시 해당 배선을 따라 색이 켜지고, 비통전 구간은 원본 도면 그대로(검정선) 표시됩니다.</p>

          <div className="grid grid-cols-4 sm:grid-cols-8 gap-2 text-center pt-1">
            {coilRow.map((item) => (
              <div key={item.name} className={`p-2 rounded-lg border text-[10px] font-bold ${item.on ? item.cls : 'bg-slate-900 border-slate-800 text-slate-500'}`}>
                <div>{item.name}</div>
                <div className="mt-0.5">{item.on ? '통전' : 'OFF'}</div>
              </div>
            ))}
          </div>
        </div>

        <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 space-y-5">
          <div className="flex items-center justify-between flex-wrap gap-3 border-b border-slate-700 pb-3">
            <div className="flex items-center space-x-2 text-amber-400 font-bold text-base">
              <Activity className="w-5 h-5" />
              <h2>동작 시뮬레이터</h2>
            </div>
            <button onClick={resetAll} className="px-4 py-2 rounded-xl text-xs font-bold bg-slate-700 hover:bg-slate-600 text-slate-100 flex items-center space-x-2">
              <RotateCcw className="w-4 h-4" /><span>전체 초기화</span>
            </button>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div className="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-2.5">
              <h3 className="text-xs font-bold text-slate-300">① 전원·보호</h3>
              <button onClick={pdToggleMccb} className={`w-full py-2 rounded-lg text-xs font-bold ${pdMccbOn ? 'bg-amber-500 text-slate-950' : 'bg-slate-700 text-slate-300'}`}>MCCB: {pdMccbOn ? 'ON' : 'OFF'}</button>
              <div className="grid grid-cols-2 gap-2">
                <button onClick={pdTripEocr} disabled={!pdMccbOn || pdEocrTripped} className="py-2 rounded-lg text-xs font-bold bg-rose-600 hover:bg-rose-500 text-white disabled:opacity-40">EOCR 트립</button>
                <button onClick={pdResetEocr} disabled={!pdEocrTripped} className="py-2 rounded-lg text-xs font-bold bg-slate-700 hover:bg-slate-600 text-white disabled:opacity-40">EOCR 복귀</button>
              </div>
            </div>

            <div className="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-2.5">
              <h3 className="text-xs font-bold text-slate-300">② 운전·정지</h3>
              <div className="grid grid-cols-2 gap-2">
                <button onClick={pdPressPB1} disabled={!pdControlPowerOn || pdSelfHold} className="py-2 rounded-lg text-xs font-bold bg-emerald-600 hover:bg-emerald-500 text-white disabled:opacity-40">PB1 기동</button>
                <button onClick={pdPressPB0} disabled={!pdSelfHold} className="py-2 rounded-lg text-xs font-bold bg-rose-600 hover:bg-rose-500 text-white disabled:opacity-40">PB0 정지</button>
              </div>
              <div className="text-[11px] text-slate-400 bg-slate-950 rounded-lg px-3 py-2 border border-slate-800">
                {!pdControlPowerOn ? 'EOCR b접점이 열려 운전할 수 없습니다.' : !pdSelfHold ? 'PB1을 누르면 운전이 시작됩니다.' : pdPhaseB ? 'MC2 (고속 · X·Y·Z) 전환 완료' : `MC1 (저속 · U·V·W) 동작 중 · 남은 시간 ${pdLeft}초`}
              </div>
            </div>

            <div className="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-3">
              <h3 className="text-xs font-bold text-slate-300">③ 설정시간</h3>
              <div className="flex gap-1.5">{[1, 3, 5, 7].map((sec) => (
                <button key={sec} onClick={() => pdChangeDelay(sec)} className={`flex-1 py-1.5 rounded-lg text-xs font-bold border ${pdDelaySetting === sec ? 'bg-sky-500 text-slate-950 border-sky-300' : 'bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700'}`}>{sec}초</button>
              ))}</div>
              <div className="text-[11px] text-slate-400 bg-slate-950 rounded-lg px-2 py-1.5 border border-slate-800">전환 지연시간 설정 (개념 시뮬레이션용)</div>
            </div>
          </div>

          <div className="bg-slate-900 rounded-xl border border-slate-800 p-3 overflow-x-auto">
            <div className="text-xs font-bold text-amber-300 mb-2">정상 운전 순서</div>
            <div className="flex items-center space-x-1.5 min-w-max text-[11px] font-bold">
              <span className={`px-2.5 py-1.5 rounded-lg border ${pdSelfHold ? 'bg-sky-500/20 border-sky-500/50 text-sky-300' : 'bg-slate-800 border-slate-700 text-slate-500'}`}>PB1</span>
              <ArrowRight className="w-3.5 h-3.5 text-slate-600" />
              <span className={`px-2.5 py-1.5 rounded-lg border ${pdMc1Energized ? 'bg-red-500/20 border-red-500/50 text-red-300' : 'bg-slate-800 border-slate-700 text-slate-500'}`}>MC1 (저속 · U·V·W) · RL</span>
              <ArrowRight className="w-3.5 h-3.5 text-slate-600" />
              <span className={`px-2.5 py-1.5 rounded-lg border ${pdMc2Energized ? 'bg-emerald-500/20 border-emerald-500/50 text-emerald-300' : 'bg-slate-800 border-slate-700 text-slate-500'}`}>MC2 (고속 · X·Y·Z) · GL</span>
            </div>
            <p className="text-[10px] text-slate-500 mt-2">PB1 → MC1 저속 기동·RL 점등(T) → 설정시간 경과 → MC2 고속 전환·GL 점등</p>
          </div>

          <p className="text-[10px] text-slate-500">EOCR 트립 시 전체 운전 계열은 즉시 정지하고 경보 계통만 별도로 동작합니다. 실제 시험에서는 지급 기기의 접점번호와 도면 표기를 우선 확인하세요.</p>
        </div>
      </div>

      {modalImage && (
        <div onClick={() => setModalImage(null)} className="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4 cursor-pointer">
          <div className="relative max-w-5xl w-full bg-slate-900 border border-slate-700 rounded-2xl p-4 overflow-auto max-h-[90vh] shadow-2xl">
            <button onClick={() => setModalImage(null)} className="absolute top-3 right-3 p-2 rounded-full bg-slate-800 text-slate-300 hover:text-white hover:bg-slate-700 z-10">
              <X className="w-5 h-5" />
            </button>
            <img src={modalImage} alt="원본 도면 확대" className="w-full h-auto object-contain rounded-xl bg-white border border-slate-800" />
          </div>
        </div>
      )}
    </div>
  );
}

import { createRoot } from 'react-dom/client';
const bootEl = document.getElementById('boot');
if (bootEl) bootEl.remove();
createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
