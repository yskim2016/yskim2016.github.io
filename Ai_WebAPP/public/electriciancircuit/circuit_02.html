<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2번 회로 해석: EOCR·FLS 급수펌프 자동/수동 운전 · 도면 해석</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background: #0F172A; }
  #root { min-height:100vh; }
  #boot {
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:#0F172A; color:#8FA79B; font-family:monospace; font-size:0.85rem;
    letter-spacing:0.05em; z-index:1;
  }
  .animate-fadeIn { animation: fadeIn 0.3s ease-in; }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
</style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.383.0?external=react"
  }
}
</script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
</head>
<body>
<div id="boot">불러오는 중...</div>
<div id="root"></div>

<script type="text/babel" data-type="module" data-presets="react,typescript">
import React, { useState, useEffect } from 'react';
import {
  Activity, Power, RotateCcw, Maximize2, Image as ImageIcon, ArrowRight, X, FileSearch, Clock
} from 'lucide-react';

function App() {
  const [modalImage, setModalImage] = useState(null);

  // ===== 공개도면 해석 탭: EOCR/FLS/SS 자동·수동 급수펌프 회로 시뮬레이터 =====
  const [pdMccbOn, setPdMccbOn] = useState(true);
  const [pdEocrTripped, setPdEocrTripped] = useState(false);
  const [pdSsMode, setPdSsMode] = useState('A'); // 'A' 자동 | 'M' 수동
  const [pdFlsLevel, setPdFlsLevel] = useState(false); // 자동모드: 수위 감지 여부
  const [pdTSelfHold, setPdTSelfHold] = useState(false); // 수동모드: 타이머 자기유지
  const [pdTDelaySetting, setPdTDelaySetting] = useState(3);
  const [pdTLeft, setPdTLeft] = useState(3);
  const [pdTDelayContact, setPdTDelayContact] = useState(false);
  const [pdFrBlink, setPdFrBlink] = useState(false); // 플리커 릴레이 점멸 상태

  // 자동모드: FLS 여자 -> X 릴레이 -> MC1 -> RL / M1
  const pdXEnergized = pdMccbOn && !pdEocrTripped && pdSsMode === 'A' && pdFlsLevel;
  const pdMc1Energized = pdXEnergized;

  // 수동모드 타이머 자기유지 해제 조건 (X의 b접점 인터록 포함)
  useEffect(() => {
    if (!pdMccbOn || pdEocrTripped || pdSsMode !== 'M' || pdXEnergized) {
      setPdTSelfHold(false);
    }
  }, [pdMccbOn, pdEocrTripped, pdSsMode, pdXEnergized]);

  // 수동모드 타이머 카운트다운 (한시접점)
  useEffect(() => {
    if (!pdTSelfHold) {
      setPdTLeft(pdTDelaySetting);
      setPdTDelayContact(false);
      return;
    }
    if (pdTDelayContact) return;
    const interval = setInterval(() => {
      setPdTLeft((prev) => {
        if (prev <= 1) {
          clearInterval(interval);
          setPdTDelayContact(true);
          return 0;
        }
        return prev - 1;
      });
    }, 1000);
    return () => clearInterval(interval);
  }, [pdTSelfHold, pdTDelaySetting, pdTDelayContact]);

  const pdMc2Energized = pdMccbOn && !pdEocrTripped && pdTDelayContact;

  const pdPressPB1 = () => {
    if (pdMccbOn && !pdEocrTripped && pdSsMode === 'M' && !pdXEnergized) {
      setPdTSelfHold(true);
    }
  };
  const pdPressPB0 = () => setPdTSelfHold(false);

  const pdChangeTDelay = (sec) => {
    setPdTDelaySetting(sec);
    setPdTLeft(sec);
    setPdTSelfHold(false);
    setPdTDelayContact(false);
  };

  // EOCR 과전류 트립 -> FR(플리커) 여자 -> BZ/YL 교대 점멸
  useEffect(() => {
    if (!pdEocrTripped || !pdMccbOn) {
      setPdFrBlink(false);
      return;
    }
    const id = setInterval(() => setPdFrBlink((v) => !v), 700);
    return () => clearInterval(id);
  }, [pdEocrTripped, pdMccbOn]);

  const pdBzOn = pdMccbOn && pdEocrTripped && !pdFrBlink;
  const pdYlOn = pdMccbOn && pdEocrTripped && pdFrBlink;

  // 실시간 회로 통전 상태(SVG)용 구간별 도통 여부
  const pdMainBusOn = pdMccbOn && !pdEocrTripped;
  const pdAlarmTapOn = pdMccbOn && pdEocrTripped;
  const pdSsAClosedOn = pdMainBusOn && pdSsMode === 'A';
  const pdFlsClosedOn = pdSsAClosedOn && pdFlsLevel;
  const pdSsMClosedOn = pdMainBusOn && pdSsMode === 'M';

  const resetPublicDiagram = () => {
    setPdMccbOn(true);
    setPdEocrTripped(false);
    setPdSsMode('A');
    setPdFlsLevel(false);
    setPdTSelfHold(false);
    setPdTLeft(pdTDelaySetting);
    setPdTDelayContact(false);
    setPdFrBlink(false);
  };

  return (
    <div className="min-h-screen bg-slate-950 p-4 md:p-8 max-w-5xl mx-auto space-y-6">
          <div className="space-y-6 animate-fadeIn">
            <div className="bg-slate-800 p-5 rounded-2xl border border-slate-700 space-y-4">
              <div className="flex items-center space-x-2 text-amber-400 font-bold text-base border-b border-slate-700 pb-3">
                <FileSearch className="w-5 h-5" />
                <h2>2번 회로 해석: EOCR·FLS 급수펌프 자동/수동 운전</h2>
              </div>
              <p className="text-xs text-slate-300 leading-relaxed">
                MCCB로 전원을 투입하면 EOCR(과전류 계전기)에 전원이 공급됩니다. 셀렉터 스위치 SS를 <b className="text-sky-400">A(자동)</b>에 두면 FLS(플로트레스 스위치)가 수위를 감지해 X 릴레이 → MC1 → M1 모터 / RL(적색등) 순으로 자동 기동되고, <b className="text-emerald-400">M(수동)</b>에 두면 PB1을 눌러 T(타이머)가 자기유지된 뒤 설정시간이 지나면 MC2 → M2 모터 / GL(녹색등)이 기동됩니다. EOCR이 과전류를 감지해 트립되면 FR(플리커 릴레이)이 여자되어 BZ(부저)와 YL(황색등)이 교대로 점멸하며 경보합니다. ※ 본 시뮬레이터는 EOCR·FLS·SS(자동/수동) 계열 공개도면의 대표 동작 로직을 기준으로 구성되었으며, 세부 결선 순서는 원본 도면과 다소 차이가 있을 수 있으니 원본 사진을 함께 참고하세요.
              </p>

              <div className="flex items-center justify-between flex-wrap gap-2">
                <span className="text-xs font-bold text-amber-400 flex items-center space-x-1.5">
                  <ImageIcon className="w-4 h-4" />
                  <span>원본 공개도면</span>
                </span>
                <button
                  onClick={() => setModalImage('../images/elec_practice_circuit/Electrician002_jpg_20250804.png')}
                  className="text-[11px] text-amber-400 hover:text-amber-300 flex items-center space-x-1 bg-amber-500/10 px-2.5 py-1 rounded-lg border border-amber-500/30"
                >
                  <Maximize2 className="w-3 h-3" />
                  <span>사진 크게 보기</span>
                </button>
              </div>
              <div className="bg-slate-900 rounded-xl border border-slate-800 p-3 flex flex-col items-center justify-center overflow-hidden">
                <img
                  src="../images/elec_practice_circuit/Electrician002_jpg_20250804.png"
                  alt="EOCR FLS 급수펌프 자동/수동 운전 공개도면"
                  className="max-h-[420px] w-auto object-contain rounded-lg border border-slate-700/60 shadow cursor-pointer hover:opacity-95 transition-all"
                  onClick={() => setModalImage('../images/elec_practice_circuit/Electrician002_jpg_20250804.png')}
                  onError={(e) => {
                    e.target.onerror = null;
                    e.target.style.display = 'none';
                    document.getElementById('fallback-public-diagram-pump').style.display = 'flex';
                  }}
                />
                <div
                  id="fallback-public-diagram-pump"
                  className="hidden flex-col items-center justify-center p-6 text-center space-y-2 bg-slate-950 rounded-xl border border-dashed border-slate-700 text-slate-400 w-full"
                >
                  <ImageIcon className="w-8 h-8 text-slate-500 mb-1" />
                  <p className="text-xs font-bold text-slate-300">공개도면 이미지 준비 중</p>
                  <p className="text-[11px] text-slate-500">
                    경로: <code className="text-amber-400">../images/elec_practice_circuit/Electrician002_jpg_20250804.png</code>
                  </p>
                </div>
              </div>
            </div>

            <div className="bg-slate-950 rounded-2xl border border-slate-800 p-5 space-y-3">
              <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                <span className="text-xs font-bold text-slate-400 uppercase tracking-widest flex items-center space-x-1.5">
                  <Activity className="w-4 h-4 text-amber-400" />
                  <span>실시간 회로 통전 상태</span>
                </span>
                <span
                  className={`text-xs px-2.5 py-1 rounded-full font-bold ${
                    pdEocrTripped ? 'bg-rose-500/20 text-rose-400' : pdMc1Energized || pdMc2Energized ? 'bg-amber-500/20 text-amber-400' : 'bg-slate-800 text-slate-400'
                  }`}
                >
                  {pdEocrTripped ? 'EOCR 트립' : !pdMccbOn ? '전원 차단' : pdMc1Energized || pdMc2Energized ? '펌프 가동중' : '대기 상태'}
                </span>
              </div>

              <div className="py-4 flex items-center justify-center overflow-x-auto">
                <svg viewBox="0 0 720 280" className="w-full max-w-3xl h-auto text-slate-300 select-none">
                  {/* 상단 모선 (MCCB 이후) */}
                  <line x1="20" y1="25" x2="90" y2="25" stroke={pdMccbOn ? '#f59e0b' : '#64748b'} strokeWidth="3" />
                  <circle cx="90" cy="25" r="4" fill={pdMccbOn ? '#f59e0b' : '#64748b'} />

                  {/* EOCR b접점 (정상시 닫힘 → 메인모선, 트립시 열림) */}
                  <circle cx="120" cy="25" r="4" fill={pdMainBusOn ? '#f59e0b' : '#64748b'} />
                  {!pdEocrTripped ? (
                    <path d="M 90 25 L 105 32 L 120 25" fill="none" stroke={pdMainBusOn ? '#f59e0b' : '#64748b'} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" />
                  ) : (
                    <line x1="97" y1="14" x2="113" y2="8" stroke="#64748b" strokeWidth="3" strokeLinecap="round" />
                  )}
                  <text x="90" y="10" fontSize="9" fill="#94a3b8" fontWeight="bold">EOCR-b</text>

                  {/* 메인 모선 (자동/수동 공통) */}
                  <line x1="120" y1="25" x2="560" y2="25" stroke={pdMainBusOn ? '#f59e0b' : '#64748b'} strokeWidth="3" />

                  {/* 경보용 탭 (EOCR-a, 트립시에만 통전) */}
                  <line x1="90" y1="25" x2="90" y2="60" stroke={pdMccbOn ? '#f59e0b' : '#64748b'} strokeWidth="3" />
                  <circle cx="300" cy="60" r="4" fill={pdMccbOn ? '#f59e0b' : '#64748b'} />
                  <circle cx="330" cy="60" r="4" fill={pdAlarmTapOn ? '#ef4444' : '#64748b'} />
                  {pdEocrTripped ? (
                    <path d="M 300 60 L 315 67 L 330 60" fill="none" stroke="#ef4444" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" />
                  ) : (
                    <line x1="307" y1="49" x2="323" y2="43" stroke="#64748b" strokeWidth="3" strokeLinecap="round" />
                  )}
                  <text x="300" y="80" fontSize="9" fill="#94a3b8" fontWeight="bold">EOCR-a (경보)</text>
                  <line x1="90" y1="60" x2="300" y2="60" stroke={pdMccbOn ? '#f59e0b' : '#64748b'} strokeWidth="3" />
                  <line x1="330" y1="60" x2="590" y2="60" stroke={pdAlarmTapOn ? '#ef4444' : '#64748b'} strokeWidth="3" />

                  {/* ===== 자동(A) 뭉치: SS-A → FLS → X → MC1 → RL/M1 ===== */}
                  <line x1="180" y1="25" x2="180" y2="55" stroke={pdMainBusOn ? '#f59e0b' : '#64748b'} strokeWidth="3" />
                  <circle cx="180" cy="55" r="4" fill={pdMainBusOn ? '#f59e0b' : '#64748b'} />
                  <circle cx="180" cy="75" r="4" fill={pdSsAClosedOn ? '#f59e0b' : '#64748b'} />
                  {pdSsMode === 'A' ? (
                    <path d="M 180 55 L 192 63 L 180 75" fill="none" stroke={pdMainBusOn ? '#f59e0b' : '#64748b'} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" />
                  ) : (
                    <line x1="185" y1="46" x2="197" y2="41" stroke="#64748b" strokeWidth="3" strokeLinecap="round" />
                  )}
                  <text x="186" y="70" fontSize="9" fill="#38bdf8" fontWeight="bold">SS-A</text>

                  <line x1="180" y1="75" x2="180" y2="100" stroke={pdSsAClosedOn ? '#f59e0b' : '#64748b'} strokeWidth="3" />
                  <circle cx="180" cy="100" r="4" fill={pdSsAClosedOn ? '#f59e0b' : '#64748b'} />
                  <circle cx="180" cy="120" r="4" fill={pdFlsClosedOn ? '#f59e0b' : '#64748b'} />
                  {pdFlsLevel ? (
                    <path d="M 180 100 L 192 108 L 180 120" fill="none" stroke={pdSsAClosedOn ? '#f59e0b' : '#64748b'} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" />
                  ) : (
                    <line x1="185" y1="91" x2="197" y2="86" stroke="#64748b" strokeWidth="3" strokeLinecap="round" />
                  )}
                  <text x="186" y="115" fontSize="9" fill="#38bdf8" fontWeight="bold">FLS</text>

                  <line x1="180" y1="120" x2="180" y2="150" stroke={pdFlsClosedOn ? '#f59e0b' : '#64748b'} strokeWidth="3" />
                  <rect x="155" y="150" width="50" height="26" rx="5" fill={pdXEnergized ? '#f59e0b' : '#1e293b'} stroke={pdXEnergized ? '#fbbf24' : '#475569'} strokeWidth="2" />
                  <text x="180" y="167" textAnchor="middle" fill={pdXEnergized ? '#0f172a' : '#94a3b8'} fontSize="11" fontWeight="bold">X 코일</text>
                  <line x1="180" y1="176" x2="180" y2="195" stroke={pdXEnergized ? '#f59e0b' : '#64748b'} strokeWidth="3" />
                  <rect x="155" y="195" width="50" height="26" rx="5" fill={pdMc1Energized ? '#f59e0b' : '#1e293b'} stroke={pdMc1Energized ? '#fbbf24' : '#475569'} strokeWidth="2" />
                  <text x="180" y="212" textAnchor="middle" fill={pdMc1Energized ? '#0f172a' : '#94a3b8'} fontSize="11" fontWeight="bold">MC1 코일</text>
                  <line x1="180" y1="221" x2="180" y2="255" stroke={pdMc1Energized ? '#f59e0b' : '#64748b'} strokeWidth="3" />

                  <line x1="205" y1="208" x2="245" y2="208" stroke={pdMc1Energized ? '#ef4444' : '#64748b'} strokeWidth="3" />
                  <circle cx="255" cy="208" r="10" fill={pdMc1Energized ? '#ef4444' : '#1e293b'} stroke="#64748b" strokeWidth="1.5" />
                  <text x="255" y="230" textAnchor="middle" fontSize="8" fill="#94a3b8">RL</text>
                  <line x1="205" y1="216" x2="245" y2="230" stroke={pdMc1Energized ? '#22c55e' : '#64748b'} strokeWidth="3" />
                  <circle cx="255" cy="238" r="10" fill="none" stroke={pdMc1Energized ? '#22c55e' : '#64748b'} strokeWidth="2" />
                  <text x="255" y="242" textAnchor="middle" fontSize="8" fill={pdMc1Energized ? '#22c55e' : '#64748b'} fontWeight="bold">M1</text>

                  {/* ===== 수동(M) 뭉치: SS-M → PB1 자기유지 T → MC2 → GL/M2 ===== */}
                  <line x1="390" y1="25" x2="390" y2="55" stroke={pdMainBusOn ? '#f59e0b' : '#64748b'} strokeWidth="3" />
                  <circle cx="390" cy="55" r="4" fill={pdMainBusOn ? '#f59e0b' : '#64748b'} />
                  <circle cx="390" cy="75" r="4" fill={pdSsMClosedOn ? '#f59e0b' : '#64748b'} />
                  {pdSsMode === 'M' ? (
                    <path d="M 390 55 L 402 63 L 390 75" fill="none" stroke={pdMainBusOn ? '#f59e0b' : '#64748b'} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" />
                  ) : (
                    <line x1="395" y1="46" x2="407" y2="41" stroke="#64748b" strokeWidth="3" strokeLinecap="round" />
                  )}
                  <text x="396" y="70" fontSize="9" fill="#34d399" fontWeight="bold">SS-M</text>

                  <line x1="390" y1="75" x2="390" y2="100" stroke={pdSsMClosedOn ? '#f59e0b' : '#64748b'} strokeWidth="3" />
                  <circle cx="390" cy="100" r="4" fill={pdSsMClosedOn ? '#f59e0b' : '#64748b'} />
                  <circle cx="390" cy="120" r="4" fill={pdTSelfHold ? '#f59e0b' : '#64748b'} />
                  {pdTSelfHold ? (
                    <path d="M 390 100 L 402 108 L 390 120" fill="none" stroke={pdSsMClosedOn ? '#f59e0b' : '#64748b'} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" />
                  ) : (
                    <line x1="395" y1="91" x2="407" y2="86" stroke="#64748b" strokeWidth="3" strokeLinecap="round" />
                  )}
                  <text x="396" y="115" fontSize="9" fill="#34d399" fontWeight="bold">PB1/자기유지</text>

                  <line x1="390" y1="120" x2="390" y2="150" stroke={pdTSelfHold ? '#f59e0b' : '#64748b'} strokeWidth="3" />
                  <rect x="365" y="150" width="50" height="26" rx="5" fill={pdTSelfHold ? '#f59e0b' : '#1e293b'} stroke={pdTSelfHold ? '#fbbf24' : '#475569'} strokeWidth="2" />
                  <text x="390" y="167" textAnchor="middle" fill={pdTSelfHold ? '#0f172a' : '#94a3b8'} fontSize="11" fontWeight="bold">T 코일</text>
                  <line x1="390" y1="176" x2="390" y2="195" stroke={pdTDelayContact ? '#f59e0b' : '#64748b'} strokeWidth="3" />
                  <rect x="365" y="195" width="50" height="26" rx="5" fill={pdMc2Energized ? '#f59e0b' : '#1e293b'} stroke={pdMc2Energized ? '#fbbf24' : '#475569'} strokeWidth="2" />
                  <text x="390" y="212" textAnchor="middle" fill={pdMc2Energized ? '#0f172a' : '#94a3b8'} fontSize="11" fontWeight="bold">MC2 코일</text>
                  <line x1="390" y1="221" x2="390" y2="255" stroke={pdMc2Energized ? '#f59e0b' : '#64748b'} strokeWidth="3" />

                  <line x1="415" y1="208" x2="455" y2="208" stroke={pdMc2Energized ? '#22c55e' : '#64748b'} strokeWidth="3" />
                  <circle cx="465" cy="208" r="10" fill={pdMc2Energized ? '#22c55e' : '#1e293b'} stroke="#64748b" strokeWidth="1.5" />
                  <text x="465" y="230" textAnchor="middle" fontSize="8" fill="#94a3b8">GL</text>
                  <line x1="415" y1="216" x2="455" y2="230" stroke={pdMc2Energized ? '#22c55e' : '#64748b'} strokeWidth="3" />
                  <circle cx="465" cy="238" r="10" fill="none" stroke={pdMc2Energized ? '#22c55e' : '#64748b'} strokeWidth="2" />
                  <text x="465" y="242" textAnchor="middle" fontSize="8" fill={pdMc2Energized ? '#22c55e' : '#64748b'} fontWeight="bold">M2</text>

                  {/* ===== 경보 뭉치: EOCR-a → FR → BZ/YL ===== */}
                  <line x1="590" y1="60" x2="590" y2="150" stroke={pdAlarmTapOn ? '#ef4444' : '#64748b'} strokeWidth="3" />
                  <rect x="565" y="150" width="50" height="26" rx="5" fill={pdEocrTripped ? '#ef4444' : '#1e293b'} stroke={pdEocrTripped ? '#fca5a5' : '#475569'} strokeWidth="2" />
                  <text x="590" y="167" textAnchor="middle" fill={pdEocrTripped ? '#fff1f2' : '#94a3b8'} fontSize="11" fontWeight="bold">FR 코일</text>
                  <line x1="590" y1="176" x2="590" y2="195" stroke={pdEocrTripped ? '#ef4444' : '#64748b'} strokeWidth="3" />

                  <line x1="590" y1="195" x2="565" y2="210" stroke={pdBzOn ? '#ef4444' : '#64748b'} strokeWidth="3" />
                  <rect x="545" y="210" width="26" height="20" rx="3" fill={pdBzOn ? '#ef4444' : '#1e293b'} stroke="#64748b" strokeWidth="1.5" />
                  <text x="558" y="224" textAnchor="middle" fontSize="8" fill={pdBzOn ? '#fff1f2' : '#94a3b8'} fontWeight="bold">BZ</text>

                  <line x1="590" y1="195" x2="615" y2="210" stroke={pdYlOn ? '#eab308' : '#64748b'} strokeWidth="3" />
                  <circle cx="625" cy="218" r="10" fill={pdYlOn ? '#eab308' : '#1e293b'} stroke="#64748b" strokeWidth="1.5" />
                  <text x="625" y="240" textAnchor="middle" fontSize="8" fill="#94a3b8">YL</text>

                  {/* 하단 공통 모선 (중성/복귀) */}
                  <line x1="20" y1="255" x2="660" y2="255" stroke={pdMccbOn ? '#3b82f6' : '#64748b'} strokeWidth="3" />
                </svg>
              </div>
              <p className="text-[10px] text-slate-500 text-center">주황색 = 전류가 흐르는 통전 구간 · 회색 = 전류가 끊긴 구간 · 파란색 = 공통 복귀(중성) 모선 · 빨간색 = EOCR 경보 계통</p>
            </div>

            <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 space-y-5">
              <div className="flex items-center justify-between flex-wrap gap-3 border-b border-slate-700 pb-3">
                <div className="flex items-center space-x-2 text-amber-400 font-bold text-base">
                  <Activity className="w-5 h-5" />
                  <h2>동작 시뮬레이터</h2>
                </div>

                <button
                  onClick={resetPublicDiagram}
                  className="px-4 py-2 rounded-xl text-xs font-bold bg-slate-700 hover:bg-slate-600 text-slate-100 flex items-center space-x-2"
                >
                  <RotateCcw className="w-4 h-4" />
                  <span>전체 초기화</span>
                </button>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div className="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-2.5">
                  <h3 className="text-xs font-bold text-slate-300">① 전원 & 보호 (MCCB / EOCR)</h3>
                  <button
                    onClick={() => setPdMccbOn(!pdMccbOn)}
                    className={`w-full py-2 rounded-lg text-xs font-bold transition-all ${
                      pdMccbOn ? 'bg-amber-500 text-slate-950' : 'bg-slate-700 text-slate-300'
                    }`}
                  >
                    MCCB: {pdMccbOn ? 'ON' : 'OFF'}
                  </button>
                  <button
                    onClick={() => setPdEocrTripped(!pdEocrTripped)}
                    disabled={!pdMccbOn}
                    className={`w-full py-2 rounded-lg text-xs font-bold transition-all disabled:opacity-40 ${
                      pdEocrTripped ? 'bg-rose-500 text-slate-950' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'
                    }`}
                  >
                    EOCR: {pdEocrTripped ? '트립 (과전류)' : '정상'}
                  </button>
                </div>

                <div className="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-2.5">
                  <h3 className="text-xs font-bold text-slate-300">② SS 선택스위치</h3>
                  <div className="flex gap-2">
                    <button
                      onClick={() => setPdSsMode('A')}
                      className={`flex-1 py-2 rounded-lg text-xs font-bold ${
                        pdSsMode === 'A' ? 'bg-sky-500 text-slate-950' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'
                      }`}
                    >
                      A (자동)
                    </button>
                    <button
                      onClick={() => setPdSsMode('M')}
                      className={`flex-1 py-2 rounded-lg text-xs font-bold ${
                        pdSsMode === 'M' ? 'bg-emerald-500 text-slate-950' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'
                      }`}
                    >
                      M (수동)
                    </button>
                  </div>
                  {pdSsMode === 'A' ? (
                    <button
                      onClick={() => setPdFlsLevel(!pdFlsLevel)}
                      disabled={!pdMccbOn || pdEocrTripped}
                      className={`w-full py-2 rounded-lg text-xs font-bold disabled:opacity-40 ${
                        pdFlsLevel ? 'bg-sky-500/80 text-slate-950' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'
                      }`}
                    >
                      FLS 수위감지: {pdFlsLevel ? 'ON' : 'OFF'}
                    </button>
                  ) : (
                    <div className="flex gap-2">
                      <button
                        onClick={pdPressPB1}
                        disabled={!pdMccbOn || pdEocrTripped || pdXEnergized}
                        className="flex-1 py-2 rounded-lg text-xs font-bold bg-emerald-600 hover:bg-emerald-500 text-white disabled:opacity-40"
                      >
                        PB1 (기동)
                      </button>
                      <button
                        onClick={pdPressPB0}
                        className="flex-1 py-2 rounded-lg text-xs font-bold bg-rose-600 hover:bg-rose-500 text-white"
                      >
                        PB0 (정지)
                      </button>
                    </div>
                  )}
                </div>

                <div className="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-2.5">
                  <h3 className="text-xs font-bold text-slate-300">③ T 한시 설정시간</h3>
                  <div className="flex gap-2">
                    {[1, 2, 3, 5].map((sec) => (
                      <button
                        key={sec}
                        onClick={() => pdChangeTDelay(sec)}
                        className={`flex-1 py-1.5 rounded-lg text-xs font-bold border ${
                          pdTDelaySetting === sec
                            ? 'bg-sky-500 text-slate-950 border-sky-300'
                            : 'bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700'
                        }`}
                      >
                        {sec}초
                      </button>
                    ))}
                  </div>
                  <div className="text-[11px] text-slate-400 bg-slate-950 rounded-lg px-2 py-1.5 border border-slate-800">
                    {pdSsMode !== 'M'
                      ? '수동(M) 모드에서만 T가 동작합니다.'
                      : pdTDelayContact
                      ? '한시접점 동작 완료 → MC2 여자'
                      : pdTSelfHold
                      ? `카운트: ${pdTDelaySetting - pdTLeft}s / ${pdTDelaySetting}s`
                      : '대기 중 (PB1을 누르세요)'}
                  </div>
                </div>
              </div>

              <div className="grid grid-cols-3 sm:grid-cols-4 lg:grid-cols-6 gap-2 text-center">
                {[
                  { label: 'EOCR', on: pdEocrTripped, onColor: 'bg-rose-500/20 border-rose-500/50 text-rose-300', offText: '정상' },
                  { label: 'X 릴레이', on: pdXEnergized, onColor: 'bg-sky-500/20 border-sky-500/50 text-sky-300' },
                  { label: 'T 한시', on: pdTDelayContact, onColor: 'bg-sky-500/20 border-sky-500/50 text-sky-300' },
                  { label: 'MC1', on: pdMc1Energized, onColor: 'bg-amber-500/20 border-amber-500/50 text-amber-300' },
                  { label: 'MC2', on: pdMc2Energized, onColor: 'bg-amber-500/20 border-amber-500/50 text-amber-300' },
                  { label: 'FR(플리커)', on: pdEocrTripped, onColor: 'bg-rose-500/20 border-rose-500/50 text-rose-300' },
                  { label: 'M1 모터', on: pdMc1Energized, onColor: 'bg-emerald-500/20 border-emerald-500/50 text-emerald-300' },
                  { label: 'M2 모터', on: pdMc2Energized, onColor: 'bg-emerald-500/20 border-emerald-500/50 text-emerald-300' },
                  { label: 'RL(적색등)', on: pdMc1Energized, onColor: 'bg-red-500/20 border-red-500/50 text-red-300' },
                  { label: 'GL(녹색등)', on: pdMc2Energized, onColor: 'bg-green-500/20 border-green-500/50 text-green-300' },
                  { label: 'YL(황색등)', on: pdYlOn, onColor: 'bg-yellow-500/20 border-yellow-500/50 text-yellow-300' },
                  { label: 'BZ(부저)', on: pdBzOn, onColor: 'bg-rose-500/20 border-rose-500/50 text-rose-300' }
                ].map((item) => (
                  <div
                    key={item.label}
                    className={`p-2 rounded-lg border text-[11px] font-bold transition-all ${
                      item.on ? item.onColor : 'bg-slate-900 border-slate-800 text-slate-500'
                    }`}
                  >
                    <div>{item.label}</div>
                    <div className="mt-0.5">{item.on ? (item.label === 'EOCR' ? '트립' : 'ON') : item.label === 'EOCR' ? item.offText || 'OFF' : 'OFF'}</div>
                  </div>
                ))}
              </div>

              <div className="space-y-3">
                <div className="bg-slate-900 rounded-xl border border-slate-800 p-3 overflow-x-auto">
                  <div className="text-xs font-bold text-sky-400 mb-2">자동(A) 모드 흐름: FLS 수위감지 → X → MC1 → RL / M1</div>
                  <div className="flex items-center space-x-1.5 min-w-max text-[11px] font-bold">
                    <span className={`px-2.5 py-1.5 rounded-lg border ${pdSsMode === 'A' ? 'bg-sky-500/20 border-sky-500/50 text-sky-300' : 'bg-slate-800 border-slate-700 text-slate-500'}`}>SS=A</span>
                    <ArrowRight className="w-3.5 h-3.5 text-slate-600" />
                    <span className={`px-2.5 py-1.5 rounded-lg border ${pdSsMode === 'A' && pdFlsLevel ? 'bg-sky-500/20 border-sky-500/50 text-sky-300' : 'bg-slate-800 border-slate-700 text-slate-500'}`}>FLS 감지</span>
                    <ArrowRight className="w-3.5 h-3.5 text-slate-600" />
                    <span className={`px-2.5 py-1.5 rounded-lg border ${pdXEnergized ? 'bg-sky-500/20 border-sky-500/50 text-sky-300' : 'bg-slate-800 border-slate-700 text-slate-500'}`}>X 여자</span>
                    <ArrowRight className="w-3.5 h-3.5 text-slate-600" />
                    <span className={`px-2.5 py-1.5 rounded-lg border ${pdMc1Energized ? 'bg-amber-500/20 border-amber-500/50 text-amber-300' : 'bg-slate-800 border-slate-700 text-slate-500'}`}>MC1 여자</span>
                    <ArrowRight className="w-3.5 h-3.5 text-slate-600" />
                    <span className={`px-2.5 py-1.5 rounded-lg border ${pdMc1Energized ? 'bg-red-500/20 border-red-500/50 text-red-300' : 'bg-slate-800 border-slate-700 text-slate-500'}`}>RL 점등</span>
                    <span className={`px-2.5 py-1.5 rounded-lg border ${pdMc1Energized ? 'bg-emerald-500/20 border-emerald-500/50 text-emerald-300' : 'bg-slate-800 border-slate-700 text-slate-500'}`}>M1 회전</span>
                  </div>
                </div>

                <div className="bg-slate-900 rounded-xl border border-slate-800 p-3 overflow-x-auto">
                  <div className="text-xs font-bold text-emerald-400 mb-2">수동(M) 모드 흐름: PB1 → T 자기유지 → 지연 → MC2 → GL / M2 (X의 b접점이 인터록)</div>
                  <div className="flex items-center space-x-1.5 min-w-max text-[11px] font-bold">
                    <span className={`px-2.5 py-1.5 rounded-lg border ${pdSsMode === 'M' ? 'bg-emerald-500/20 border-emerald-500/50 text-emerald-300' : 'bg-slate-800 border-slate-700 text-slate-500'}`}>SS=M</span>
                    <ArrowRight className="w-3.5 h-3.5 text-slate-600" />
                    <span className={`px-2.5 py-1.5 rounded-lg border ${pdTSelfHold ? 'bg-emerald-500/20 border-emerald-500/50 text-emerald-300' : 'bg-slate-800 border-slate-700 text-slate-500'}`}>PB1 → T 자기유지</span>
                    <ArrowRight className="w-3.5 h-3.5 text-slate-600" />
                    <span className={`px-2.5 py-1.5 rounded-lg border ${pdTDelayContact ? 'bg-sky-500/20 border-sky-500/50 text-sky-300' : 'bg-slate-800 border-slate-700 text-slate-500'}`}>T 한시접점</span>
                    <ArrowRight className="w-3.5 h-3.5 text-slate-600" />
                    <span className={`px-2.5 py-1.5 rounded-lg border ${pdMc2Energized ? 'bg-amber-500/20 border-amber-500/50 text-amber-300' : 'bg-slate-800 border-slate-700 text-slate-500'}`}>MC2 여자</span>
                    <ArrowRight className="w-3.5 h-3.5 text-slate-600" />
                    <span className={`px-2.5 py-1.5 rounded-lg border ${pdMc2Energized ? 'bg-green-500/20 border-green-500/50 text-green-300' : 'bg-slate-800 border-slate-700 text-slate-500'}`}>GL 점등</span>
                    <span className={`px-2.5 py-1.5 rounded-lg border ${pdMc2Energized ? 'bg-emerald-500/20 border-emerald-500/50 text-emerald-300' : 'bg-slate-800 border-slate-700 text-slate-500'}`}>M2 회전</span>
                  </div>
                </div>

                <div className="bg-slate-900 rounded-xl border border-slate-800 p-3 overflow-x-auto">
                  <div className="text-xs font-bold text-rose-400 mb-2">EOCR 과전류 경보 흐름: EOCR 트립 → FR(플리커) → BZ/YL 교대 점멸</div>
                  <div className="flex items-center space-x-1.5 min-w-max text-[11px] font-bold">
                    <span className={`px-2.5 py-1.5 rounded-lg border ${pdEocrTripped ? 'bg-rose-500/20 border-rose-500/50 text-rose-300' : 'bg-slate-800 border-slate-700 text-slate-500'}`}>EOCR 트립</span>
                    <ArrowRight className="w-3.5 h-3.5 text-slate-600" />
                    <span className={`px-2.5 py-1.5 rounded-lg border ${pdEocrTripped ? 'bg-rose-500/20 border-rose-500/50 text-rose-300' : 'bg-slate-800 border-slate-700 text-slate-500'}`}>FR 여자(점멸중)</span>
                    <ArrowRight className="w-3.5 h-3.5 text-slate-600" />
                    <span className={`px-2.5 py-1.5 rounded-lg border ${pdBzOn ? 'bg-rose-500/20 border-rose-500/50 text-rose-300' : 'bg-slate-800 border-slate-700 text-slate-500'}`}>BZ 부저</span>
                    <span className={`px-2.5 py-1.5 rounded-lg border ${pdYlOn ? 'bg-yellow-500/20 border-yellow-500/50 text-yellow-300' : 'bg-slate-800 border-slate-700 text-slate-500'}`}>YL 점등</span>
                  </div>
                  <p className="text-[10px] text-slate-500 mt-1.5">EOCR 트립 시 전체 주회로 및 X/T/MC1/MC2 계열은 즉시 정지하고, FR만 별도 경보 계통으로 전원을 공급받아 부저와 램프를 교대로 점멸시킵니다.</p>
                </div>
              </div>
            </div>
          </div>

      {modalImage && (
        <div onClick={() => setModalImage(null)} className="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4 cursor-pointer">
          <div className="relative max-w-5xl w-full bg-slate-900 border border-slate-700 rounded-2xl p-4 overflow-auto max-h-[90vh] shadow-2xl">
            <button onClick={() => setModalImage(null)} className="absolute top-3 right-3 p-2 rounded-full bg-slate-800 text-slate-300 hover:text-white hover:bg-slate-700 z-10">
              <X className="w-5 h-5" />
            </button>
            <img src={modalImage} alt="원본 도면 확대" className="w-full h-auto object-contain rounded-xl bg-slate-950 border border-slate-800" />
          </div>
        </div>
      )}
    </div>
  );
}

import { createRoot } from 'react-dom/client';
const bootEl = document.getElementById('boot');
if (bootEl) bootEl.remove();
createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
