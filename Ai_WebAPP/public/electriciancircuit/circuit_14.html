<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>14번 회로 해석: PB1/PB2·LS1/LS2·T1/T2 순차(왕복) 운전 · 도면 해석</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background: #0F172A; }
  #root { min-height:100vh; }
  #boot {
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:#0F172A; color:#8FA79B; font-family:monospace; font-size:0.85rem;
    letter-spacing:0.05em; z-index:1;
  }
  .animate-fadeIn { animation: fadeIn 0.3s ease-in; }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
</style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.383.0?external=react"
  }
}
</script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
</head>
<body>
<div id="boot">불러오는 중...</div>
<div id="root"></div>

<script type="text/babel" data-type="module" data-presets="react,typescript">
import React, { useState, useEffect } from 'react';
import {
  Activity, Power, RotateCcw, Maximize2, Image as ImageIcon, ArrowRight, X, FileSearch, Clock
} from 'lucide-react';

function App() {
  const [modalImage, setModalImage] = useState(null);

  // ===== 도면 해석: PB1/PB2 · LS1/LS2 · T1/T2 · MC1/MC2 순차(왕복) 운전 회로 =====
  const [bMccbOn, setBMccbOn] = useState(true);
  const [bEocrTripped, setBEocrTripped] = useState(false);
  const [bX1, setBX1] = useState(false);
  const [bX2, setBX2] = useState(false);
  const [bLs1, setBLs1] = useState(false);
  const [bLs2, setBLs2] = useState(false);
  const [bT1Setting, setBT1Setting] = useState(3);
  const [bT2Setting, setBT2Setting] = useState(3);
  const [bT1Left, setBT1Left] = useState(3);
  const [bT2Left, setBT2Left] = useState(3);
  const [bT1Done, setBT1Done] = useState(false);
  const [bT2Done, setBT2Done] = useState(false);

  const bMainBusOn = bMccbOn && !bEocrTripped;

  useEffect(() => {
    if (!bMainBusOn) {
      setBX1(false);
      setBX2(false);
    }
  }, [bMainBusOn]);

  const bPressPB1 = () => {
    if (bMainBusOn && !bX2) setBX1(true);
  };
  const bPressPB2 = () => {
    if (bMainBusOn && !bX1) setBX2(true);
  };
  const bPressPB0 = () => {
    setBX1(false);
    setBX2(false);
  };

  const bT1Active = bMainBusOn && bX1 && bLs1;
  const bT2Active = bMainBusOn && bX2 && bLs2;

  useEffect(() => {
    if (!bT1Active) {
      setBT1Left(bT1Setting);
      setBT1Done(false);
      return;
    }
    if (bT1Done) return;
    const id = setInterval(() => {
      setBT1Left((prev) => {
        if (prev <= 1) {
          clearInterval(id);
          setBT1Done(true);
          return 0;
        }
        return prev - 1;
      });
    }, 1000);
    return () => clearInterval(id);
  }, [bT1Active, bT1Setting, bT1Done]);

  useEffect(() => {
    if (!bT2Active) {
      setBT2Left(bT2Setting);
      setBT2Done(false);
      return;
    }
    if (bT2Done) return;
    const id = setInterval(() => {
      setBT2Left((prev) => {
        if (prev <= 1) {
          clearInterval(id);
          setBT2Done(true);
          return 0;
        }
        return prev - 1;
      });
    }, 1000);
    return () => clearInterval(id);
  }, [bT2Active, bT2Setting, bT2Done]);

  const bMc1On = bMainBusOn && bT1Done;
  const bMc2On = bMainBusOn && bT2Done;
  const bWlOn = bMainBusOn && (bX1 || bX2);
  const bRlOn = bMainBusOn && !bX1 && !bX2;
  const bGlOn = bMc1On || bMc2On;

  const bChangeT1 = (sec) => {
    setBT1Setting(sec);
    setBT1Left(sec);
    setBT1Done(false);
  };
  const bChangeT2 = (sec) => {
    setBT2Setting(sec);
    setBT2Left(sec);
    setBT2Done(false);
  };

  const bReset = () => {
    setBMccbOn(true);
    setBEocrTripped(false);
    setBX1(false);
    setBX2(false);
    setBLs1(false);
    setBLs2(false);
    setBT1Done(false);
    setBT2Done(false);
    setBT1Left(bT1Setting);
    setBT2Left(bT2Setting);
  };

  return (
    <div className="min-h-screen bg-slate-950 p-4 md:p-8 max-w-5xl mx-auto space-y-6">
      <div className="bg-slate-800 p-5 rounded-2xl border border-slate-700 space-y-4">
        <div className="flex items-center space-x-2 text-amber-400 font-bold text-base border-b border-slate-700 pb-3">
          <FileSearch className="w-5 h-5" />
          <h2>14번 회로 해석: PB1/PB2·LS1/LS2·T1/T2 순차(왕복) 운전</h2>
        </div>
        <p className="text-xs text-slate-300 leading-relaxed">MCCB와 EOCR을 통해 전원이 공급되고, PB0(정지)이 전체 회로와 직렬로 연결되어 있어 언제든 전체 정지가 가능합니다. PB1을 누르면 X1 릴레이가 자기유지되며(X2와 상호 인터록), LS1(리밋스위치)이 동작 위치를 감지하면 T1 타이머가 카운트되어 설정시간 후 MC1이 여자되고 M1 모터가 구동됩니다. 반대로 PB2 → X2 자기유지 → LS2 감지 → T2 → MC2 → M2 순으로 반대 계열이 동작합니다. WL(백색등)은 구동 중, RL(적색등)은 대기, GL(녹색등)은 동작 완료를 표시합니다. ※ 본 시뮬레이터는 PB1/PB2·LS1/LS2·T1/T2·MC1/MC2 계열 공개도면의 대표 동작 로직을 기준으로 구성되었으며, 세부 결선 순서는 원본 도면과 다소 차이가 있을 수 있으니 원본 사진을 함께 참고하세요.</p>

        <div className="flex items-center justify-between flex-wrap gap-2">
          <span className="text-xs font-bold text-amber-400 flex items-center space-x-1.5">
            <ImageIcon className="w-4 h-4" />
            <span>원본 공개도면</span>
          </span>
          <button
            onClick={() => setModalImage('../images/elec_practice_circuit/Electrician014_jpg_20250804.png')}
            className="text-[11px] text-amber-400 hover:text-amber-300 flex items-center space-x-1 bg-amber-500/10 px-2.5 py-1 rounded-lg border border-amber-500/30"
          >
            <Maximize2 className="w-3 h-3" />
            <span>사진 크게 보기</span>
          </button>
        </div>
        <div className="bg-slate-900 rounded-xl border border-slate-800 p-3 flex flex-col items-center justify-center overflow-hidden">
          <img
            src="../images/elec_practice_circuit/Electrician014_jpg_20250804.png"
            alt="14번 회로 해석: PB1/PB2·LS1/LS2·T1/T2 순차(왕복) 운전"
            className="max-h-[420px] w-auto object-contain rounded-lg border border-slate-700/60 shadow cursor-pointer hover:opacity-95 transition-all"
            onClick={() => setModalImage('../images/elec_practice_circuit/Electrician014_jpg_20250804.png')}
            onError={(e) => {
              e.target.onerror = null;
              e.target.style.display = 'none';
              document.getElementById('fallback-img').style.display = 'flex';
            }}
          />
          <div id="fallback-img" className="hidden flex-col items-center justify-center p-6 text-center space-y-2 bg-slate-950 rounded-xl border border-dashed border-slate-700 text-slate-400 w-full">
            <ImageIcon className="w-8 h-8 text-slate-500 mb-1" />
            <p className="text-xs font-bold text-slate-300">이미지 준비 중</p>
            <p className="text-[11px] text-slate-500">경로: <code className="text-amber-400">../images/elec_practice_circuit/Electrician014_jpg_20250804.png</code></p>
          </div>
        </div>
      </div>

      <div className="bg-slate-950 rounded-2xl border border-slate-800 p-5 space-y-3">
        <div className="flex items-center justify-between border-b border-slate-800 pb-3">
          <span className="text-xs font-bold text-slate-400 uppercase tracking-widest flex items-center space-x-1.5">
            <Activity className="w-4 h-4 text-amber-400" />
            <span>실시간 회로 통전 상태</span>
          </span>
          <span className={`text-xs px-2.5 py-1 rounded-full font-bold ${bEocrTripped ? 'bg-rose-500/20 text-rose-400' : bGlOn ? 'bg-amber-500/20 text-amber-400' : 'bg-slate-800 text-slate-400'}`}>
            {bEocrTripped ? 'EOCR 트립' : !bMccbOn ? '전원 차단' : bGlOn ? '동작 완료' : bWlOn ? '구동중' : '대기 상태'}
          </span>
        </div>

        <div className="py-4 flex items-center justify-center overflow-x-auto">
          <svg viewBox="0 0 620 280" className="w-full max-w-3xl h-auto text-slate-300 select-none">
            <line x1="20" y1="25" x2="60" y2="25" stroke={bMccbOn ? '#f59e0b' : '#64748b'} strokeWidth="3" />
            <circle cx="60" cy="25" r="4" fill={bMccbOn ? '#f59e0b' : '#64748b'} />
            <circle cx="90" cy="25" r="4" fill={bMainBusOn ? '#f59e0b' : '#64748b'} />
            {!bEocrTripped ? (
              <path d="M 60 25 L 75 32 L 90 25" fill="none" stroke={bMainBusOn ? '#f59e0b' : '#64748b'} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" />
            ) : (
              <line x1="67" y1="14" x2="83" y2="8" stroke="#64748b" strokeWidth="3" strokeLinecap="round" />
            )}
            <text x="60" y="10" fontSize="9" fill="#94a3b8" fontWeight="bold">EOCR-b</text>
            <line x1="90" y1="25" x2="560" y2="25" stroke={bMainBusOn ? '#f59e0b' : '#64748b'} strokeWidth="3" />
            <text x="360" y="18" fontSize="9" fill="#94a3b8" fontWeight="bold">PB0(정지) 직렬 포함</text>

            {/* X1 뭉치 */}
            <line x1="180" y1="25" x2="180" y2="55" stroke={bMainBusOn ? '#f59e0b' : '#64748b'} strokeWidth="3" />
            <rect x="155" y="55" width="50" height="24" rx="5" fill={bX1 ? '#f59e0b' : '#1e293b'} stroke={bX1 ? '#fbbf24' : '#475569'} strokeWidth="2" />
            <text x="180" y="71" textAnchor="middle" fill={bX1 ? '#0f172a' : '#94a3b8'} fontSize="10" fontWeight="bold">X1(PB1)</text>
            <line x1="180" y1="79" x2="180" y2="100" stroke={bX1 ? '#f59e0b' : '#64748b'} strokeWidth="3" />
            <circle cx="180" cy="100" r="4" fill={bX1 ? '#f59e0b' : '#64748b'} />
            <circle cx="180" cy="120" r="4" fill={bT1Active ? '#f59e0b' : '#64748b'} />
            {bLs1 ? (
              <path d="M 180 100 L 192 108 L 180 120" fill="none" stroke={bX1 ? '#f59e0b' : '#64748b'} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" />
            ) : (
              <line x1="185" y1="91" x2="197" y2="86" stroke="#64748b" strokeWidth="3" strokeLinecap="round" />
            )}
            <text x="186" y="115" fontSize="9" fill="#38bdf8" fontWeight="bold">LS1</text>
            <line x1="180" y1="120" x2="180" y2="150" stroke={bT1Active ? '#f59e0b' : '#64748b'} strokeWidth="3" />
            <rect x="155" y="150" width="50" height="24" rx="5" fill={bT1Active ? '#f59e0b' : '#1e293b'} stroke={bT1Active ? '#fbbf24' : '#475569'} strokeWidth="2" />
            <text x="180" y="166" textAnchor="middle" fill={bT1Active ? '#0f172a' : '#94a3b8'} fontSize="10" fontWeight="bold">T1 코일</text>
            <line x1="180" y1="174" x2="180" y2="195" stroke={bT1Done ? '#f59e0b' : '#64748b'} strokeWidth="3" />
            <rect x="155" y="195" width="50" height="24" rx="5" fill={bMc1On ? '#f59e0b' : '#1e293b'} stroke={bMc1On ? '#fbbf24' : '#475569'} strokeWidth="2" />
            <text x="180" y="211" textAnchor="middle" fill={bMc1On ? '#0f172a' : '#94a3b8'} fontSize="10" fontWeight="bold">MC1</text>
            <line x1="180" y1="219" x2="180" y2="255" stroke={bMc1On ? '#22c55e' : '#64748b'} strokeWidth="3" />
            <circle cx="180" cy="255" r="0" />
            <text x="180" y="272" textAnchor="middle" fontSize="8" fill={bMc1On ? '#22c55e' : '#64748b'} fontWeight="bold">M1 정회전</text>

            {/* X2 뭉치 */}
            <line x1="400" y1="25" x2="400" y2="55" stroke={bMainBusOn ? '#f59e0b' : '#64748b'} strokeWidth="3" />
            <rect x="375" y="55" width="50" height="24" rx="5" fill={bX2 ? '#f59e0b' : '#1e293b'} stroke={bX2 ? '#fbbf24' : '#475569'} strokeWidth="2" />
            <text x="400" y="71" textAnchor="middle" fill={bX2 ? '#0f172a' : '#94a3b8'} fontSize="10" fontWeight="bold">X2(PB2)</text>
            <line x1="400" y1="79" x2="400" y2="100" stroke={bX2 ? '#f59e0b' : '#64748b'} strokeWidth="3" />
            <circle cx="400" cy="100" r="4" fill={bX2 ? '#f59e0b' : '#64748b'} />
            <circle cx="400" cy="120" r="4" fill={bT2Active ? '#f59e0b' : '#64748b'} />
            {bLs2 ? (
              <path d="M 400 100 L 412 108 L 400 120" fill="none" stroke={bX2 ? '#f59e0b' : '#64748b'} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" />
            ) : (
              <line x1="405" y1="91" x2="417" y2="86" stroke="#64748b" strokeWidth="3" strokeLinecap="round" />
            )}
            <text x="406" y="115" fontSize="9" fill="#38bdf8" fontWeight="bold">LS2</text>
            <line x1="400" y1="120" x2="400" y2="150" stroke={bT2Active ? '#f59e0b' : '#64748b'} strokeWidth="3" />
            <rect x="375" y="150" width="50" height="24" rx="5" fill={bT2Active ? '#f59e0b' : '#1e293b'} stroke={bT2Active ? '#fbbf24' : '#475569'} strokeWidth="2" />
            <text x="400" y="166" textAnchor="middle" fill={bT2Active ? '#0f172a' : '#94a3b8'} fontSize="10" fontWeight="bold">T2 코일</text>
            <line x1="400" y1="174" x2="400" y2="195" stroke={bT2Done ? '#f59e0b' : '#64748b'} strokeWidth="3" />
            <rect x="375" y="195" width="50" height="24" rx="5" fill={bMc2On ? '#f59e0b' : '#1e293b'} stroke={bMc2On ? '#fbbf24' : '#475569'} strokeWidth="2" />
            <text x="400" y="211" textAnchor="middle" fill={bMc2On ? '#0f172a' : '#94a3b8'} fontSize="10" fontWeight="bold">MC2</text>
            <line x1="400" y1="219" x2="400" y2="255" stroke={bMc2On ? '#22c55e' : '#64748b'} strokeWidth="3" />
            <text x="400" y="272" textAnchor="middle" fontSize="8" fill={bMc2On ? '#22c55e' : '#64748b'} fontWeight="bold">M2 역회전</text>

            {/* 표시등 패널 */}
            <line x1="490" y1="60" x2="530" y2="60" stroke={bWlOn ? '#e2e8f0' : '#64748b'} strokeWidth="2" />
            <circle cx="540" cy="60" r="10" fill={bWlOn ? '#e2e8f0' : '#1e293b'} stroke="#64748b" strokeWidth="1.5" />
            <text x="540" y="80" textAnchor="middle" fontSize="8" fill="#94a3b8">WL(구동중)</text>

            <line x1="490" y1="140" x2="530" y2="140" stroke={bRlOn ? '#ef4444' : '#64748b'} strokeWidth="2" />
            <circle cx="540" cy="140" r="10" fill={bRlOn ? '#ef4444' : '#1e293b'} stroke="#64748b" strokeWidth="1.5" />
            <text x="540" y="160" textAnchor="middle" fontSize="8" fill="#94a3b8">RL(대기)</text>

            <line x1="490" y1="220" x2="530" y2="220" stroke={bGlOn ? '#22c55e' : '#64748b'} strokeWidth="2" />
            <circle cx="540" cy="220" r="10" fill={bGlOn ? '#22c55e' : '#1e293b'} stroke="#64748b" strokeWidth="1.5" />
            <text x="540" y="240" textAnchor="middle" fontSize="8" fill="#94a3b8">GL(완료)</text>

            <line x1="20" y1="255" x2="460" y2="255" stroke={bMccbOn ? '#3b82f6' : '#64748b'} strokeWidth="3" />
          </svg>
        </div>
        <p className="text-[10px] text-slate-500 text-center">주황색 = 통전 구간 · 회색 = 단전 구간 · 파란색 = 공통 복귀(중성) 모선</p>
      </div>

      <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 space-y-5">
        <div className="flex items-center justify-between flex-wrap gap-3 border-b border-slate-700 pb-3">
          <div className="flex items-center space-x-2 text-amber-400 font-bold text-base">
            <Activity className="w-5 h-5" />
            <h2>동작 시뮬레이터</h2>
          </div>
          <button onClick={bReset} className="px-4 py-2 rounded-xl text-xs font-bold bg-slate-700 hover:bg-slate-600 text-slate-100 flex items-center space-x-2">
            <RotateCcw className="w-4 h-4" />
            <span>전체 초기화</span>
          </button>
        </div>

        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div className="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-2.5">
            <h3 className="text-xs font-bold text-slate-300">① 전원 & 보호</h3>
            <button
              onClick={() => setBMccbOn(!bMccbOn)}
              className={`w-full py-2 rounded-lg text-xs font-bold transition-all ${bMccbOn ? 'bg-amber-500 text-slate-950' : 'bg-slate-700 text-slate-300'}`}
            >
              MCCB: {bMccbOn ? 'ON' : 'OFF'}
            </button>
            <button
              onClick={() => setBEocrTripped(!bEocrTripped)}
              disabled={!bMccbOn}
              className={`w-full py-2 rounded-lg text-xs font-bold transition-all disabled:opacity-40 ${bEocrTripped ? 'bg-rose-500 text-slate-950' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'}`}
            >
              EOCR: {bEocrTripped ? '트립 (과전류)' : '정상'}
            </button>
            <button onClick={bPressPB0} className="w-full py-2 rounded-lg text-xs font-bold bg-rose-600 hover:bg-rose-500 text-white">
              PB0 (전체 정지)
            </button>
          </div>

          <div className="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-2.5">
            <h3 className="text-xs font-bold text-slate-300">② 기동 · 리밋스위치</h3>
            <div className="flex gap-2">
              <button
                onClick={bPressPB1}
                disabled={!bMainBusOn || bX2}
                className="flex-1 py-2 rounded-lg text-xs font-bold bg-sky-600 hover:bg-sky-500 text-white disabled:opacity-40"
              >
                PB1 (X1 기동)
              </button>
              <button
                onClick={bPressPB2}
                disabled={!bMainBusOn || bX1}
                className="flex-1 py-2 rounded-lg text-xs font-bold bg-emerald-600 hover:bg-emerald-500 text-white disabled:opacity-40"
              >
                PB2 (X2 기동)
              </button>
            </div>
            <div className="flex gap-2">
              <button
                onClick={() => setBLs1(!bLs1)}
                className={`flex-1 py-2 rounded-lg text-xs font-bold ${bLs1 ? 'bg-sky-500/80 text-slate-950' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'}`}
              >
                LS1: {bLs1 ? 'ON' : 'OFF'}
              </button>
              <button
                onClick={() => setBLs2(!bLs2)}
                className={`flex-1 py-2 rounded-lg text-xs font-bold ${bLs2 ? 'bg-emerald-500/80 text-slate-950' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'}`}
              >
                LS2: {bLs2 ? 'ON' : 'OFF'}
              </button>
            </div>
          </div>

          <div className="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-2.5">
            <h3 className="text-xs font-bold text-slate-300">③ T1 / T2 설정시간</h3>
            <div className="flex gap-1.5">
              {[1, 2, 3, 5].map((sec) => (
                <button key={sec} onClick={() => bChangeT1(sec)} className={`flex-1 py-1.5 rounded-lg text-[11px] font-bold border ${bT1Setting === sec ? 'bg-sky-500 text-slate-950 border-sky-300' : 'bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700'}`}>
                  T1:{sec}s
                </button>
              ))}
            </div>
            <div className="flex gap-1.5">
              {[1, 2, 3, 5].map((sec) => (
                <button key={sec} onClick={() => bChangeT2(sec)} className={`flex-1 py-1.5 rounded-lg text-[11px] font-bold border ${bT2Setting === sec ? 'bg-emerald-500 text-slate-950 border-emerald-300' : 'bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700'}`}>
                  T2:{sec}s
                </button>
              ))}
            </div>
            <div className="text-[11px] text-slate-400 bg-slate-950 rounded-lg px-2 py-1.5 border border-slate-800">
              T1: {bT1Active ? (bT1Done ? '완료' : `${bT1Setting - bT1Left}s/${bT1Setting}s`) : '대기'} · T2: {bT2Active ? (bT2Done ? '완료' : `${bT2Setting - bT2Left}s/${bT2Setting}s`) : '대기'}
            </div>
          </div>
        </div>

        <div className="grid grid-cols-3 sm:grid-cols-4 lg:grid-cols-7 gap-2 text-center">
          {[
            { label: 'EOCR', on: bEocrTripped, onColor: 'bg-rose-500/20 border-rose-500/50 text-rose-300' },
            { label: 'X1', on: bX1, onColor: 'bg-sky-500/20 border-sky-500/50 text-sky-300' },
            { label: 'X2', on: bX2, onColor: 'bg-emerald-500/20 border-emerald-500/50 text-emerald-300' },
            { label: 'T1', on: bT1Done, onColor: 'bg-sky-500/20 border-sky-500/50 text-sky-300' },
            { label: 'T2', on: bT2Done, onColor: 'bg-emerald-500/20 border-emerald-500/50 text-emerald-300' },
            { label: 'MC1(M1)', on: bMc1On, onColor: 'bg-amber-500/20 border-amber-500/50 text-amber-300' },
            { label: 'MC2(M2)', on: bMc2On, onColor: 'bg-amber-500/20 border-amber-500/50 text-amber-300' }
          ].map((item) => (
            <div key={item.label} className={`p-2 rounded-lg border text-[11px] font-bold transition-all ${item.on ? item.onColor : 'bg-slate-900 border-slate-800 text-slate-500'}`}>
              <div>{item.label}</div>
              <div className="mt-0.5">{item.on ? (item.label === 'EOCR' ? '트립' : 'ON') : 'OFF'}</div>
            </div>
          ))}
        </div>

        <div className="bg-slate-900 rounded-xl border border-slate-800 p-3 overflow-x-auto">
          <div className="text-xs font-bold text-sky-400 mb-2">정회전(1) 계열 흐름: PB1 → X1 자기유지(X2 인터록) → LS1 → T1 → MC1 → M1</div>
          <div className="flex items-center space-x-1.5 min-w-max text-[11px] font-bold">
            <span className={`px-2.5 py-1.5 rounded-lg border ${bX1 ? 'bg-sky-500/20 border-sky-500/50 text-sky-300' : 'bg-slate-800 border-slate-700 text-slate-500'}`}>X1 여자</span>
            <ArrowRight className="w-3.5 h-3.5 text-slate-600" />
            <span className={`px-2.5 py-1.5 rounded-lg border ${bLs1 ? 'bg-sky-500/20 border-sky-500/50 text-sky-300' : 'bg-slate-800 border-slate-700 text-slate-500'}`}>LS1 감지</span>
            <ArrowRight className="w-3.5 h-3.5 text-slate-600" />
            <span className={`px-2.5 py-1.5 rounded-lg border ${bT1Done ? 'bg-sky-500/20 border-sky-500/50 text-sky-300' : 'bg-slate-800 border-slate-700 text-slate-500'}`}>T1 한시동작</span>
            <ArrowRight className="w-3.5 h-3.5 text-slate-600" />
            <span className={`px-2.5 py-1.5 rounded-lg border ${bMc1On ? 'bg-amber-500/20 border-amber-500/50 text-amber-300' : 'bg-slate-800 border-slate-700 text-slate-500'}`}>MC1 → M1</span>
          </div>
        </div>
        <div className="bg-slate-900 rounded-xl border border-slate-800 p-3 overflow-x-auto">
          <div className="text-xs font-bold text-emerald-400 mb-2">역회전(2) 계열 흐름: PB2 → X2 자기유지(X1 인터록) → LS2 → T2 → MC2 → M2</div>
          <div className="flex items-center space-x-1.5 min-w-max text-[11px] font-bold">
            <span className={`px-2.5 py-1.5 rounded-lg border ${bX2 ? 'bg-emerald-500/20 border-emerald-500/50 text-emerald-300' : 'bg-slate-800 border-slate-700 text-slate-500'}`}>X2 여자</span>
            <ArrowRight className="w-3.5 h-3.5 text-slate-600" />
            <span className={`px-2.5 py-1.5 rounded-lg border ${bLs2 ? 'bg-emerald-500/20 border-emerald-500/50 text-emerald-300' : 'bg-slate-800 border-slate-700 text-slate-500'}`}>LS2 감지</span>
            <ArrowRight className="w-3.5 h-3.5 text-slate-600" />
            <span className={`px-2.5 py-1.5 rounded-lg border ${bT2Done ? 'bg-emerald-500/20 border-emerald-500/50 text-emerald-300' : 'bg-slate-800 border-slate-700 text-slate-500'}`}>T2 한시동작</span>
            <ArrowRight className="w-3.5 h-3.5 text-slate-600" />
            <span className={`px-2.5 py-1.5 rounded-lg border ${bMc2On ? 'bg-amber-500/20 border-amber-500/50 text-amber-300' : 'bg-slate-800 border-slate-700 text-slate-500'}`}>MC2 → M2</span>
          </div>
        </div>
        <p className="text-[10px] text-slate-500">※ X1/X2, MC1/MC2는 상호 인터록되어 동시 여자되지 않으며, PB0 또는 EOCR 트립 시 전체가 즉시 정지합니다.</p>
      </div>

      {modalImage && (
        <div onClick={() => setModalImage(null)} className="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4 cursor-pointer">
          <div className="relative max-w-5xl w-full bg-slate-900 border border-slate-700 rounded-2xl p-4 overflow-auto max-h-[90vh] shadow-2xl">
            <button onClick={() => setModalImage(null)} className="absolute top-3 right-3 p-2 rounded-full bg-slate-800 text-slate-300 hover:text-white hover:bg-slate-700 z-10">
              <X className="w-5 h-5" />
            </button>
            <img src={modalImage} alt="원본 도면 확대" className="w-full h-auto object-contain rounded-xl bg-slate-950 border border-slate-800" />
          </div>
        </div>
      )}
    </div>
  );
}

import { createRoot } from 'react-dom/client';
const bootEl = document.getElementById('boot');
if (bootEl) bootEl.remove();
createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
