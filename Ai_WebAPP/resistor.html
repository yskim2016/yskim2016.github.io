<script type="text/babel" data-type="module" data-presets="react,typescript">
import React, { useState, useMemo } from 'react';
import { 
  Calculator, 
  Palette, 
  RotateCcw, 
  Info, 
  Copy, 
  Check, 
  Zap, 
  Sparkles,
  ArrowRightLeft,
  ChevronRight,
  BookOpen
} from 'lucide-react';

// 색상 데이터 정의
const COLOR_MAP = {
  black: { id: 'black', name: '검정', nameEn: 'Black', hex: '#1C1917', textHex: '#FFFFFF', digit: 0, mult: 1, tol: null, bgClass: 'bg-stone-900', textClass: 'text-white' },
  brown: { id: 'brown', name: '갈색', nameEn: 'Brown', hex: '#78350F', textHex: '#FFFFFF', digit: 1, mult: 10, tol: 1, bgClass: 'bg-amber-900', textClass: 'text-white' },
  red: { id: 'red', name: '빨강', nameEn: 'Red', hex: '#DC2626', textHex: '#FFFFFF', digit: 2, mult: 100, tol: 2, bgClass: 'bg-red-600', textClass: 'text-white' },
  orange: { id: 'orange', name: '주황', nameEn: 'Orange', hex: '#EA580C', textHex: '#FFFFFF', digit: 3, mult: 1000, tol: null, bgClass: 'bg-orange-600', textClass: 'text-white' },
  yellow: { id: 'yellow', name: '노랑', nameEn: 'Yellow', hex: '#CA8A04', textHex: '#000000', digit: 4, mult: 10000, tol: null, bgClass: 'bg-yellow-500', textClass: 'text-stone-900' },
  green: { id: 'green', name: '초록', nameEn: 'Green', hex: '#16A34A', textHex: '#FFFFFF', digit: 5, mult: 100000, tol: 0.5, bgClass: 'bg-green-600', textClass: 'text-white' },
  blue: { id: 'blue', name: '파랑', nameEn: 'Blue', hex: '#2563EB', textHex: '#FFFFFF', digit: 6, mult: 1000000, tol: 0.25, bgClass: 'bg-blue-600', textClass: 'text-white' },
  violet: { id: 'violet', name: '보라', nameEn: 'Violet', hex: '#9333EA', textHex: '#FFFFFF', digit: 7, mult: 10000000, tol: 0.1, bgClass: 'bg-purple-600', textClass: 'text-white' },
  grey: { id: 'grey', name: '회색', nameEn: 'Grey', hex: '#4B5563', textHex: '#FFFFFF', digit: 8, mult: 100000000, tol: 0.05, bgClass: 'bg-gray-600', textClass: 'text-white' },
  white: { id: 'white', name: '흰색', nameEn: 'White', hex: '#F9FAFB', textHex: '#111827', digit: 9, mult: 1000000000, tol: null, bgClass: 'bg-slate-100 border border-slate-300', textClass: 'text-slate-900' },
  gold: { id: 'gold', name: '금색', nameEn: 'Gold', hex: '#D4AF37', textHex: '#FFFFFF', digit: null, mult: 0.1, tol: 5, bgClass: 'bg-yellow-600', textClass: 'text-white' },
  silver: { id: 'silver', name: '은색', nameEn: 'Silver', hex: '#9CA3AF', textHex: '#111827', digit: null, mult: 0.01, tol: 10, bgClass: 'bg-slate-400', textClass: 'text-slate-900' },
};

const DIGIT_COLORS = ['black', 'brown', 'red', 'orange', 'yellow', 'green', 'blue', 'violet', 'grey', 'white'];
const MULT_COLORS = ['black', 'brown', 'red', 'orange', 'yellow', 'green', 'blue', 'violet', 'grey', 'white', 'gold', 'silver'];
const TOL_COLORS = ['brown', 'red', 'green', 'blue', 'violet', 'grey', 'gold', 'silver'];

// 단위 수량 상수 (과학 표기법/접두사)
const UNITS = [
  { label: 'Ω (옴)', symbol: 'Ω', mult: 1 },
  { label: 'kΩ (킬로옴 - 10³)', symbol: 'kΩ', mult: 1e3 },
  { label: 'MΩ (메가옴 - 10⁶)', symbol: 'MΩ', mult: 1e6 },
  { label: 'GΩ (기가옴 - 10⁹)', symbol: 'GΩ', mult: 1e9 },
];

// 저항값 포맷터 함수
function formatOhms(ohms) {
  if (ohms === null || ohms === undefined || isNaN(ohms)) return '0 Ω';
  if (ohms >= 1e9) {
    return `${parseFloat((ohms / 1e9).toFixed(3))} GΩ`;
  }
  if (ohms >= 1e6) {
    return `${parseFloat((ohms / 1e6).toFixed(3))} MΩ`;
  }
  if (ohms >= 1e3) {
    return `${parseFloat((ohms / 1e3).toFixed(3))} kΩ`;
  }
  return `${parseFloat(ohms.toFixed(3))} Ω`;
}

// 승수를 지수 형태로 표시
function getExponentLabel(mult) {
  if (mult === 1) return '10⁰ (x1)';
  if (mult === 10) return '10¹ (x10)';
  if (mult === 100) return '10² (x100)';
  if (mult === 1000) return '10³ (x1k)';
  if (mult === 10000) return '10⁴ (x10k)';
  if (mult === 100000) return '10⁵ (x100k)';
  if (mult === 1000000) return '10⁶ (x1M)';
  if (mult === 10000000) return '10⁷ (x10M)';
  if (mult === 100000000) return '10⁸ (x100M)';
  if (mult === 1000000000) return '10⁹ (x1G)';
  if (mult === 0.1) return '10⁻¹ (x0.1)';
  if (mult === 0.01) return '10⁻² (x0.01)';
  return `x${mult}`;
}

// 색띠 선택용 하위 컴포넌트
function BandSelectorGroup({ label, description, allowedColors, selected, onSelect, isMultiplier = false, isTolerance = false }) {
  return (
    <div className="space-y-2">
      <div className="flex items-center justify-between">
        <div>
          <span className="text-xs font-semibold text-slate-200 block">{label}</span>
          <span className="text-[11px] text-slate-400">{description}</span>
        </div>
        {selected && COLOR_MAP[selected] && (
          <span className="text-xs font-mono font-bold px-2 py-0.5 rounded bg-slate-900 border border-slate-700 text-cyan-400">
            {isMultiplier 
              ? getExponentLabel(COLOR_MAP[selected].mult)
              : isTolerance
                ? `±${COLOR_MAP[selected].tol}%`
                : `${COLOR_MAP[selected].digit} (${COLOR_MAP[selected].name})`}
          </span>
        )}
      </div>

      <div className="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-2">
        {allowedColors.map((colorKey) => {
          const colorObj = COLOR_MAP[colorKey];
          if (!colorObj) return null;
          const isSelected = selected === colorKey;

          let displayVal = '';
          if (isMultiplier) {
            displayVal = getExponentLabel(colorObj.mult);
          } else if (isTolerance) {
            displayVal = `±${colorObj.tol}%`;
          } else {
            displayVal = colorObj.digit !== null ? `${colorObj.digit}` : '';
          }

          return (
            <button
              key={colorKey}
              onClick={() => onSelect(colorKey)}
              className={`flex items-center gap-2 p-2 rounded-xl border text-xs transition-all ${
                isSelected
                  ? 'bg-slate-700 border-cyan-400 ring-2 ring-cyan-500/50 text-white shadow-md'
                  : 'bg-slate-900/80 border-slate-700/80 text-slate-300 hover:border-slate-500 hover:bg-slate-800'
              }`}
            >
              <span 
                className={`w-3.5 h-3.5 rounded-full shrink-0 ${colorObj.bgClass} border border-white/20`} 
              />
              <div className="text-left overflow-hidden">
                <div className="font-medium truncate text-[11px]">{colorObj.name}</div>
                <div className="text-[10px] text-slate-400 font-mono truncate">{displayVal}</div>
              </div>
            </button>
          );
        })}
      </div>
    </div>
  );
}

export default function App() {
  const [activeTab, setActiveTab] = useState('colorToVal'); // 'colorToVal' | 'valToColor' | 'cheatsheet'
  const [bandCount, setBandCount] = useState(4); // 4 or 5
  
  // Tab 1: 색띠 -> 저항 값 State
  const [selectedBands, setSelectedBands] = useState({
    b1: 'yellow',  // 4
    b2: 'violet',  // 7
    b3: 'black',   // 0 (5색띠용)
    mult: 'red',   // x100
    tol: 'gold'    // ±5%
  });

  // Tab 2: 저항 값 -> 색띠 State
  const [inputValue, setInputValue] = useState('4.7');
  const [selectedUnit, setSelectedUnit] = useState(1e3); // kΩ
  const [selectedTol, setSelectedTol] = useState(5); // 5%
  const [copied, setCopied] = useState(false);

  // 1. [색띠 -> 저항 값] 계산
  const calculatedFromBands = useMemo(() => {
    const d1 = COLOR_MAP[selectedBands.b1]?.digit ?? 0;
    const d2 = COLOR_MAP[selectedBands.b2]?.digit ?? 0;
    const d3 = COLOR_MAP[selectedBands.b3]?.digit ?? 0;
    const mult = COLOR_MAP[selectedBands.mult]?.mult ?? 1;
    const tol = COLOR_MAP[selectedBands.tol]?.tol ?? 5;

    let baseDigits = 0;
    if (bandCount === 4) {
      baseDigits = d1 * 10 + d2;
    } else {
      baseDigits = d1 * 100 + d2 * 10 + d3;
    }

    const ohms = baseDigits * mult;
    const minOhms = ohms * (1 - tol / 100);
    const maxOhms = ohms * (1 + tol / 100);

    return {
      ohms,
      formatted: formatOhms(ohms),
      tol,
      minOhms,
      maxOhms,
      formattedMin: formatOhms(minOhms),
      formattedMax: formatOhms(maxOhms),
      baseDigits
    };
  }, [selectedBands, bandCount]);

  // 2. [저항 값 -> 색띠] 계산
  const calculatedFromValue = useMemo(() => {
    const num = parseFloat(inputValue);
    if (isNaN(num) || num <= 0) {
      return { error: '유효한 양의 저항 값을 입력해주세요.' };
    }

    const totalOhms = num * selectedUnit;
    const is5Band = bandCount === 5;
    const targetDigitsCount = is5Band ? 3 : 2;

    // 지수 표기 분해
    let exp = Math.floor(Math.log10(totalOhms));
    let mantissa = totalOhms / Math.pow(10, exp);
    let shift = targetDigitsCount - 1;
    let digitVal = Math.round(mantissa * Math.pow(10, shift));
    let multExp = exp - shift;

    // 반올림 자릿수 보정 (예: 9.999 -> 100)
    if (digitVal >= Math.pow(10, targetDigitsCount)) {
      digitVal = Math.floor(digitVal / 10);
      multExp += 1;
    }

    const digitsStr = digitVal.toString().padStart(targetDigitsCount, '0');
    const digitsArr = digitsStr.split('').map(Number);

    if (multExp < -2 || multExp > 9) {
      return { error: '색띠로 표현 가능한 저항 범위를 벗어났습니다 (0.01 Ω ~ 999 GΩ).' };
    }

    // 색상 고르기
    const findColorByDigit = (d) => DIGIT_COLORS.find(c => COLOR_MAP[c].digit === d);
    const findColorByMult = (m) => MULT_COLORS.find(c => Math.abs(COLOR_MAP[c].mult - Math.pow(10, m)) < 0.0001 || (m === -1 && COLOR_MAP[c].mult === 0.1) || (m === -2 && COLOR_MAP[c].mult === 0.01));
    const findColorByTol = (t) => TOL_COLORS.find(c => COLOR_MAP[c].tol === t) || 'gold';

    const b1Color = findColorByDigit(digitsArr[0]) || 'brown';
    const b2Color = findColorByDigit(digitsArr[1]) || 'black';
    const b3Color = is5Band ? (findColorByDigit(digitsArr[2]) || 'black') : null;
    const multColor = findColorByMult(multExp) || 'black';
    const tolColor = findColorByTol(selectedTol);

    return {
      ohms: totalOhms,
      formatted: formatOhms(totalOhms),
      bands: {
        b1: b1Color,
        b2: b2Color,
        ...(is5Band ? { b3: b3Color } : {}),
        mult: multColor,
        tol: tolColor
      },
      digitsArr,
      multExp
    };
  }, [inputValue, selectedUnit, selectedTol, bandCount]);

  // 클립보드 복사 함수 (iframe 권한 차단 환경 대응)
  const copyToClipboard = (text) => {
    try {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.left = '-9999px';
      textarea.style.top = '-9999px';
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();
      
      const successful = document.execCommand('copy');
      document.body.removeChild(textarea);

      if (successful) {
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      }
    } catch (err) {
      console.error('클립보드 복사 실패:', err);
    }
  };

  // 현재 활성화된 밴드 데이터 가져오기
  const currentBands = activeTab === 'colorToVal' 
    ? (bandCount === 4 
        ? [selectedBands.b1, selectedBands.b2, selectedBands.mult, selectedBands.tol]
        : [selectedBands.b1, selectedBands.b2, selectedBands.b3, selectedBands.mult, selectedBands.tol])
    : (calculatedFromValue.bands 
        ? (bandCount === 4
            ? [calculatedFromValue.bands.b1, calculatedFromValue.bands.b2, calculatedFromValue.bands.mult, calculatedFromValue.bands.tol]
            : [calculatedFromValue.bands.b1, calculatedFromValue.bands.b2, calculatedFromValue.bands.b3, calculatedFromValue.bands.mult, calculatedFromValue.bands.tol])
        : ['grey', 'grey', 'grey', 'gold']);

  return (
    <div className="min-h-screen bg-slate-900 text-slate-100 flex flex-col font-sans selection:bg-cyan-500 selection:text-white">
      {/* Header */}
      <header className="border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-50">
        <div className="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
          <div className="flex items-center gap-3">
            <div className="p-2.5 bg-gradient-to-tr from-cyan-500 to-blue-600 rounded-xl shadow-lg shadow-cyan-500/20 text-white">
              <Zap className="w-6 h-6" />
            </div>
            <div>
              <h1 className="font-bold text-lg md:text-xl text-white flex items-center gap-2">
                저항 색띠 계산기 & 시각화
                <span className="text-xs font-normal px-2 py-0.5 rounded-full bg-cyan-950 text-cyan-400 border border-cyan-800">
                  4색띠 / 5색띠
                </span>
              </h1>
              <p className="text-xs text-slate-400">색상 코드로 저항값을 구하거나 저항값으로 색띠를 확인하세요</p>
            </div>
          </div>

          {/* Tab Selector */}
          <div className="flex items-center p-1 bg-slate-800/80 rounded-xl border border-slate-700/60">
            <button
              onClick={() => setActiveTab('colorToVal')}
              className={`flex items-center gap-2 px-3.5 py-1.5 rounded-lg text-xs md:text-sm font-medium transition-all ${
                activeTab === 'colorToVal'
                  ? 'bg-cyan-500 text-white shadow-md shadow-cyan-500/20'
                  : 'text-slate-400 hover:text-white hover:bg-slate-700/50'
              }`}
            >
              <Palette className="w-4 h-4" />
              색띠 → 저항 값
            </button>
            <button
              onClick={() => setActiveTab('valToColor')}
              className={`flex items-center gap-2 px-3.5 py-1.5 rounded-lg text-xs md:text-sm font-medium transition-all ${
                activeTab === 'valToColor'
                  ? 'bg-cyan-500 text-white shadow-md shadow-cyan-500/20'
                  : 'text-slate-400 hover:text-white hover:bg-slate-700/50'
              }`}
            >
              <Calculator className="w-4 h-4" />
              저항 값 → 색띠
            </button>
            <button
              onClick={() => setActiveTab('cheatsheet')}
              className={`flex items-center gap-2 px-3.5 py-1.5 rounded-lg text-xs md:text-sm font-medium transition-all ${
                activeTab === 'cheatsheet'
                  ? 'bg-cyan-500 text-white shadow-md shadow-cyan-500/20'
                  : 'text-slate-400 hover:text-white hover:bg-slate-700/50'
              }`}
            >
              <BookOpen className="w-4 h-4" />
              색상표 가이드
            </button>
          </div>
        </div>
      </header>

      {/* Main Content */}
      <main className="flex-1 max-w-6xl w-full mx-auto p-4 md:p-6 space-y-6">
        
        {/* 공통 Top Bar: 4색띠 / 5색띠 토글 & 프리셋 선택 */}
        <div className="bg-slate-800/40 border border-slate-800 rounded-2xl p-4 flex flex-wrap items-center justify-between gap-4">
          <div className="flex items-center gap-3">
            <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">색띠 모드:</span>
            <div className="inline-flex p-1 bg-slate-900 rounded-lg border border-slate-700">
              <button
                onClick={() => setBandCount(4)}
                className={`px-3 py-1 rounded-md text-xs font-bold transition-all ${
                  bandCount === 4 
                    ? 'bg-cyan-500 text-white shadow' 
                    : 'text-slate-400 hover:text-slate-200'
                }`}
              >
                4색띠 (표준)
              </button>
              <button
                onClick={() => setBandCount(5)}
                className={`px-3 py-1 rounded-md text-xs font-bold transition-all ${
                  bandCount === 5 
                    ? 'bg-cyan-500 text-white shadow' 
                    : 'text-slate-400 hover:text-slate-200'
                }`}
              >
                5색띠 (고정밀)
              </button>
            </div>
          </div>

          {/* Quick Preset Buttons */}
          <div className="flex items-center gap-2 flex-wrap">
            <span className="text-xs text-slate-400">자주 쓰는 저항:</span>
            {[
              { label: '220 Ω', val: '220', unit: 1 },
              { label: '1 kΩ', val: '1', unit: 1e3 },
              { label: '4.7 kΩ', val: '4.7', unit: 1e3 },
              { label: '10 kΩ', val: '10', unit: 1e3 },
              { label: '100 kΩ', val: '100', unit: 1e3 },
              { label: '1 MΩ', val: '1', unit: 1e6 },
            ].map((preset, idx) => (
              <button
                key={idx}
                onClick={() => {
                  if (activeTab === 'valToColor') {
                    setInputValue(preset.val);
                    setSelectedUnit(preset.unit);
                  } else {
                    setActiveTab('valToColor');
                    setInputValue(preset.val);
                    setSelectedUnit(preset.unit);
                  }
                }}
                className="px-2.5 py-1 text-xs rounded-lg bg-slate-800 hover:bg-slate-700 text-cyan-300 border border-slate-700 transition"
              >
                {preset.label}
              </button>
            ))}
          </div>
        </div>

        {/* Resistor Graphic Visualizer (공통 시각화 영역) */}
        <div className="bg-slate-950 border border-slate-800 rounded-2xl p-6 shadow-2xl relative overflow-hidden flex flex-col items-center justify-center min-h-[220px]">
          {/* Background decorative grid */}
          <div className="absolute inset-0 bg-[linear-gradient(to_right,#1e293b15_1px,transparent_1px),linear-gradient(to_bottom,#1e293b15_1px,transparent_1px)] bg-[size:24px_24px]" />
          
          <div className="relative z-10 w-full max-w-2xl flex flex-col items-center">
            {/* Display value badge above graphic */}
            <div className="mb-4 flex items-center gap-3">
              <span className="text-2xl md:text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-teal-300 to-emerald-400 tracking-tight">
                {activeTab === 'colorToVal' 
                  ? calculatedFromBands.formatted 
                  : (calculatedFromValue.error ? '---' : calculatedFromValue.formatted)}
              </span>
              <span className="text-xs md:text-sm font-semibold px-2.5 py-1 rounded-full bg-slate-800 text-cyan-300 border border-slate-700">
                ±{activeTab === 'colorToVal' ? calculatedFromBands.tol : selectedTol}% 오차
              </span>
              <button
                onClick={() => copyToClipboard(activeTab === 'colorToVal' ? calculatedFromBands.formatted : calculatedFromValue.formatted)}
                className="p-1.5 text-slate-400 hover:text-white bg-slate-800 rounded-lg border border-slate-700 transition"
                title="복사하기"
              >
                {copied ? <Check className="w-4 h-4 text-green-400" /> : <Copy className="w-4 h-4" />}
              </button>
            </div>

            {/* SVG Resistor Representation */}
            <div className="w-full h-32 flex items-center justify-center">
              <svg viewBox="0 0 500 120" className="w-full max-w-lg h-full drop-shadow-2xl">
                <defs>
                  {/* Lead Metallic Gradient */}
                  <linearGradient id="leadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stopColor="#94a3b8" />
                    <stop offset="50%" stopColor="#f8fafc" />
                    <stop offset="100%" stopColor="#64748b" />
                  </linearGradient>

                  {/* Resistor Ceramic Body Gradient */}
                  <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stopColor="#e2e8f0" />
                    <stop offset="15%" stopColor="#cbd5e1" />
                    <stop offset="50%" stopColor="#e2e8f0" />
                    <stop offset="85%" stopColor="#94a3b8" />
                    <stop offset="100%" stopColor="#64748b" />
                  </linearGradient>

                  {/* Band Shadow Effect */}
                  <filter id="bandShadow" x="-10%" y="-10%" width="120%" height="120%">
                    <feDropShadow dx="1" dy="1" stdDeviation="1" floodOpacity="0.3" />
                  </filter>
                </defs>

                {/* Left Wire Lead */}
                <rect x="10" y="55" width="100" height="10" rx="3" fill="url(#leadGrad)" />

                {/* Right Wire Lead */}
                <rect x="390" y="55" width="100" height="10" rx="3" fill="url(#leadGrad)" />

                {/* Resistor Main Body Background */}
                <path
                  d="M 110,60 
                     C 110,25 130,20 160,20 
                     L 340,20 
                     C 370,20 390,25 390,60 
                     C 390,95 370,100 340,100 
                     L 160,100 
                     C 130,100 110,95 110,60 Z"
                  fill="url(#bodyGrad)"
                  stroke="#475569"
                  strokeWidth="2"
                />

                {/* End caps */}
                <rect x="105" y="28" width="20" height="64" rx="8" fill="url(#bodyGrad)" stroke="#475569" strokeWidth="1.5" />
                <rect x="375" y="28" width="20" height="64" rx="8" fill="url(#bodyGrad)" stroke="#475569" strokeWidth="1.5" />

                {/* Color Bands Rendering */}
                {currentBands.map((colorKey, idx) => {
                  const colorObj = COLOR_MAP[colorKey] || COLOR_MAP.grey;
                  
                  let posX = 0;
                  if (bandCount === 4) {
                    const positions = [155, 205, 255, 330];
                    posX = positions[idx];
                  } else {
                    const positions = [145, 185, 225, 265, 330];
                    posX = positions[idx];
                  }

                  const isTolerance = idx === currentBands.length - 1;
                  const bandWidth = isTolerance ? 14 : 12;

                  return (
                    <g key={idx}>
                      <rect
                        x={posX}
                        y="20"
                        width={bandWidth}
                        height="80"
                        fill={colorObj.hex}
                        filter="url(#bandShadow)"
                        className="transition-all duration-300"
                      />
                      <rect
                        x={posX + 2}
                        y="20"
                        width={3}
                        height="80"
                        fill="#ffffff"
                        opacity="0.25"
                      />
                    </g>
                  );
                })}
              </svg>
            </div>

            {/* Sub Labels under visualizer */}
            <div className="flex items-center gap-6 mt-2 text-xs text-slate-400">
              <span className="flex items-center gap-1.5">
                <span className="w-2 h-2 rounded-full bg-cyan-400 inline-block" />
                좌측부터 1번 색띠 시작
              </span>
              <span className="flex items-center gap-1.5">
                <span className="w-2 h-2 rounded-full bg-amber-400 inline-block" />
                우측 간격이 떨어진 수치가 오차(Tolerance)
              </span>
            </div>
          </div>
        </div>

        {/* MODE 1: 색띠 선택 -> 저항 값 계산 */}
        {activeTab === 'colorToVal' && (
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            {/* 색상 선택 컨트롤 (2/3 영역) */}
            <div className="lg:col-span-2 bg-slate-800/60 border border-slate-700/80 rounded-2xl p-5 md:p-6 space-y-6">
              <div className="flex items-center justify-between border-b border-slate-700/60 pb-3">
                <h2 className="font-bold text-base text-white flex items-center gap-2">
                  <Palette className="w-5 h-5 text-cyan-400" />
                  각 위치별 색띠 선택
                </h2>
                <span className="text-xs text-slate-400">각 색상 버튼을 클릭하여 변경하세요</span>
              </div>

              {/* Band 1 Selector */}
              <BandSelectorGroup
                label="첫 번째 색띠 (1st Digit)"
                description="첫 번째 유효 숫자"
                allowedColors={DIGIT_COLORS.filter(c => c !== 'black')}
                selected={selectedBands.b1}
                onSelect={(c) => setSelectedBands(prev => ({ ...prev, b1: c }))}
              />

              {/* Band 2 Selector */}
              <BandSelectorGroup
                label="두 번째 색띠 (2nd Digit)"
                description="두 번째 유효 숫자"
                allowedColors={DIGIT_COLORS}
                selected={selectedBands.b2}
                onSelect={(c) => setSelectedBands(prev => ({ ...prev, b2: c }))}
              />

              {/* Band 3 Selector (5색띠 모드일 때만 표시) */}
              {bandCount === 5 && (
                <BandSelectorGroup
                  label="세 번째 색띠 (3rd Digit)"
                  description="세 번째 유효 숫자"
                  allowedColors={DIGIT_COLORS}
                  selected={selectedBands.b3}
                  onSelect={(c) => setSelectedBands(prev => ({ ...prev, b3: c }))}
                />
              )}

              {/* Multiplier Band Selector */}
              <BandSelectorGroup
                label={bandCount === 4 ? "세 번째 색띠 (Multiplier - 승수)" : "네 번째 색띠 (Multiplier - 승수)"}
                description="10의 거듭제곱 곱함수"
                allowedColors={MULT_COLORS}
                selected={selectedBands.mult}
                onSelect={(c) => setSelectedBands(prev => ({ ...prev, mult: c }))}
                isMultiplier
              />

              {/* Tolerance Band Selector */}
              <BandSelectorGroup
                label={bandCount === 4 ? "네 번째 색띠 (Tolerance - 오차)" : "다섯 번째 색띠 (Tolerance - 오차)"}
                description="저항 허용 오차 범위 (%)"
                allowedColors={TOL_COLORS}
                selected={selectedBands.tol}
                onSelect={(c) => setSelectedBands(prev => ({ ...prev, tol: c }))}
                isTolerance
              />
            </div>

            {/* 계산 결과 상세 패널 (1/3 영역) */}
            <div className="bg-slate-800/60 border border-slate-700/80 rounded-2xl p-5 md:p-6 flex flex-col justify-between space-y-6">
              <div>
                <h3 className="font-bold text-base text-white border-b border-slate-700/60 pb-3 flex items-center gap-2">
                  <Calculator className="w-5 h-5 text-emerald-400" />
                  계산된 저항 상세 정보
                </h3>

                <div className="mt-5 space-y-4">
                  {/* 대표 가치 */}
                  <div className="bg-slate-900/80 p-4 rounded-xl border border-slate-700">
                    <span className="text-xs text-slate-400 block mb-1">기준 저항값</span>
                    <div className="text-2xl font-black text-cyan-400">
                      {calculatedFromBands.formatted}
                    </div>
                    <span className="text-xs text-slate-500 mt-1 block">
                      ({calculatedFromBands.ohms.toLocaleString()} Ω)
                    </span>
                  </div>

                  {/* 수식 상세 */}
                  <div className="p-3.5 bg-slate-900/40 rounded-xl border border-slate-700/50 space-y-2 text-xs">
                    <div className="flex justify-between text-slate-300">
                      <span>유효 숫자 (Digits):</span>
                      <span className="font-bold text-white">{calculatedFromBands.baseDigits}</span>
                    </div>
                    <div className="flex justify-between text-slate-300">
                      <span>승수 (Multiplier):</span>
                      <span className="font-bold text-white">
                        {getExponentLabel(COLOR_MAP[selectedBands.mult].mult)}
                      </span>
                    </div>
                    <div className="flex justify-between text-slate-300">
                      <span>허용 오차 (Tolerance):</span>
                      <span className="font-bold text-amber-400">±{calculatedFromBands.tol}%</span>
                    </div>
                  </div>

                  {/* 오차범위 (Min ~ Max) */}
                  <div className="p-3.5 bg-slate-900/40 rounded-xl border border-slate-700/50 space-y-2 text-xs">
                    <span className="font-semibold text-slate-300 block">실제 측정 저항 범위</span>
                    <div className="flex items-center justify-between pt-1">
                      <div>
                        <span className="text-[10px] text-slate-500 block">최소 값 (-{calculatedFromBands.tol}%)</span>
                        <span className="font-bold text-emerald-400">{calculatedFromBands.formattedMin}</span>
                      </div>
                      <ChevronRight className="w-4 h-4 text-slate-600" />
                      <div className="text-right">
                        <span className="text-[10px] text-slate-500 block">최대 값 (+{calculatedFromBands.tol}%)</span>
                        <span className="font-bold text-rose-400">{calculatedFromBands.formattedMax}</span>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              {/* 안내 문구 */}
              <div className="p-3 bg-cyan-950/40 border border-cyan-800/40 rounded-xl text-xs text-cyan-300/80 flex items-start gap-2">
                <Info className="w-4 h-4 text-cyan-400 shrink-0 mt-0.5" />
                <span>4색띠 저항은 2자리 유효숫자, 5색띠 정밀 저항은 3자리 유효숫자로 계산됩니다.</span>
              </div>
            </div>

          </div>
        )}

        {/* MODE 2: 저항 값 입력 -> 색띠 시각화 */}
        {activeTab === 'valToColor' && (
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            {/* 값 입력 컨트롤 (2/3 영역) */}
            <div className="lg:col-span-2 bg-slate-800/60 border border-slate-700/80 rounded-2xl p-5 md:p-6 space-y-6">
              <div className="border-b border-slate-700/60 pb-3">
                <h2 className="font-bold text-base text-white flex items-center gap-2">
                  <ArrowRightLeft className="w-5 h-5 text-cyan-400" />
                  저항 수치 및 오차 입력
                </h2>
                <p className="text-xs text-slate-400 mt-0.5">
                  원하는 저항 값과 단위 상수를 입력하면 표준 색띠 조합이 자동 생성됩니다.
                </p>
              </div>

              {/* 입력 폼 */}
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                {/* 저항 수치 입력 */}
                <div className="space-y-1.5">
                  <label className="text-xs font-semibold text-slate-300">저항 크기 숫자 입력</label>
                  <input
                    type="number"
                    step="any"
                    min="0.01"
                    value={inputValue}
                    onChange={(e) => setInputValue(e.target.value)}
                    placeholder="예: 4.7"
                    className="w-full bg-slate-900 border border-slate-700 focus:border-cyan-500 rounded-xl px-4 py-2.5 text-white font-mono text-base focus:outline-none transition"
                  />
                </div>

                {/* 단위 선택 (과학 상수) */}
                <div className="space-y-1.5">
                  <label className="text-xs font-semibold text-slate-300">단위 선택 (상수 접두사)</label>
                  <select
                    value={selectedUnit}
                    onChange={(e) => setSelectedUnit(Number(e.target.value))}
                    className="w-full bg-slate-900 border border-slate-700 focus:border-cyan-500 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none transition"
                  >
                    {UNITS.map((u, i) => (
                      <option key={i} value={u.mult}>
                        {u.label}
                      </option>
                    ))}
                  </select>
                </div>
              </div>

              {/* 오차(Tolerance) 선택 */}
              <div className="space-y-2">
                <label className="text-xs font-semibold text-slate-300">오차 범위 선택 (Tolerance)</label>
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                  {TOL_COLORS.map((colKey) => {
                    const c = COLOR_MAP[colKey];
                    const isSelected = selectedTol === c.tol;
                    return (
                      <button
                        key={colKey}
                        onClick={() => setSelectedTol(c.tol)}
                        className={`flex items-center gap-2 p-2.5 rounded-xl border text-xs transition ${
                          isSelected
                            ? 'bg-cyan-950/80 border-cyan-500 text-white shadow-md'
                            : 'bg-slate-900/60 border-slate-700/60 text-slate-400 hover:border-slate-600'
                        }`}
                      >
                        <span className={`w-3.5 h-3.5 rounded-full ${c.bgClass}`} />
                        <div className="text-left">
                          <div className="font-medium text-white">{c.name}</div>
                          <div className="text-[10px] text-slate-400">±{c.tol}%</div>
                        </div>
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* 변환 가이드 참고 예시 */}
              <div className="p-4 bg-slate-900/60 border border-slate-700/60 rounded-xl space-y-2">
                <span className="text-xs font-semibold text-slate-300 flex items-center gap-1.5">
                  <Sparkles className="w-4 h-4 text-amber-400" />
                  단위 변환 도움말
                </span>
                <p className="text-xs text-slate-400 leading-relaxed">
                  · <b className="text-slate-200">4.7 kΩ</b> = 4,700 Ω (노랑-보라-빨강)<br />
                  · <b className="text-slate-200">10 MΩ</b> = 10,000,000 Ω (갈색-검정-파랑)<br />
                  · <b className="text-slate-200">0.5 Ω</b> = 0.5 Ω 입력 후 Gold 승수 자동 계산
                </p>
              </div>

            </div>

            {/* 변환 결과 색띠 분석 패널 (1/3 영역) */}
            <div className="bg-slate-800/60 border border-slate-700/80 rounded-2xl p-5 md:p-6 space-y-5 flex flex-col justify-between">
              <div>
                <h3 className="font-bold text-base text-white border-b border-slate-700/60 pb-3 flex items-center gap-2">
                  <Palette className="w-5 h-5 text-cyan-400" />
                  자동 매칭된 색띠 구성
                </h3>

                {calculatedFromValue.error ? (
                  <div className="p-4 bg-rose-950/50 border border-rose-800/50 rounded-xl text-xs text-rose-300 mt-4">
                    {calculatedFromValue.error}
                  </div>
                ) : (
                  <div className="mt-4 space-y-3">
                    {/* 색띠 매칭 리스트 */}
                    {Object.entries(calculatedFromValue.bands).map(([bandKey, colorKey], idx) => {
                      const c = COLOR_MAP[colorKey];
                      let bandTitle = '';
                      let desc = '';

                      if (bandKey === 'b1') { bandTitle = '1번 색띠 (1st Digit)'; desc = `숫자: ${c.digit}`; }
                      else if (bandKey === 'b2') { bandTitle = '2번 색띠 (2nd Digit)'; desc = `숫자: ${c.digit}`; }
                      else if (bandKey === 'b3') { bandTitle = '3번 색띠 (3rd Digit)'; desc = `숫자: ${c.digit}`; }
                      else if (bandKey === 'mult') { bandTitle = '승수 색띠 (Multiplier)'; desc = getExponentLabel(c.mult); }
                      else if (bandKey === 'tol') { bandTitle = '오차 색띠 (Tolerance)'; desc = `±${c.tol}%`; }

                      return (
                        <div key={idx} className="flex items-center justify-between p-3 bg-slate-900/80 rounded-xl border border-slate-700/60">
                          <div className="flex items-center gap-3">
                            <span className={`w-5 h-5 rounded-full ${c.bgClass} shadow-inner border border-white/20`} />
                            <div>
                              <div className="text-xs font-semibold text-white">{c.name} ({c.nameEn})</div>
                              <div className="text-[10px] text-slate-400">{bandTitle}</div>
                            </div>
                          </div>
                          <span className="text-xs font-mono font-bold text-cyan-400 bg-slate-800 px-2 py-0.5 rounded border border-slate-700">
                            {desc}
                          </span>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>

              <div className="p-3 bg-slate-900/60 border border-slate-700/60 rounded-xl text-xs text-slate-400">
                입력하신 저항값에 맞게 자동으로 가장 가까운 유효숫자 표준 색띠 조합이 도출되었습니다.
              </div>
            </div>

          </div>
        )}

        {/* MODE 3: 색상표 종합 참조 가이드 (Cheatsheet) */}
        {activeTab === 'cheatsheet' && (
          <div className="bg-slate-800/60 border border-slate-700/80 rounded-2xl p-5 md:p-6 space-y-6">
            <div className="border-b border-slate-700/60 pb-3">
              <h2 className="font-bold text-lg text-white flex items-center gap-2">
                <BookOpen className="w-5 h-5 text-cyan-400" />
                표준 저항 색띠 코드 전체 참조표 (Color Code Reference Table)
              </h2>
              <p className="text-xs text-slate-400 mt-1">
                각 색상별 숫자, 승수(Multiplier), 허용 오차(Tolerance) 매핑 표준 데이터입니다.
              </p>
            </div>

            {/* Table */}
            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs border-collapse">
                <thead>
                  <tr className="border-b border-slate-700 text-slate-400 uppercase tracking-wider bg-slate-900/60">
                    <th className="p-3">색상 (Color)</th>
                    <th className="p-3">숫자 (Digit)</th>
                    <th className="p-3">승수 (Multiplier)</th>
                    <th className="p-3">오차 (Tolerance)</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-700/50 text-slate-200">
                  {Object.values(COLOR_MAP).map((c, i) => (
                    <tr key={i} className="hover:bg-slate-700/30 transition">
                      <td className="p-3 font-medium flex items-center gap-2.5">
                        <span className={`w-4 h-4 rounded-full ${c.bgClass} inline-block border border-white/20`} />
                        {c.name} ({c.nameEn})
                      </td>
                      <td className="p-3 font-mono font-bold text-cyan-300">
                        {c.digit !== null ? c.digit : '-'}
                      </td>
                      <td className="p-3 font-mono">
                        {getExponentLabel(c.mult)}
                      </td>
                      <td className="p-3 font-mono text-amber-400 font-bold">
                        {c.tol !== null ? `±${c.tol}%` : '-'}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        )}

      </main>

      {/* Footer */}
      <footer className="border-t border-slate-800 bg-slate-950 py-4 mt-8 text-center text-xs text-slate-500">
        <p>저항 색띠 계산기 & 시각화 도구 · IEC 60062 표준 색상 코드 준수</p>
      </footer>
    </div>
  );
}

import { createRoot } from 'react-dom/client';
const bootEl = document.getElementById('boot');
if (bootEl) bootEl.remove();
createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
