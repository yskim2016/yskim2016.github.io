  // 과목별 이론 탭 상태
  const [selectedTheorySubject, setSelectedTheorySubject] = useState(0);
  const [theorySearchTerm, setTheorySearchTerm] = useState('');

  // 모의고사 탭 상태
  const [examMode, setExamMode] = useState('full'); // 'full', 'sub1'..'sub4'
  const [examStatus, setExamStatus] = useState('idle'); // 'idle', 'running', 'submitted'
  const [currentQIndex, setCurrentQIndex] = useState(0);
  const [userAnswers, setUserAnswers] = useState({});
  const [timeLeft, setTimeLeft] = useState(3600);
  const [filterExplanation, setFilterExplanation] = useState('all');

  const activeQuestions = useMemo(() => {
    if (examMode === 'full') return examQuestionsData;
    if (examMode === 'sub1') return examQuestionsData.filter(q => q.subject === 1);
    if (examMode === 'sub2') return examQuestionsData.filter(q => q.subject === 2);
    if (examMode === 'sub3') return examQuestionsData.filter(q => q.subject === 3);
    if (examMode === 'sub4') return examQuestionsData.filter(q => q.subject === 4);
    return examQuestionsData;
  }, [examMode]);

  useEffect(() => {
    let timer = null;
    if (examStatus === 'running' && timeLeft > 0) {
      timer = setInterval(() => {
        setTimeLeft(prev => {
          if (prev <= 1) {
            clearInterval(timer);
            submitExam();
            return 0;
          }
          return prev - 1;
        });
      }, 1000);
    }
    return () => clearInterval(timer);
  }, [examStatus, timeLeft]);

  useEffect(() => {
    if (!isElevatorModalOpen) return;
    const previousOverflow = document.body.style.overflow;
    const handleKeyDown = (event) => {
      if (event.key === 'Escape') setIsElevatorModalOpen(false);
    };
    document.body.style.overflow = 'hidden';
    window.addEventListener('keydown', handleKeyDown);
    return () => {
      document.body.style.overflow = previousOverflow;
      window.removeEventListener('keydown', handleKeyDown);
    };
  }, [isElevatorModalOpen]);

  const startExam = (mode) => {
    setExamMode(mode);
    setUserAnswers({});
    setCurrentQIndex(0);
    setTimeLeft(mode === 'full' ? 3600 : 900); // 전체 60분, 과목별 15분
    setExamStatus('running');
  };

  const handleSelectAnswer = (qIndex, optionIndex) => {
    if (examStatus !== 'running') return;
    setUserAnswers(prev => ({ ...prev, [qIndex]: optionIndex }));
  };

  const submitExam = () => setExamStatus('submitted');

  const resetExam = () => {
    setUserAnswers({});
    setCurrentQIndex(0);
    setFilterExplanation('all');
    setExamStatus('idle');
  };

  const scoreResult = useMemo(() => {
    let correctCount = 0;
    const subjectScores = { 1: { correct: 0, total: 0 }, 2: { correct: 0, total: 0 }, 3: { correct: 0, total: 0 }, 4: { correct: 0, total: 0 } };

    activeQuestions.forEach((q, idx) => {
      const isCorrect = userAnswers[idx] === q.answer;
      if (isCorrect) correctCount++;
      if (subjectScores[q.subject]) {
        subjectScores[q.subject].total += 1;
        if (isCorrect) subjectScores[q.subject].correct += 1;
      }
    });

    const scorePercentage = activeQuestions.length > 0 ? Math.round((correctCount / activeQuestions.length) * 100) : 0;
    const isPassed = scorePercentage >= 60;

    return {
      totalQuestions: activeQuestions.length,
      correctCount,
      wrongCount: activeQuestions.length - correctCount,
      scorePercentage,
      isPassed,
      subjectScores
    };
  }, [activeQuestions, userAnswers]);

  const formatTime = (seconds) => {
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
  };

  const subjectNames = { 1: '1과목: 승강기개론', 2: '2과목: 승강기보수', 3: '3과목: 기계·전기기초', 4: '4과목: 안전관리' };

  return (
    <div className="min-h-screen bg-slate-50 text-slate-800 font-sans flex flex-col">
      {/* 상단 통합 헤더 */}

            </button>

                      <span className="text-xs bg-orange-600 text-white font-bold px-2 py-0.5 rounded">60분 / 60문항</span>
                    </div>
                    <p className="text-xs text-slate-500">1~4과목 전 영역 풀이</p>
                  </button>

                  <button
                    onClick={() => startExam('sub1')}
                    className="p-4 rounded-xl border border-slate-200 bg-slate-50 hover:border-orange-400 transition-all"
                  >
                    <div className="flex justify-between items-center mb-1">
                      <span className="font-bold text-slate-800">🛗 1과목: 승강기개론</span>
                      <span className="text-xs bg-slate-200 text-slate-700 font-bold px-2 py-0.5 rounded">15분 / 15문항</span>
                    </div>
                    <p className="text-xs text-slate-500">구조, 속도분류, 안전장치 집중 풀이</p>
                  </button>

                  <button
                    onClick={() => startExam('sub2')}
                    className="p-4 rounded-xl border border-slate-200 bg-slate-50 hover:border-orange-400 transition-all"
                  >
                    <div className="flex justify-between items-center mb-1">
                      <span className="font-bold text-slate-800">🔧 2과목: 승강기보수</span>
                      <span className="text-xs bg-slate-200 text-slate-700 font-bold px-2 py-0.5 rounded">15분 / 15문항</span>
                    </div>
                    <p className="text-xs text-slate-500">와이어로프, 안전율, 기계실 기준 집중 풀이</p>
                  </button>

                  <button
                    onClick={() => startExam('sub3')}
                    className="p-4 rounded-xl border border-slate-200 bg-slate-50 hover:border-orange-400 transition-all"
                  >
                    <div className="flex justify-between items-center mb-1">
                      <span className="font-bold text-slate-800">⚙️ 3과목: 전기계이론</span>
                      <span className="text-xs bg-slate-200 text-slate-700 font-bold px-2 py-0.5 rounded">15분 / 15문항</span>
                    </div>
                    <p className="text-xs text-slate-500">하중, 전기측정, 전동기 이론 집중 풀이</p>
                  </button>

                  <button
                    onClick={() => startExam('sub4')}
                    className="p-4 rounded-xl border border-slate-200 bg-slate-50 hover:border-orange-400 transition-all"
                  >
                    <div className="flex justify-between items-center mb-1">
                      <span className="font-bold text-slate-800">🦺 4과목: 안전관리</span>
                      <span className="text-xs bg-slate-200 text-slate-700 font-bold px-2 py-0.5 rounded">15분 / 15문항</span>
                    </div>
                    <p className="text-xs text-slate-500">재해조사, 안전점검, 색채표지 집중 풀이</p>
                  </button>
                </div>

                <div className="bg-slate-50 rounded-xl p-4 border border-slate-100 text-xs text-slate-500 text-left space-y-1">
                  <p>• <strong>합격 기준</strong>: 100점 만점 중 60점 이상 (60문제 중 36문제 이상 정답 시 합격)</p>
                  <p>• <strong>주의 사항</strong>: 시험 종료 버튼을 누르면 즉시 채점 결과 및 상세 해설을 볼 수 있습니다.</p>
                </div>

                <a
                  href="https://www.comcbt.com/xe/k5"
                  target="_blank"
                  rel="noopener noreferrer"
                  className="w-full inline-flex items-center justify-center gap-2 rounded-xl bg-slate-900 hover:bg-orange-600 text-white px-5 py-3.5 text-sm font-bold shadow-sm transition-colors focus:outline-none focus:ring-4 focus:ring-orange-200"
                  aria-label="전자문제집 CBT ComCBT 새 창에서 열기"
                >
                  <span>🔗</span>
                  <span>전자문제집 CBT (ComCBT) 바로가기</span>
                </a>
              </div>
            )}

            {examStatus === 'running' && (
              <div className="grid grid-cols-1 lg:grid-cols-4 gap-6">
                <div className="lg:col-span-3 space-y-4">
                  <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80 flex justify-between items-center">
                    <div className="flex items-center space-x-3">
                      <span className="text-xs font-bold bg-orange-100 text-orange-700 px-2.5 py-1 rounded-lg">
                        {activeQuestions[currentQIndex]?.subjectName}
                      </span>
                      <span className="text-sm font-bold text-slate-700">
                        문제 {currentQIndex + 1} / {activeQuestions.length}
                      </span>
                    </div>

                    <div className="flex items-center space-x-3">
                      <div className="flex items-center space-x-1.5 font-mono text-base font-bold bg-slate-900 text-amber-400 px-3 py-1.5 rounded-xl shadow-inner">
                        <span>⏱️</span>
                        <span>{formatTime(timeLeft)}</span>
                      </div>
                      <button
                        onClick={submitExam}
                        className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs sm:text-sm px-3.5 py-2 rounded-xl transition-all shadow"
                      >
                        시험 제출
                      </button>
                    </div>
                  </div>

                  <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200/80 space-y-6">
                    <div className="space-y-2">
                      <span className="text-xs font-semibold text-slate-400">Q{currentQIndex + 1}.</span>
                      <h3 className="text-base sm:text-lg font-bold text-slate-900 leading-snug">
                        {activeQuestions[currentQIndex]?.question}
                      </h3>
                    </div>

                    <div className="space-y-3">
                      {activeQuestions[currentQIndex]?.options.map((opt, optIdx) => {
                        const isSelected = userAnswers[currentQIndex] === optIdx;
                        return (
                          <button
                            key={optIdx}
                            onClick={() => handleSelectAnswer(currentQIndex, optIdx)}
                            className={`w-full text-left p-3.5 rounded-xl border transition-all flex items-start space-x-3 ${
                              isSelected
                                ? 'border-orange-600 bg-orange-50/70 text-orange-900 font-semibold ring-2 ring-orange-500/20'
                                : 'border-slate-200 hover:border-slate-300 hover:bg-slate-50 text-slate-700'
                            }`}
                          >
                            <span
                              className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold shrink-0 mt-0.5 ${
                                isSelected ? 'bg-orange-600 text-white' : 'bg-slate-200 text-slate-600'
                              }`}
                            >
                              {optIdx + 1}
                            </span>
                            <span className="text-sm leading-relaxed">{opt}</span>
                          </button>
                        );
                      })}
                    </div>

                    <div className="flex justify-between items-center pt-4 border-t border-slate-100">
                      <button
                        onClick={() => setCurrentQIndex(prev => Math.max(0, prev - 1))}
                        disabled={currentQIndex === 0}
                        className="px-4 py-2 rounded-xl border border-slate-200 text-xs sm:text-sm font-semibold text-slate-600 hover:bg-slate-100 disabled:opacity-40 disabled:cursor-not-allowed"
                      >
                        ← 이전 문제
                      </button>

                      <span className="text-xs text-slate-400">
                        응답한 문항: {Object.keys(userAnswers).length} / {activeQuestions.length}
                      </span>

                      <button
                        onClick={() => setCurrentQIndex(prev => Math.min(activeQuestions.length - 1, prev + 1))}
                        disabled={currentQIndex === activeQuestions.length - 1}
                        className="px-4 py-2 rounded-xl bg-orange-600 hover:bg-orange-700 text-white text-xs sm:text-sm font-semibold transition-all disabled:opacity-40 disabled:cursor-not-allowed"
                      >
                        다음 문제 →
                      </button>
                    </div>
                  </div>
                </div>

                <div className="lg:col-span-1 bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80 flex flex-col h-fit max-h-[600px]">
                  <h4 className="text-sm font-bold text-slate-800 mb-3 flex items-center justify-between border-b pb-2">
                    <span>📋 OMR 답안지</span>
                    <span className="text-xs font-normal text-orange-600">
                      {Object.keys(userAnswers).length} 완료
                    </span>
                  </h4>

                  <div className="overflow-y-auto pr-1 space-y-1.5 flex-grow text-xs">
                    {activeQuestions.map((q, idx) => {
                      const isCurrent = currentQIndex === idx;
                      return (
                        <div
                          key={q.id}
                          onClick={() => setCurrentQIndex(idx)}
                          className={`p-2 rounded-lg flex items-center justify-between cursor-pointer transition-all ${
                            isCurrent ? 'bg-orange-50 border border-orange-300 font-bold' : 'hover:bg-slate-50'
                          }`}
                        >
                          <span className={`w-6 ${isCurrent ? 'text-orange-700' : 'text-slate-500'}`}>
                            {idx + 1}.
                          </span>
                          <div className="flex space-x-1">
                            {[0, 1, 2, 3].map(num => (
                              <span
                                key={num}
                                className={`w-5 h-5 rounded-full flex items-center justify-center text-[10px] ${
                                  userAnswers[idx] === num ? 'bg-slate-900 text-white font-bold' : 'bg-slate-100 text-slate-400'
                                }`}
                              >
                                {num + 1}
                              </span>
                            ))}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {examStatus === 'submitted' && (
              <div className="space-y-6">
                <div
                  className={`rounded-2xl p-6 sm:p-8 text-white shadow-md flex flex-col sm:flex-row items-center justify-between gap-6 ${
                    scoreResult.isPassed ? 'bg-gradient-to-r from-emerald-600 to-teal-700' : 'bg-gradient-to-r from-rose-600 to-pink-700'
                  }`}
                >
                  <div className="space-y-2 text-center sm:text-left">
                    <span className="px-3 py-1 rounded-full text-xs font-extrabold bg-white/20 uppercase tracking-wider">
                      CBT 채점 결과
                    </span>
                    <h2 className="text-3xl sm:text-4xl font-black">
                      {scoreResult.isPassed ? '🎉 축하합니다! 합격입니다.' : '📢 아쉽습니다. 불합격입니다.'}
                    </h2>
                    <p className="text-xs sm:text-sm text-white/90">
                      총 {scoreResult.totalQuestions}문항 중 {scoreResult.correctCount}문항 정답 (합격 기준: 60점 이상)
                    </p>
                  </div>

                  <div className="w-full sm:w-auto flex flex-col gap-3">
                    <div className="bg-white/10 backdrop-blur-md p-4 rounded-2xl border border-white/20 text-center min-w-[140px]">
                      <div className="text-4xl font-black tracking-tight">{scoreResult.scorePercentage}점</div>
                      <div className="text-xs text-white/80 mt-1">
                        {scoreResult.correctCount} / {scoreResult.totalQuestions} 문제
                      </div>
                    </div>
                    <button
                      type="button"
                      onClick={resetExam}
                      className="w-full px-4 py-2.5 rounded-xl bg-white text-slate-900 hover:bg-amber-100 text-xs sm:text-sm font-extrabold shadow transition-colors focus:outline-none focus:ring-4 focus:ring-white/30"
                    >
                      🔄 CBT 모의고사 처음으로
                    </button>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                  {[1, 2, 3, 4].map(subId => {
                    const subData = scoreResult.subjectScores[subId];
                    if (!subData || subData.total === 0) return null;

                    const subPercent = Math.round((subData.correct / subData.total) * 100);

                    return (
                      <div key={subId} className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200/80">
                        <div className="flex justify-between items-center mb-2">
                          <span className="text-xs font-bold text-slate-700">{subjectNames[subId]}</span>
                          <span className="text-xs font-extrabold text-orange-600">{subPercent}점</span>
                        </div>
                        <div className="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden">
                          <div
                            className={`h-2.5 rounded-full ${subPercent >= 60 ? 'bg-orange-600' : 'bg-rose-500'}`}
                            style={{ width: `${subPercent}%` }}
                          ></div>
                        </div>
                        <p className="text-[11px] text-slate-400 mt-2 text-right">
                          {subData.correct} / {subData.total} 문제 맞춤
                        </p>
                      </div>
                    );
                  })}
                </div>

                <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200/80 space-y-6">
                  <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 border-b pb-4">
                    <div>
                      <h3 className="text-lg font-bold text-slate-900">📝 문제별 정답 및 상세 해설</h3>
                      <p className="text-xs text-slate-500">틀린 문제를 복습하고 정답 및 해설을 확인하세요.</p>
                    </div>

                    <div className="flex items-center space-x-2">
                      <button
                        onClick={() => setFilterExplanation('all')}
                        className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${
                          filterExplanation === 'all' ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                        }`}
                      >
                        전체 문제 ({activeQuestions.length})
                      </button>
                      <button
                        onClick={() => setFilterExplanation('wrong')}
                        className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${
                          filterExplanation === 'wrong' ? 'bg-rose-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                        }`}
                      >
                        오답만 보기 ({scoreResult.wrongCount})
                      </button>
                      <button
                        onClick={resetExam}
                        className="px-3.5 py-1.5 bg-orange-600 hover:bg-orange-700 text-white rounded-xl text-xs font-bold shadow transition-all flex items-center gap-1"
                      >
                        🔄 재시험 / 초기화
                      </button>
                    </div>
                  </div>

                  <div className="space-y-6">
                    {activeQuestions.map((q, idx) => {
                      const userAns = userAnswers[idx];
                      const isCorrect = userAns === q.answer;

                      if (filterExplanation === 'wrong' && isCorrect) return null;

                      return (
                        <div
                          key={q.id}
                          className={`p-5 rounded-2xl border transition-all ${
                            isCorrect ? 'bg-slate-50/50 border-slate-200' : 'bg-rose-50/30 border-rose-200'
                          }`}
                        >
                          <div className="flex items-center justify-between mb-3">
                            <div className="flex items-center space-x-2">
                              <span
                                className={`px-2.5 py-0.5 rounded-lg text-xs font-extrabold ${
                                  isCorrect ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'
                                }`}
                              >
                                {isCorrect ? '✓ 정답' : '✗ 오답'}
                              </span>
                              <span className="text-xs font-bold text-slate-500">
                                [{q.subjectName}] {idx + 1}번 문제
                              </span>
                            </div>
                          </div>

                          <h4 className="text-base font-bold text-slate-900 mb-3">{q.question}</h4>

                          <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 mb-4 text-xs">
                            {q.options.map((opt, optIdx) => {
                              const isRightAnswer = q.answer === optIdx;
                              const isUserChosen = userAns === optIdx;

                              return (
                                <div
                                  key={optIdx}
                                  className={`p-2.5 rounded-xl border flex items-start space-x-2 ${
                                    isRightAnswer
                                      ? 'bg-emerald-100/60 border-emerald-300 font-bold text-emerald-900'
                                      : isUserChosen
                                      ? 'bg-rose-100/60 border-rose-300 text-rose-900 font-semibold'
                                      : 'bg-white border-slate-200 text-slate-600'
                                  }`}
                                >
                                  <span className="font-bold">{optIdx + 1}.</span>
                                  <span>{opt}</span>
                                  {isRightAnswer && <span className="ml-auto text-emerald-700">✓ 정답</span>}
                                  {isUserChosen && !isRightAnswer && <span className="ml-auto text-rose-700">내 선택</span>}
                                </div>
                              );
                            })}
                          </div>

                          <div className="bg-orange-50/80 border border-orange-200/80 rounded-xl p-3 text-xs text-orange-900 space-y-1">
                            <span className="font-extrabold text-orange-700 block">💡 상세 해설:</span>
                            <p className="leading-relaxed">{q.explanation}</p>
                          </div>
                        </div>
                      );
                    })}
                  </div>

                  <div className="pt-2">
                    <button
                      onClick={resetExam}
                      className="w-full py-3.5 bg-gradient-to-r from-rose-600 to-rose-700 hover:from-rose-700 hover:to-rose-800 text-white font-bold text-sm rounded-xl shadow-md transition-all flex items-center justify-center gap-2"
                    >
                      <span>🔄</span>
                      <span>시험 결과 지우기 및 모의고사 메인으로 돌아가기</span>
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>
        )}

      </main>

      <footer className="bg-slate-900 text-slate-400 text-xs text-center py-6 border-t border-slate-800">
        <div className="max-w-6xl mx-auto px-4 space-y-1">
          <p className="font-semibold text-slate-300">승강기기능사 자격시험 합격 마스터 김쌔미앙tv</p>
          <p className="text-slate-500">공개 요점정리 자료를 참고하여 제작되었습니다. 최신 출제기준은 Q-Net에서 확인하세요.</p>
        </div>
      </footer>
    </div>
  );
}

import { createRoot } from 'react-dom/client';
const bootEl = document.getElementById('boot');
if (bootEl) bootEl.remove();
createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
