                    if (!subData || subData.total === 0) return null;

                    const subPercent = Math.round((subData.correct / subData.total) * 100);
                    const subNames = { 1: '1과목: 전기이론', 2: '2과목: 전기기기', 3: '3과목: 전기설비' };

                    return (
                      <div key={subId} className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200/80">
                        <div className="flex justify-between items-center mb-2">
                          <span className="text-xs font-bold text-slate-700">{subNames[subId]}</span>
                          <span className="text-xs font-extrabold text-blue-600">{subPercent}점</span>
                        </div>
                        <div className="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden">
                          <div
                            className={`h-2.5 rounded-full ${
                              subPercent >= 60 ? 'bg-blue-600' : 'bg-rose-500'
                            }`}
                            style={{ width: `${subPercent}%` }}
                          ></div>
                        </div>
                        <p className="text-[11px] text-slate-400 mt-2 text-right">
                          {subData.correct} / {subData.total} 문제 맞춤
                        </p>
                      </div>
                    );
                  })}
                </div>

                {/* 오답 및 전 문항 상세 해설 리스트 */}
                <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200/80 space-y-6">
                  <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 border-b pb-4">
                    <div>
                      <h3 className="text-lg font-bold text-slate-900">📝 문제별 정답 및 상세 해설</h3>
                      <p className="text-xs text-slate-500">틀린 문제를 복습하고 정답 및 해설을 확인하세요.</p>
                    </div>

                    {/* 오답 보기 필터 및 초기화 리셋 버튼 */}
                    <div className="flex items-center space-x-2">
                      <button
                        onClick={() => setFilterExplanation('all')}
                        className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${
                          filterExplanation === 'all'
                            ? 'bg-slate-900 text-white'
                            : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                        }`}
                      >
                        전체 문제 ({activeQuestions.length})
                      </button>
                      <button
                        onClick={() => setFilterExplanation('wrong')}
                        className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${
                          filterExplanation === 'wrong'
                            ? 'bg-rose-600 text-white'
                            : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                        }`}
                      >
                        오답만 보기 ({scoreResult.wrongCount})
                      </button>
                      <button
                        onClick={resetExam}
                        className="px-3.5 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold shadow transition-all flex items-center gap-1"
                      >
                        🔄 재시험 / 초기화
                      </button>
                    </div>
                  </div>

                  {/* 문항별 상세 목록 */}
                  <div className="space-y-6">
                    {activeQuestions.map((q, idx) => {
                      const userAns = userAnswers[idx];
                      const isCorrect = userAns === q.answer;

                      if (filterExplanation === 'wrong' && isCorrect) return null;

                      return (
                        <div
                          key={q.id}
                          className={`p-5 rounded-2xl border transition-all ${
                            isCorrect
                              ? 'bg-slate-50/50 border-slate-200'
                              : 'bg-rose-50/30 border-rose-200'
                          }`}
                        >
                          {/* 문제 상단 헤더 */}
                          <div className="flex items-center justify-between mb-3">
                            <div className="flex items-center space-x-2">
                              <span
                                className={`px-2.5 py-0.5 rounded-lg text-xs font-extrabold ${
                                  isCorrect
                                    ? 'bg-emerald-100 text-emerald-800'
                                    : 'bg-rose-100 text-rose-800'
                                }`}
                              >
                                {isCorrect ? '✓ 정답' : '✗ 오답'}
                              </span>
                              <span className="text-xs font-bold text-slate-500">
                                [{q.subjectName}] {idx + 1}번 문제
                              </span>
                            </div>
                          </div>

                          {/* 문제 지문 */}
                          <h4 className="text-base font-bold text-slate-900 mb-3">{q.question}</h4>

                          {/* 보기 목록 */}
                          <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 mb-4 text-xs">
                            {q.options.map((opt, optIdx) => {
                              const isRightAnswer = q.answer === optIdx;
                              const isUserChosen = userAns === optIdx;

                              return (
                                <div
                                  key={optIdx}
                                  className={`p-2.5 rounded-xl border flex items-start space-x-2 ${
                                    isRightAnswer
                                      ? 'bg-emerald-100/60 border-emerald-300 font-bold text-emerald-900'
                                      : isUserChosen
                                      ? 'bg-rose-100/60 border-rose-300 text-rose-900 font-semibold'
                                      : 'bg-white border-slate-200 text-slate-600'
                                  }`}
                                >
                                  <span className="font-bold">{optIdx + 1}.</span>
                                  <span>{opt}</span>
                                  {isRightAnswer && <span className="ml-auto text-emerald-700">✓ 정답</span>}
                                  {isUserChosen && !isRightAnswer && <span className="ml-auto text-rose-700">내 선택</span>}
                                </div>
                              );
                            })}
                          </div>

                          {/* 해설 박스 */}
                          <div className="bg-blue-50/80 border border-blue-200/80 rounded-xl p-3 text-xs text-blue-900 space-y-1">
                            <span className="font-extrabold text-blue-700 block">💡 상세 해설:</span>
                            <p className="leading-relaxed">{q.explanation}</p>
                          </div>
                        </div>
                      );
                    })}
                  </div>

                  {/* 결과페이지 하단 외부 사이트 링크 배너 */}
                  <div className="pt-4 border-t border-slate-100 flex flex-col sm:flex-row items-center justify-between gap-3 text-xs text-slate-600 bg-slate-50 p-4 rounded-xl">
                    <span>💡 더 많은 회차별 기출문제 풀이가 필요하신가요?</span>
                    <a
                      href="https://www.comcbt.com/xe/jo"
                      target="_blank"
                      rel="noopener noreferrer"
                      className="px-3.5 py-2 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-lg transition-all"
                    >
                      ComCBT 기출문제 사이트 이동 ↗
                    </a>
                  </div>

                  {/* 결과 지우기 & 초기화 메인 이동 대형 하단 버튼 */}
                  <div className="pt-2">
                    <button
                      onClick={resetExam}
                      className="w-full py-3.5 bg-gradient-to-r from-rose-600 to-rose-700 hover:from-rose-700 hover:to-rose-800 text-white font-bold text-sm rounded-xl shadow-md transition-all flex items-center justify-center gap-2"
                    >
                      <span>🔄</span>
                      <span>시험 결과 지우기 및 모의고사 메인으로 돌아가기</span>
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>
        )}

      </main>

      {/* 바닥글 (Footer) */}
      <footer className="bg-slate-900 text-slate-400 text-xs text-center py-6 border-t border-slate-800">
        <div className="max-w-6xl mx-auto px-4 space-y-1">
          <p className="font-semibold text-slate-300">전기기능사 자격시험 합격 마스터 웹앱</p>
          <p className="text-slate-500">최신 한국전기설비규정(KEC) 및 산업인력공단 기출 출제기준 완벽 반영</p>
        </div>
      </footer>
    </div>
  );
}

import { createRoot } from 'react-dom/client';
const bootEl = document.getElementById('boot');
if (bootEl) bootEl.remove();
createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
