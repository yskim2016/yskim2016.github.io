  { term: '4핀 택트 스위치 핀', title: '내부 도통 구조', desc: '택트 스위치는 마주보는 두 핀끼리 내부에서 이미 연결되어 있습니다. 확실한 스위칭을 위해 대각선 위치 핀 2개를 사용하는 것이 안전합니다.' },
  { term: '저항 색띠 (Color Code)', title: '저항값 읽는 법', desc: '흑(0) 갈(1) 적(2) 등(3) 황(4) 녹(5) 청(6) 자(7) 회(8) 백(9) / 금(오차 5%) 은(오차 10%). 예: 갈-검-적-금 = 1-0-10² = 1,000Ω = 1kΩ' }
];

export default function App() {
  const [selectedCategory, setSelectedCategory] = useState('전체');
  const [selectedIcId, setSelectedIcId] = useState('resistor');
  const [searchQuery, setSearchQuery] = useState('');
  const [activeTabMode, setActiveTabMode] = useState('divider');
  const [hoveredPinNum, setHoveredPinNum] = useState(null);
  const [bookmarkedIcs, setBookmarkedIcs] = useState(['resistor', 'ne555', 'c1815']);
  const [isGlossaryOpen, setIsGlossaryOpen] = useState(false);
  const [isResistorSimOpen, setIsResistorSimOpen] = useState(false);

  const selectedComponent = useMemo(() => {
    return COMPONENT_DATA.find((c) => c.id === selectedIcId) || COMPONENT_DATA[0];
  }, [selectedIcId]);

  const handleSelectComponent = (id) => {
    setSelectedIcId(id);
    const target = COMPONENT_DATA.find((i) => i.id === id);
    if (target && target.circuitModes && target.circuitModes.length > 0) {
      setActiveTabMode(target.circuitModes[0].id);
    }
    setHoveredPinNum(null);
  };

  const filteredComponents = useMemo(() => {
    return COMPONENT_DATA.filter((comp) => {
      const matchCategory =
        selectedCategory === '전체' || comp.category === selectedCategory;
      const matchQuery =
        comp.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
        comp.englishName.toLowerCase().includes(searchQuery.toLowerCase()) ||
        comp.description.toLowerCase().includes(searchQuery.toLowerCase()) ||
        comp.pins.some(
          (p) =>
            p.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
            p.role.toLowerCase().includes(searchQuery.toLowerCase())
        );
      return matchCategory && matchQuery;
    });
  }, [selectedCategory, searchQuery]);

  const toggleBookmark = (id, e) => {
    e.stopPropagation();
    setBookmarkedIcs((prev) =>
      prev.includes(id) ? prev.filter((item) => item !== id) : [...prev, id]
    );
  };

  const categories = [
    '전체',
    '수동소자/스위치',
    'TR/FET',
    '논리 게이트',
    '타이머/카운터',
    '증폭기/레귤레이터'
  ];

  return (
    <div className="min-h-screen bg-[#FAF8F5] text-stone-800 font-sans flex flex-col antialiased">
      {/* Top Header */}
      <header className="bg-white border-b border-stone-200 sticky top-0 z-30 shadow-sm">
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
          <div
            className="flex items-center gap-3 cursor-pointer"
            onClick={() => handleSelectComponent('resistor')}
          >
            <div className="w-10 h-10 rounded-xl bg-orange-500 text-white flex items-center justify-center shadow-md shadow-orange-500/20">
              <Cpu className="w-6 h-6" />
            </div>
            <div>
              <h1 className="font-bold text-lg text-stone-900 tracking-tight leading-none flex items-center gap-2">
                전자기능사 <span className="text-orange-600">IC &amp; 소자 가이드</span>
              </h1>
              <p className="text-xs text-stone-500 mt-0.5">
                실물 핀배치 ↔ 회로 기호 심볼 매칭 • 권장 연결 회로도
              </p>
            </div>
          </div>

          <div className="flex-1 max-w-md relative hidden md:block">
            <Search className="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-stone-400" />
            <input
              type="text"
              placeholder="부품명, 핀 이름, 저항, 게이트 검색..."
              value={searchQuery}
              onChange={(e) => setSearchQuery(e.target.value)}
              className="w-full pl-10 pr-4 py-2 text-sm bg-stone-100 hover:bg-stone-100/80 focus:bg-white border border-transparent focus:border-orange-400 rounded-full transition outline-none text-stone-800"
            />
            {searchQuery && (
              <button
                onClick={() => setSearchQuery('')}
                className="absolute right-3 top-1/2 -translate-y-1/2 text-stone-400 hover:text-stone-600"
              >
                <X className="w-4 h-4" />
              </button>
            )}
          </div>

          <div className="flex items-center gap-2">
            <button
              onClick={() => {
                handleSelectComponent('resistor');
                setIsResistorSimOpen(true);
              }}
              className="flex items-center gap-1.5 px-3 py-2 rounded-xl border border-orange-200 bg-orange-50 hover:bg-orange-100 text-orange-700 font-bold text-xs transition shadow-sm"
            >
              <Calculator className="w-4 h-4 text-orange-600" />
              <span>저항 색띠 계산기</span>
            </button>

            <button
              onClick={() => setIsGlossaryOpen(true)}
              className="flex items-center gap-1.5 px-3.5 py-2 rounded-xl border border-stone-200 hover:border-orange-300 bg-stone-50 hover:bg-orange-50/50 text-stone-700 hover:text-orange-600 font-medium text-xs transition"
            >
              <BookOpen className="w-4 h-4 text-orange-500" />
              <span>기초 용어</span>
            </button>
          </div>
        </div>

        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-2 border-t border-stone-100 flex flex-col md:flex-row gap-2 items-stretch md:items-center justify-between">
          <div className="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-1">
            {categories.map((cat) => (
              <button
                key={cat}
                onClick={() => setSelectedCategory(cat)}
                className={`px-3.5 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition ${
                  selectedCategory === cat
                    ? 'bg-orange-500 text-white shadow-sm shadow-orange-500/30'
                    : 'bg-stone-100 text-stone-600 hover:bg-stone-200'
                }`}
              >
                {cat}
              </button>
            ))}
          </div>
        </div>
      </header>

      {/* Main Area */}
      <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1 w-full grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
        {/* Left Sidebar */}
        <aside className="lg:col-span-4 bg-white rounded-2xl border border-stone-200 shadow-sm p-4 flex flex-col gap-3">
          <div className="flex items-center justify-between px-1 pb-1 border-b border-stone-100">
            <h2 className="font-bold text-stone-800 text-base">부품 도감 목록</h2>
            <span className="text-xs font-semibold text-orange-600 bg-orange-50 px-2.5 py-0.5 rounded-full border border-orange-200/60">
              {filteredComponents.length}개
            </span>
          </div>

          <div className="flex flex-col gap-2 max-h-[calc(100vh-220px)] overflow-y-auto pr-1">
            {filteredComponents.map((comp) => {
              const isSelected = selectedComponent.id === comp.id;
              const isBookmarked = bookmarkedIcs.includes(comp.id);
              return (
                <div
                  key={comp.id}
                  onClick={() => handleSelectComponent(comp.id)}
                  className={`group relative p-3 rounded-xl border transition cursor-pointer flex gap-3 items-center ${
                    isSelected
                      ? 'bg-orange-50/70 border-orange-400 shadow-sm ring-1 ring-orange-400/20'
                      : 'bg-white border-stone-200/80 hover:border-orange-200 hover:bg-stone-50/70'
                  }`}
                >
                  <div
                    className={`w-11 h-11 rounded-xl flex-shrink-0 flex items-center justify-center font-mono font-bold text-xs p-1 text-center transition ${
                      isSelected
                        ? 'bg-stone-900 text-white shadow-inner'
                        : 'bg-stone-800 text-stone-200 group-hover:bg-stone-900'
                    }`}
                  >
                    <span className="leading-tight text-[10px]">
                      {comp.name.split(' ')[0]}
                    </span>
                  </div>

                  <div className="flex-1 min-w-0">
                    <div className="flex items-center justify-between gap-1">
                      <h3
                        className={`font-bold text-xs sm:text-sm truncate ${
                          isSelected ? 'text-orange-700' : 'text-stone-900'
                        }`}
                      >
                        {comp.name}
                      </h3>
                      <button
                        onClick={(e) => toggleBookmark(comp.id, e)}
                        className="text-stone-300 hover:text-orange-500 p-0.5 transition"
                      >
                        {isBookmarked ? (
                          <BookmarkCheck className="w-4 h-4 text-orange-500 fill-orange-500" />
                        ) : (
                          <Bookmark className="w-4 h-4" />
                        )}
                      </button>
                    </div>
                    <p className="text-[11px] text-stone-500 line-clamp-1 mt-0.5">
                      {comp.description}
                    </p>
                  </div>
                </div>
              );
            })}
          </div>
        </aside>

        {/* Right Detail */}
        <section className="lg:col-span-8 flex flex-col gap-6">
          {/* Header Card */}
          <div className="bg-white rounded-2xl border border-stone-200 p-6 shadow-sm">
            <div className="flex flex-wrap items-start justify-between gap-3">
              <div>
                <div className="flex items-center gap-2 mb-1.5">
                  <span className="px-2.5 py-0.5 text-[11px] font-bold text-orange-600 bg-orange-100/70 border border-orange-200 rounded-md">
                    {selectedComponent.tag}
                  </span>
                  <span className="text-xs text-stone-400 font-mono">
                    {selectedComponent.englishName}
                  </span>
                </div>
                <h2 className="text-2xl sm:text-3xl font-extrabold text-stone-900">
                  {selectedComponent.name}
                </h2>
                <p className="text-sm text-stone-600 mt-1">
                  {selectedComponent.description}
                </p>
              </div>

              {selectedComponent.id === 'resistor' && (
                <button
                  onClick={() => setIsResistorSimOpen(true)}
                  className="px-3.5 py-2 rounded-xl bg-orange-500 hover:bg-orange-600 text-white font-bold text-xs shadow-md shadow-orange-500/20 flex items-center gap-1.5 transition"
                >
                  <Calculator className="w-4 h-4" />
                  <span>색띠 계산기 열기</span>
                </button>
              )}
            </div>
          </div>

          {/* Dual Symbol & Package Visualizer */}
          <div className="bg-white rounded-2xl border border-stone-200 p-5 shadow-sm">
            <div className="flex items-center justify-between border-b border-stone-100 pb-2 mb-3">
              <div className="flex items-center gap-2 text-stone-800 font-bold text-base">
                <Cpu className="w-4 h-4 text-orange-500" />
                <h3>외형 패키지 &amp; 회로 기호 심볼 (핀 매칭)</h3>
              </div>
              <span className="text-[11px] text-orange-600 font-semibold bg-orange-50 px-2 py-0.5 rounded border border-orange-200/50">
                실물 핀 ↔ 심볼 단자 매칭
              </span>
            </div>

            <div className="py-3 flex items-center justify-center bg-stone-50/70 rounded-xl border border-stone-200/80">
              <DualPackageSymbolSvg
                comp={selectedComponent}
                hoveredPinNum={hoveredPinNum}
                setHoveredPinNum={setHoveredPinNum}
              />
            </div>
          </div>

          {/* Pin Configuration Table */}
          <div className="bg-white rounded-2xl border border-stone-200 p-5 shadow-sm">
            <div className="flex items-center gap-2 text-stone-800 font-bold text-base mb-3 border-b border-stone-100 pb-2">
              <Layers className="w-4 h-4 text-orange-500" />
              <h3>단자 / 핀 역할 및 사양</h3>
            </div>
            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs">
                <thead>
                  <tr className="bg-stone-100/70 text-stone-600 font-semibold border-b border-stone-200">
                    <th className="py-2.5 px-3 w-16 text-center">핀 번호</th>
                    <th className="py-2.5 px-3 w-28">핀 / 단자 명</th>
                    <th className="py-2.5 px-3 w-32">역할</th>
                    <th className="py-2.5 px-3">상세 설명</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-stone-100 text-stone-700">
                  {selectedComponent.pins.map((pin) => {
                    const isHovered = hoveredPinNum === pin.num;
                    return (
                      <tr
                        key={pin.num}
                        onMouseEnter={() => setHoveredPinNum(pin.num)}
                        onMouseLeave={() => setHoveredPinNum(null)}
                        className={`transition cursor-pointer ${
                          isHovered
                            ? 'bg-orange-50 font-medium text-orange-900'
                            : 'hover:bg-stone-50'
                        }`}
                      >
                        <td className="py-2.5 px-3 text-center">
                          <span
                            className={`inline-block w-6 h-6 rounded-full text-center leading-6 text-xs font-bold ${
                              isHovered
                                ? 'bg-orange-500 text-white'
                                : 'bg-stone-200 text-stone-700'
                            }`}
                          >
                            {pin.num}
                          </span>
                        </td>
                        <td className="py-2.5 px-3 font-mono font-bold text-stone-900">
                          {pin.name}
                        </td>
                        <td className="py-2.5 px-3 font-semibold text-orange-600">
                          {pin.role}
                        </td>
                        <td className="py-2.5 px-3 text-stone-600">
                          {pin.desc}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>

          {/* Recommended Connection Schematics */}
          <div className="bg-white rounded-2xl border border-stone-200 p-6 shadow-sm">
            <div className="flex flex-wrap items-center justify-between gap-3 border-b border-stone-100 pb-3 mb-4">
              <div className="flex items-center gap-2 text-stone-900 font-bold text-lg">
                <Zap className="w-5 h-5 text-orange-500" />
                <h3>권장 연결방법 및 시각 회로도</h3>
              </div>

              {selectedComponent.circuitModes &&
                selectedComponent.circuitModes.length > 0 && (
                  <div className="flex items-center gap-1.5 bg-stone-100 p-1 rounded-xl">
                    {selectedComponent.circuitModes.map((mode) => (
                      <button
                        key={mode.id}
                        onClick={() => setActiveTabMode(mode.id)}
                        className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${
                          activeTabMode === mode.id
                            ? 'bg-orange-500 text-white shadow-sm'
                            : 'text-stone-600 hover:text-stone-900 hover:bg-stone-200/60'
                        }`}
                      >
                        {mode.name}
                      </button>
                    ))}
                  </div>
                )}
            </div>

            {selectedComponent.circuitModes && (
              <div className="bg-stone-50 border border-stone-200/80 rounded-xl p-3.5 mb-5 text-xs text-stone-700 flex items-start gap-2">
                <Info className="w-4 h-4 text-orange-500 flex-shrink-0 mt-0.5" />
                <div>
                  <span className="font-bold text-stone-900 mr-1.5">
                    [
                    {
                      selectedComponent.circuitModes.find(
                        (m) => m.id === activeTabMode
                      )?.name
                    }
                    ]
                  </span>
                  {
                    selectedComponent.circuitModes.find(
                      (m) => m.id === activeTabMode
                    )?.desc
                  }
                </div>
              </div>
            )}

            <div className="bg-stone-50/80 rounded-2xl border border-stone-200 p-6 flex items-center justify-center min-h-[260px] relative overflow-hidden">
              <CircuitSchematicSvg
                icId={selectedComponent.id}
                modeId={activeTabMode}
                hoveredPinNum={hoveredPinNum}
              />
            </div>

            {selectedComponent.warning && (
              <div className="mt-5 bg-orange-50/80 border border-orange-200 rounded-xl p-4 flex items-center gap-3">
                <AlertTriangle className="w-5 h-5 text-orange-500 flex-shrink-0" />
                <p className="text-xs text-orange-800 font-medium leading-relaxed">
                  {selectedComponent.warning}
                </p>
              </div>
            )}
          </div>
        </section>
      </main>

      {/* Footer */}
      <footer className="bg-white border-t border-stone-200 py-6 mt-10 text-center text-xs text-stone-500">
        <p className="font-medium">전자기능사 실기 및 필기 시험 대비 IC &amp; 소자 통합 가이드</p>
      </footer>

      {/* Resistor Modal */}
      {isResistorSimOpen && (
        <div className="fixed inset-0 z-50 bg-stone-900/50 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl max-w-2xl w-full p-6 shadow-2xl border border-stone-200 flex flex-col gap-4 max-h-[90vh] overflow-y-auto animate-in fade-in zoom-in-95 duration-150">
            <div className="flex items-center justify-between border-b border-stone-100 pb-3">
              <div className="flex items-center gap-2 font-bold text-lg text-stone-900">
                <Calculator className="w-5 h-5 text-orange-500" />
                <h2>대화형 저항 색띠 시뮬레이터 (4색 / 5색)</h2>
              </div>
              <button
                onClick={() => setIsResistorSimOpen(false)}
                className="p-1 text-stone-400 hover:text-stone-600 rounded-lg hover:bg-stone-100"
              >
                <X className="w-5 h-5" />
              </button>
            </div>
            <ResistorSimulatorView />
            <div className="pt-2 border-t border-stone-100 text-right">
              <button
                onClick={() => setIsResistorSimOpen(false)}
                className="px-5 py-2 bg-stone-900 hover:bg-stone-800 text-white rounded-xl text-xs font-bold transition"
              >
                닫기
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Glossary Modal */}
      {isGlossaryOpen && (
        <div className="fixed inset-0 z-50 bg-stone-900/40 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl border border-stone-200 flex flex-col gap-4 animate-in fade-in zoom-in-95 duration-150">
            <div className="flex items-center justify-between border-b border-stone-100 pb-3">
              <div className="flex items-center gap-2 font-bold text-lg text-stone-900">
                <BookOpen className="w-5 h-5 text-orange-500" />
                <h2>전자기능사 기초 용어 가이드</h2>
              </div>
              <button
                onClick={() => setIsGlossaryOpen(false)}
                className="p-1 text-stone-400 hover:text-stone-600 rounded-lg hover:bg-stone-100"
              >
                <X className="w-5 h-5" />
              </button>
            </div>
            <div className="space-y-3 max-h-[60vh] overflow-y-auto pr-1">
              {GLOSSARY_DATA.map((item, idx) => (
                <div key={idx} className="bg-stone-50 border border-stone-200/80 rounded-xl p-3.5 text-xs">
                  <div className="flex items-center justify-between font-bold text-stone-900 mb-1">
                    <span className="text-orange-600 font-mono text-sm">{item.term}</span>
                    <span className="text-stone-500 text-[11px]">{item.title}</span>
                  </div>
                  <p className="text-stone-600 leading-relaxed">{item.desc}</p>
                </div>
              ))}
            </div>
            <div className="pt-2 border-t border-stone-100 text-right">
              <button
                onClick={() => setIsGlossaryOpen(false)}
                className="px-4 py-2 bg-stone-900 hover:bg-stone-800 text-white rounded-xl text-xs font-bold transition"
              >
                닫기
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ==========================================
// Interactive Resistor Color Code Simulator View
// ==========================================
function ResistorSimulatorView() {
  const [bandCount, setBandCount] = useState(4);
  const [inputMode, setInputMode] = useState('colorToVal');
  const [band1, setBand1] = useState('brown');
  const [band2, setBand2] = useState('black');
  const [band3, setBand3] = useState('black');
  const [multiplier, setMultiplier] = useState('red');
  const [tolerance, setTolerance] = useState('gold');
  const [valInput, setValInput] = useState('1000');
  const [unitInput, setUnitInput] = useState('ohms');

  const calculatedOhms = useMemo(() => {
    const b1 = COLOR_CODES.find((c) => c.id === band1)?.digit ?? 0;
    const b2 = COLOR_CODES.find((c) => c.id === band2)?.digit ?? 0;
    const b3 = COLOR_CODES.find((c) => c.id === band3)?.digit ?? 0;
    const multObj = COLOR_CODES.find((c) => c.id === multiplier);
    const mult = multObj ? multObj.mult : 1;

    let baseVal = 0;
    if (bandCount === 4) {
      baseVal = b1 * 10 + b2;
    } else {
      baseVal = b1 * 100 + b2 * 10 + b3;
    }
    return baseVal * mult;
  }, [bandCount, band1, band2, band3, multiplier]);

  const currentTolerance = useMemo(() => {
    const tolObj = COLOR_CODES.find((c) => c.id === tolerance);
    return tolObj ? tolObj.tol : 5;
  }, [tolerance]);

  const applyValueToBands = (valNum) => {
    if (!valNum || valNum <= 0) return;

    let num = valNum;
    if (unitInput === 'kOhms') num *= 1000;
    if (unitInput === 'mOhms') num *= 1000000;

    if (bandCount === 4) {
      let exp = Math.floor(Math.log10(num)) - 1;
      let norm = Math.round(num / Math.pow(10, exp));
      if (norm >= 100) {
        norm = Math.round(norm / 10);
        exp += 1;
      }
      const d1 = Math.floor(norm / 10);
      const d2 = norm % 10;

      const c1 = COLOR_CODES.find((c) => c.digit === d1)?.id || 'brown';
      const c2 = COLOR_CODES.find((c) => c.digit === d2)?.id || 'black';

      const multVal = Math.pow(10, exp);
      let multObj = COLOR_CODES.find((c) => Math.abs(c.mult - multVal) < 0.0001);
      if (!multObj) multObj = COLOR_CODES.find((c) => c.id === 'black');

      setBand1(c1);
      setBand2(c2);
      if (multObj) setMultiplier(multObj.id);
    } else {
      let exp = Math.floor(Math.log10(num)) - 2;
      let norm = Math.round(num / Math.pow(10, exp));
      if (norm >= 1000) {
        norm = Math.round(norm / 10);
        exp += 1;
      }
      const d1 = Math.floor(norm / 100);
      const d2 = Math.floor((norm % 100) / 10);
      const d3 = norm % 10;

      const c1 = COLOR_CODES.find((c) => c.digit === d1)?.id || 'brown';
      const c2 = COLOR_CODES.find((c) => c.digit === d2)?.id || 'black';
      const c3 = COLOR_CODES.find((c) => c.digit === d3)?.id || 'black';

      const multVal = Math.pow(10, exp);
      let multObj = COLOR_CODES.find((c) => Math.abs(c.mult - multVal) < 0.0001);
      if (!multObj) multObj = COLOR_CODES.find((c) => c.id === 'black');

      setBand1(c1);
      setBand2(c2);
      setBand3(c3);
      if (multObj) setMultiplier(multObj.id);
    }
  };

  const presetValues = [
    { label: '330 Ω', val: 330, unit: 'ohms' },
    { label: '1 kΩ', val: 1, unit: 'kOhms' },
    { label: '4.7 kΩ', val: 4.7, unit: 'kOhms' },
    { label: '10 kΩ', val: 10, unit: 'kOhms' },
    { label: '100 kΩ', val: 100, unit: 'kOhms' },
    { label: '1 MΩ', val: 1, unit: 'mOhms' }
  ];

  return (
    <div className="flex flex-col gap-4">
      <div className="flex flex-wrap items-center justify-between gap-2 bg-stone-100 p-2 rounded-xl text-xs">
        <div className="flex items-center gap-1">
          <span className="font-bold text-stone-700 mr-1">색띠:</span>
          <button
            onClick={() => setBandCount(4)}
            className={`px-3 py-1.5 rounded-lg font-bold transition ${
              bandCount === 4 ? 'bg-orange-500 text-white' : 'bg-white text-stone-600'
            }`}
          >
            4색띠
          </button>
          <button
            onClick={() => setBandCount(5)}
            className={`px-3 py-1.5 rounded-lg font-bold transition ${
              bandCount === 5 ? 'bg-orange-500 text-white' : 'bg-white text-stone-600'
            }`}
          >
            5색띠
          </button>
        </div>

        <div className="flex items-center gap-1 bg-white p-0.5 rounded-lg border border-stone-200">
          <button
            onClick={() => setInputMode('colorToVal')}
            className={`px-2 py-1 rounded font-semibold transition ${
              inputMode === 'colorToVal' ? 'bg-stone-900 text-white' : 'text-stone-600'
            }`}
          >
            색상 선택 ➔ 저항값
          </button>
          <button
            onClick={() => setInputMode('valToColor')}
            className={`px-2 py-1 rounded font-semibold transition ${
              inputMode === 'valToColor' ? 'bg-stone-900 text-white' : 'text-stone-600'
            }`}
          >
            숫자 입력 ➔ 색띠
          </button>
        </div>
      </div>

      <div className="bg-stone-900 rounded-2xl p-5 flex flex-col items-center justify-center relative shadow-inner">
        <ResistorGraphicSvg
          bandCount={bandCount}
          b1={COLOR_CODES.find((c) => c.id === band1)?.color}
          b2={COLOR_CODES.find((c) => c.id === band2)?.color}
          b3={COLOR_CODES.find((c) => c.id === band3)?.color}
          mult={COLOR_CODES.find((c) => c.id === multiplier)?.color}
          tol={COLOR_CODES.find((c) => c.id === tolerance)?.color}
        />

        <div className="mt-3 bg-white/10 px-5 py-2 rounded-full border border-white/20 text-center">
          <div className="text-xl font-black text-amber-400 font-mono">
            {formatResistance(calculatedOhms)}{' '}
            <span className="text-xs font-normal text-amber-200/80">(±{currentTolerance}%)</span>
          </div>
        </div>
      </div>

      {inputMode === 'colorToVal' && (
        <div className="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-5 gap-2 text-xs">
          <div className="bg-stone-50 border p-2 rounded-xl">
            <p className="font-bold text-stone-700 mb-1">1번째 색</p>
            <select value={band1} onChange={(e) => setBand1(e.target.value)} className="w-full p-1.5 bg-white border rounded font-bold">
              {COLOR_CODES.filter((c) => c.digit !== undefined && c.digit !== 0).map((c) => (
                <option key={c.id} value={c.id}>{c.digit} - {c.name}</option>
              ))}
            </select>
          </div>
          <div className="bg-stone-50 border p-2 rounded-xl">
            <p className="font-bold text-stone-700 mb-1">2번째 색</p>
            <select value={band2} onChange={(e) => setBand2(e.target.value)} className="w-full p-1.5 bg-white border rounded font-bold">
              {COLOR_CODES.filter((c) => c.digit !== undefined).map((c) => (
                <option key={c.id} value={c.id}>{c.digit} - {c.name}</option>
              ))}
            </select>
          </div>
          {bandCount === 5 && (
            <div className="bg-stone-50 border p-2 rounded-xl">
              <p className="font-bold text-stone-700 mb-1">3번째 색</p>
              <select value={band3} onChange={(e) => setBand3(e.target.value)} className="w-full p-1.5 bg-white border rounded font-bold">
                {COLOR_CODES.filter((c) => c.digit !== undefined).map((c) => (
                  <option key={c.id} value={c.id}>{c.digit} - {c.name}</option>
                ))}
              </select>
            </div>
          )}
          <div className="bg-stone-50 border p-2 rounded-xl">
            <p className="font-bold text-stone-700 mb-1">승수 (배율)</p>
            <select value={multiplier} onChange={(e) => setMultiplier(e.target.value)} className="w-full p-1.5 bg-white border rounded font-bold">
              {COLOR_CODES.filter((c) => c.mult !== undefined).map((c) => (
                <option key={c.id} value={c.id}>x{c.mult} - {c.name}</option>
              ))}
            </select>
          </div>
          <div className="bg-stone-50 border p-2 rounded-xl">
            <p className="font-bold text-stone-700 mb-1">허용 오차</p>
            <select value={tolerance} onChange={(e) => setTolerance(e.target.value)} className="w-full p-1.5 bg-white border rounded font-bold">
              {COLOR_CODES.filter((c) => c.tol !== undefined).map((c) => (
                <option key={c.id} value={c.id}>±{c.tol}% - {c.name}</option>
              ))}
            </select>
          </div>
        </div>
      )}

      {inputMode === 'valToColor' && (
        <div className="bg-stone-50 border p-3 rounded-2xl flex flex-col gap-2.5">
          <div className="flex gap-2">
            <input
              type="number"
              value={valInput}
              onChange={(e) => {
                setValInput(e.target.value);
                applyValueToBands(parseFloat(e.target.value));
              }}
              placeholder="예: 330, 4.7"
              className="flex-1 text-sm font-mono font-bold p-2 bg-white border rounded-xl"
            />
            <select
              value={unitInput}
              onChange={(e) => {
                setUnitInput(e.target.value);
                const num = parseFloat(valInput);
                if (num) applyValueToBands(num);
              }}
              className="text-xs font-bold p-2 bg-white border rounded-xl"
            >
              <option value="ohms">Ω</option>
              <option value="kOhms">kΩ</option>
              <option value="mOhms">MΩ</option>
            </select>
          </div>
          <div className="flex flex-wrap gap-1">
            {presetValues.map((p, idx) => (
              <button
                key={idx}
                onClick={() => {
                  setValInput(p.val.toString());
                  setUnitInput(p.unit);
                  let multVal = p.val;
                  if (p.unit === 'kOhms') multVal *= 1000;
                  if (p.unit === 'mOhms') multVal *= 1000000;
                  applyValueToBands(multVal);
                }}
                className="px-2 py-1 bg-white border rounded text-xs font-bold hover:bg-orange-50"
              >
                {p.label}
              </button>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}
